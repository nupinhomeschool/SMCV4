              private fun push(json: String) {
                  webView.evaluateJavascript("($feedJs)($json)") { r ->
                      val res = (r ?: "").trim('"')
                      when {
                          res.startsWith("OK") -> { undelivered = false; setSendStatus("✓ ส่งเข้า Web App แล้ว", true) }
                          res.startsWith("WAIT") -> { undelivered = false; setSendStatus("กำลังเปิดเครื่องมือ NFC ในเว็บ...", true) }
                          else -> { undelivered = true; setSendStatus("✗ $res", false); toast("ส่งเข้า Web App ไม่สำเร็จ: $res") }
                      }
                  }
              }

              /** ข้อมูลทดสอบ (ตัวอย่าง 3.31 V) ใช้เช็กว่าท่อส่งข้อมูลเข้าเว็บทำงานไหม โดยไม่ต้องใช้มิเตอร์ */
              private fun testDumpJson(): String {
                  val d = ByteArray(8192)
                  "69 10 00 04".split(" ").forEachIndexed { i, h -> d[72 + i] = h.toInt(16).toByte() }
                  ("00 00 00 00 19 85 B5 B5 B5 B5 B5 B5 00 00 00 17 06 16 04 20 25 11 FF 76")
                      .split(" ").forEachIndexed { i, h -> d[188 + i] = h.toInt(16).toByte() }
                  return JSONObject().put("ok", true).put("uid", "TEST").put("start", 0)
                      .put("length", d.size).put("hex", d.toHex())
                      .put("unreadableBlocks", JSONArray()).toString()
              }

