              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun rounded(color: Int, radiusDp: Int, strokeColor: Int = 0, strokeDp: Int = 0): GradientDrawable {
                  val g = GradientDrawable()
                  g.cornerRadius = dp(radiusDp).toFloat()
                  g.setColor(color)
                  if (strokeDp > 0) g.setStroke(dp(strokeDp), strokeColor)
                  return g
              }

              private fun label(t: String, sp: Float, color: Int, bold: Boolean = false): TextView {
                  val tv = TextView(this)
                  tv.text = t
                  tv.textSize = sp
                  tv.setTextColor(color)
                  tv.typeface = if (bold) tfBold else tfReg
                  return tv
              }

              private fun pill(text: String, filled: Boolean, onClick: () -> Unit): Button {
                  val b = Button(this)
                  b.text = text
                  b.isAllCaps = false
                  b.textSize = 14f
                  b.typeface = tfBold
                  b.setTextColor(Color.WHITE)
                  if (filled) {
                      val g = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(cSky, cBlue))
                      g.cornerRadius = dp(16).toFloat()
                      b.background = g
                  } else {
                      b.background = rounded(Color.argb(30, 255, 255, 255), 16, Color.argb(190, 255, 255, 255), 1)
                  }
                  b.minHeight = 0
                  b.minimumHeight = 0
                  b.setPadding(dp(12), dp(12), dp(12), dp(12))
                  b.setOnClickListener { onClick() }
                  return b
              }

              /** โลโก้ Flo Sensor Lab (ไฟล์ png สีขาวพื้นโปร่งใสในโฟลเดอร์ assets) ถ้าไม่มีไฟล์ก็ข้าม ไม่ทำให้แอปพัง */
              private fun logoImage(asset: String, scale: ImageView.ScaleType): ImageView {
                  val iv = ImageView(this)
                  try {
                      iv.setImageBitmap(BitmapFactory.decodeStream(assets.open(asset)))
                  } catch (e: Exception) {
                      iv.visibility = View.GONE
                  }
                  iv.scaleType = scale
                  return iv
              }

              private fun infoRow(name: String, value: TextView): View {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.setPadding(0, dp(6), 0, dp(6))
                  row.addView(label(name, 13f, cMuted), LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT))
                  row.addView(value, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f).apply { marginStart = dp(12) })
                  return row
              }

              private fun makeBar(c1: Int, c2: Int): LayerDrawable {
                  val bg = GradientDrawable()
                  bg.cornerRadius = 100f
                  bg.setColor(Color.argb(60, 255, 255, 255))
                  val fg = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(c1, c2))
                  fg.cornerRadius = 100f
                  val clip = ClipDrawable(fg, Gravity.START, ClipDrawable.HORIZONTAL)
                  val layers = LayerDrawable(arrayOf<Drawable>(bg, clip))
                  layers.setId(0, android.R.id.background)
                  layers.setId(1, android.R.id.progress)
                  return layers
              }

