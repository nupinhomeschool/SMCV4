              private fun setBar(c1: Int, c2: Int, pct: Int) {
                  rdBar.progressDrawable = makeBar(c1, c2)
                  rdBar.progress = pct
              }

              private fun fmt(v: Double, digits: Int = 1): String = String.format(Locale.US, "%." + digits + "f", v)

              private fun uiIdle() {
                  ring.set(0f, "พร้อมอ่าน", "0%", "แตะมิเตอร์ได้เลย", cSky, cBlue)
                  setBar(cSky, cBlue, 0)
                  rdDetail.text = "อ่านแล้ว 0 / 0 blocks"
                  rdHint.text = "แตะโทรศัพท์ที่มิเตอร์ SMCV4 แล้วถือให้นิ่งจนครบ 100%"
              }

              private fun uiReading() {
                  token++
                  attemptNo = 1
                  ring.set(0f, "กำลังอ่าน", "0%", "กำลังเชื่อมต่อชิป", cSky, cBlue)
                  setBar(cSky, cBlue, 0)
                  rdDetail.text = "กำลังเชื่อมต่อชิป..."
                  rdHint.text = "อย่าเอาโทรศัพท์ออกจากมิเตอร์จนกว่าจะครบ 100%"
                  valSend.text = "ยังไม่ได้ส่ง"
                  valSend.setTextColor(cMuted)
                  valUid.text = "—"
                  valMeter.text = "—"
                  valSize.text = "—"
                  valTime.text = "กำลังจับเวลา..."
                  tvWebState.text = ""
              }

              private fun uiProgress(done: Int, total: Int, sec: Double) {
                  val pct = if (total > 0) done * 100 / total else 0
                  ring.set(pct / 100f, "กำลังอ่าน", "$pct%", "$done / $total blocks", cSky, cBlue)
                  rdBar.progress = pct
                  rdDetail.text = "อ่านแล้ว $done / $total blocks  •  ${fmt(sec)} วินาที" + (if (attemptNo > 1) "  •  ตรวจยืนยันครั้งที่ $attemptNo" else "")
                  valTime.text = "${fmt(sec)} วินาที ..."
              }

              private fun uiEscalate(why: String) {
                  attemptNo = 1
                  rdDetail.text = "ค่าผิดสังเกต" + (if (why.isNotEmpty()) " ($why)" else "") + " — อ่านทั้งหมดเพื่อยืนยัน"
                  rdHint.text = "ถือโทรศัพท์ให้นิ่ง กำลังอ่านประวัติเพื่อเทียบกับค่าล่าสุด (ประมาณ 3 วินาที)"
              }

              private fun uiVerifyNote(mode: String, ver: QuickVerify.Verify?, escalated: Boolean) {
                  val n = when {
                      escalated -> "⚠ ค่าผิดสังเกต จึงอ่านทั้งหมดเพื่อเทียบกับประวัติ"
                      (mode == "quick" || mode == "bench") && ver != null && ver.confirmed -> "✔ ยืนยันแล้ว: อ่านตรงกัน ${ver.same} ครั้ง"
                      mode == "bench" && ver != null -> "⚠ ยังยืนยันค่าไม่ได้ — ถือโทรศัพท์ให้นิ่งแล้วแตะอ่านใหม่"
                      else -> ""
                  }
                  if (n.isNotEmpty()) rdHint.text = n + "\n" + rdHint.text
              }

              private fun uiDone(bad: Int, bytes: Int, sec: Double) {
                  val speed = if (sec > 0.0) fmt(bytes / 1024.0 / sec) + " KB/s" else ""
                  valTime.text = fmt(sec, 2) + " วินาที" + (if (speed.isNotEmpty()) "  ($speed)" else "")
                  ring.set(1f, "อ่านสำเร็จ", "100%", "ใช้เวลา ${fmt(sec)} วินาที", cGreen, cGreen2)
                  setBar(cGreen, cGreen2, 100)
                  rdHint.text = "อ่านครบใน ${fmt(sec)} วินาที" +
                      (if (bad > 0) "  •  อ่านไม่ได้ $bad blocks (เติมเป็น 00)" else "") +
                      "\nกำลังส่งข้อมูลเข้า Web App..."
                  setSendStatus("กำลังส่ง...", true)
              }

              private fun uiError(msg: String) {
                  ring.set(1f, "ผิดพลาด", "!", "ลองแตะใหม่อีกครั้ง", cRed, cRed2)
                  setBar(cRed, cRed2, 100)
                  rdDetail.text = msg
                  rdHint.text = "ลองแตะใหม่ และถือโทรศัพท์ให้นิ่งจนครบ 100%"
                  valTime.text = "—"
                  tvWebState.text = ""
                  valSend.text = "ไม่ได้ส่ง (อ่านไม่สำเร็จ)"
                  valSend.setTextColor(cRed)
              }

              private fun setSendStatus(msg: String, ok: Boolean) {
                  valSend.text = msg
                  valSend.setTextColor(if (ok) cSky else cRed)
                  tvWebState.text = "UID ${valUid.text}  •  $msg"
              }

              private fun refreshNfcChip() {
                  val a = nfc
                  when {
                      a == null -> { tvNfc.text = "ไม่มี NFC"; tvNfc.background = rounded(cRed2, 20) }
                      !a.isEnabled -> { tvNfc.text = "NFC ปิดอยู่"; tvNfc.background = rounded(Color.parseColor("#B45309"), 20) }
                      else -> { tvNfc.text = "●  NFC พร้อม"; tvNfc.background = rounded(cBlue, 20, Color.argb(120, 255, 255, 255), 1) }
                  }
                  if (a != null && !a.isEnabled) toast("กรุณาเปิด NFC ในการตั้งค่าของมือถือ")
              }

              // =====================================================================  การนำทาง / ปุ่ม

              /** Meter ID = ไบต์ Addr 72–75 ต่อกันเป็นเลข hex ตรง ๆ (เช่น 69 05 00 02 -> 69050002) ไม่แปลงฐาน 10 */
              private fun meterId(full: ByteArray, start: Int, n: Int): String =
                  if (start <= 72 && start + n >= 76 && full.size >= 76) full.copyOfRange(72, 76).toHex() else "—"

              private fun showReaderScreen() {
                  readerScreen.visibility = View.VISIBLE
              }

              private fun openWebScreen() {
                  readerScreen.visibility = View.GONE
                  if (undelivered && pageLoaded) pendingDump?.let { push(it) }
              }

              /** โหลดหน้าเว็บใหม่แบบล้างแคช แล้วส่งข้อมูลล่าสุดเข้าเว็บให้อีกครั้ง */
              private fun reloadWeb() {
                  pageLoaded = false
                  undelivered = pendingDump != null
                  webView.clearCache(true)
                  webView.reload()
                  toast("กำลังโหลดหน้าเว็บใหม่...")
              }

              private fun resend() {
                  val j = pendingDump
                  if (j == null) toast("ยังไม่มีข้อมูล ให้แตะมิเตอร์ก่อน")
                  else if (!pageLoaded) toast("หน้าเว็บยังโหลดไม่เสร็จ")
                  else { readerScreen.visibility = View.GONE; push(j) }
              }

              private fun runTest() {
                  if (!pageLoaded) { toast("หน้าเว็บยังโหลดไม่เสร็จ"); return }
                  readerScreen.visibility = View.GONE
                  push(testDumpJson())
              }

              private fun showSettings() {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(dp(22), dp(10), dp(22), dp(0))
                  fun field(name: String, value: String, numeric: Boolean): EditText {
                      box.addView(label(name, 12f, Color.parseColor("#475569")).apply { setPadding(0, dp(10), 0, 0) })
                      val e = EditText(this)
                      e.setText(value)
                      e.setSingleLine()
                      e.inputType = if (numeric) InputType.TYPE_CLASS_NUMBER else InputType.TYPE_CLASS_TEXT
                      box.addView(e)
                      return e
                  }
                  box.addView(label("โหมดการอ่าน", 12f, Color.parseColor("#475569")))
                  val modes = listOf(
                      "full" to "อ่านทั้งหมด 8192 ไบต์ (มีประวัติ)  ≈ 3 วินาที",
                      "quick" to "⚡ อ่านเร็ว: ID · ขนาด · ข้อมูลล่าสุด  < 1 วินาที",
                      "bench" to "🧪 แท่นเทส: ID · ขนาด · K1–K20 · จำนวนรอบ · ค่าล่าสุด  (36 blocks)",
                      "head" to "อ่านส่วนหัว Addr 0–211 (มี K1–K20 ไม่มีประวัติ)",
                      "custom" to "กำหนดเอง (ตาม Start / Number of Bytes)"
                  )
                  val group = RadioGroup(this)
                  modes.forEachIndexed { i, m ->
                      val rb = RadioButton(this)
                      rb.id = 1000 + i
                      rb.text = m.second
                      rb.textSize = 14f
                      group.addView(rb)
                  }
                  val cur = effectiveMode()
                  val curIdx = modes.indexOfFirst { it.first == cur }.let { if (it < 0) 4 else it }
                  group.check(1000 + curIdx)
                  box.addView(group)
                  val eStart = field("Start address (ใช้เมื่อเลือก \"กำหนดเอง\")", cfgInt("start", 0).toString(), true)
                  val eLen = field("Number of Bytes (ใช้เมื่อเลือก \"กำหนดเอง\")", cfgInt("len", 8192).toString(), true)
                  val eName = field("ชื่อไฟล์ที่บันทึก", cfgName(), false)
                  val sv = ScrollView(this)
                  sv.addView(box)
                  AlertDialog.Builder(this)
                      .setTitle("ตั้งค่าอ่าน")
                      .setView(sv)
                      .setPositiveButton("บันทึก") { _, _ ->
                          val sel = modes[(group.checkedRadioButtonId - 1000).coerceIn(0, modes.size - 1)].first
                          prefs.edit()
                              .putString("mode", sel)
                              .putInt("start", eStart.text.toString().toIntOrNull() ?: 0)
                              .putInt("len", (eLen.text.toString().toIntOrNull() ?: 8192).coerceAtLeast(1))
                              .putString("name", eName.text.toString().trim().ifEmpty { "data.bin" })
                              .apply()
                          refreshSaveLabel()
                          refreshModeLabel()
                          toast("บันทึกการตั้งค่าแล้ว")
                      }
                      .setNegativeButton("ยกเลิก", null)
                      .show()
              }

              // =====================================================================  บันทึกไฟล์ / ดาวน์โหลดจากเว็บ

              private fun saveDump(data: ByteArray) {
                  try {
                      saveToDownloads(cfgName(), data, "application/octet-stream")
                      toast("บันทึกไฟล์ ${cfgName()} ลงโฟลเดอร์ Download แล้ว")
                  } catch (e: Exception) {
                      toast("บันทึกไฟล์ไม่สำเร็จ: ${e.message}")
                  }
              }

              private fun saveToDownloads(name: String, data: ByteArray, mime: String) {
                  val values = ContentValues()
                  values.put(MediaStore.Downloads.DISPLAY_NAME, name)
                  values.put(MediaStore.Downloads.MIME_TYPE, mime)
                  values.put(MediaStore.Downloads.IS_PENDING, 1)
                  val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      ?: error("สร้างไฟล์ไม่ได้")
                  contentResolver.openOutputStream(uri)!!.use { it.write(data) }
                  values.clear()
                  values.put(MediaStore.Downloads.IS_PENDING, 0)
                  contentResolver.update(uri, values, null, null)
              }

              /** ปุ่ม Export (เช่น Excel) ในเว็บสร้างลิงก์ blob: ต้องดึงข้อมูลออกมาบันทึกเอง */
              private fun handleDownload(url: String, mime: String?) {
                  val m = (mime ?: "").replace("'", "")
                  if (url.startsWith("blob:")) {
                      val u = url.replace("'", "")
                      webView.evaluateJavascript(
                          "(function(u,m){fetch(u).then(function(r){return r.blob();}).then(function(b){" +
                              "var f=new FileReader();f.onload=function(){" +
                              "NfcBridge.saveFile(m||b.type||'application/octet-stream',String(f.result).split(',')[1]);};" +
                              "f.readAsDataURL(b);}).catch(function(e){NfcBridge.report('ERR: ดาวน์โหลดไม่สำเร็จ '+e.message);});})('$u','$m')",
                          null
                      )
                  } else if (url.startsWith("data:")) {
                      try {
                          val comma = url.indexOf(',')
                          val meta = url.substring(5, comma)
                          val payload = url.substring(comma + 1)
                          val bytes = if (meta.contains("base64")) Base64.decode(payload, Base64.DEFAULT)
                          else Uri.decode(payload).toByteArray()
                          val mm = meta.substringBefore(';').ifEmpty { "application/octet-stream" }
                          val ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(mm) ?: "bin"
                          val name = "SMCV4_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date()) + "." + ext
                          saveToDownloads(name, bytes, mm)
                          toast("บันทึกไฟล์ $name ลงโฟลเดอร์ Download แล้ว")
                      } catch (e: Exception) {
                          toast("บันทึกไฟล์ไม่สำเร็จ: ${e.message}")
                      }
                  } else {
                      toast("ไม่รองรับการดาวน์โหลดจากลิงก์นี้")
                  }
              }

              // =====================================================================  ส่งข้อมูลเข้า Web App

              private fun push(json: String) {
                  webView.evaluateJavascript("($feedJs)($json)") { r ->
                      val res = (r ?: "").trim('"')
                      when {
                          res.startsWith("OK") -> { undelivered = false; setSendStatus("✓ ส่งเข้า Web App แล้ว", true) }
                          res.startsWith("WAIT") -> { undelivered = false; setSendStatus("กำลังเปิดเครื่องมือ NFC ในเว็บ...", true) }
                          else -> { undelivered = true; setSendStatus("✗ $res", false); toast("ส่งเข้า Web App ไม่สำเร็จ: $res") }
                      }
                  }
              }

              /** ข้อมูลทดสอบ (ตัวอย่าง 3.31 V) ใช้เช็กว่าท่อส่งข้อมูลเข้าเว็บทำงานไหม โดยไม่ต้องใช้มิเตอร์ */
              private fun testDumpJson(): String {
                  val d = ByteArray(8192)
                  "69 05 00 02".split(" ").forEachIndexed { i, h -> d[72 + i] = h.toInt(16).toByte() }
                  ("00 00 05 51 23 45 B5 B5 B5 B5 B5 B5 00 02 50 17 11 05 01 20 25 11 FF 76")
                      .split(" ").forEachIndexed { i, h -> d[188 + i] = h.toInt(16).toByte() }
                  return JSONObject().put("ok", true).put("uid", "TEST").put("start", 0)
                      .put("length", d.size).put("hex", d.toHex())
                      .put("unreadableBlocks", JSONArray()).toString()
              }

