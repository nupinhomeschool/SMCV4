name: Build APK
on:
  workflow_dispatch:
  push:

env:
  # URL ของ Web App (ต้องขึ้นต้น https://)
  WEB_APP_URL: "https://nupinhomeschool.github.io/SMCV4/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          cat > 'settings.gradle.kts' << 'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SMCV4Reader"
          include(":app")
          EOF_FILE
          cat > 'build.gradle.kts' << 'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > 'gradle.properties' << 'EOF_FILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF_FILE
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' << 'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.smcv4reader"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.smcv4reader"
                  minSdk = 29          // ใช้ MediaStore Downloads ไม่ต้องขอ permission เก็บไฟล์
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.NFC" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.nfc" android:required="true" />

              <application
                  android:label="SMCV4 Reader"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p 'app/src/main/java/com/example/smcv4reader'
          cat > 'app/src/main/java/com/example/smcv4reader/MainActivity.kt' << 'EOF_FILE'
          package com.example.smcv4reader

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.res.ColorStateList
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.SweepGradient
          import android.graphics.Typeface
          import android.graphics.drawable.ClipDrawable
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.LayerDrawable
          import android.net.Uri
          import android.nfc.NfcAdapter
          import android.nfc.Tag
          import android.nfc.tech.NfcV
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.MediaStore
          import android.text.InputType
          import android.util.Base64
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup.LayoutParams.MATCH_PARENT
          import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
          import android.webkit.JavascriptInterface
          import android.webkit.MimeTypeMap
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /** วงแหวนแสดงความคืบหน้า 0-100% (ตรงกลางมีข้อความสถานะ เปอร์เซ็นต์ และจำนวน block) */
          private class RingView(ctx: Context) : View(ctx) {
              var pct = 0f
              var c1 = Color.WHITE
              var c2 = Color.WHITE
              var cap = ""
              var big = "0%"
              var small = ""
              var tfBold: Typeface = Typeface.DEFAULT_BOLD
              var tfReg: Typeface = Typeface.DEFAULT

              private val track = Paint(Paint.ANTI_ALIAS_FLAG)
              private val arc = Paint(Paint.ANTI_ALIAS_FLAG)
              private val glow = Paint(Paint.ANTI_ALIAS_FLAG)
              private val tCap = Paint(Paint.ANTI_ALIAS_FLAG)
              private val tBig = Paint(Paint.ANTI_ALIAS_FLAG)
              private val tSmall = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()

              fun set(p: Float, caption: String, bigText: String, smallText: String, color1: Int, color2: Int) {
                  pct = p.coerceIn(0f, 1f)
                  cap = caption
                  big = bigText
                  small = smallText
                  c1 = color1
                  c2 = color2
                  invalidate()
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val s = minOf(w, h)
                  val sw = s * 0.085f
                  val cx = w / 2f
                  val cy = h / 2f
                  val r = s / 2f - sw / 2f - s * 0.03f
                  rect.set(cx - r, cy - r, cx + r, cy + r)

                  glow.style = Paint.Style.FILL
                  glow.color = Color.argb(26, 255, 255, 255)
                  c.drawCircle(cx, cy, r - sw / 2f, glow)

                  track.style = Paint.Style.STROKE
                  track.strokeWidth = sw
                  track.color = Color.argb(50, 255, 255, 255)
                  c.drawCircle(cx, cy, r, track)

                  if (pct > 0f) {
                      arc.style = Paint.Style.STROKE
                      arc.strokeWidth = sw
                      arc.strokeCap = Paint.Cap.ROUND
                      arc.shader = SweepGradient(cx, cy, intArrayOf(c1, c2), floatArrayOf(0f, pct.coerceAtLeast(0.02f)))
                      c.save()
                      c.rotate(-90f, cx, cy)
                      c.drawArc(rect, 0f, 360f * pct, false, arc)
                      c.restore()
                  }

                  tCap.textAlign = Paint.Align.CENTER
                  tCap.typeface = tfBold
                  tCap.color = c1
                  tCap.textSize = s * 0.066f
                  c.drawText(cap, cx, cy - s * 0.145f, tCap)

                  tBig.textAlign = Paint.Align.CENTER
                  tBig.typeface = tfBold
                  tBig.color = Color.WHITE
                  tBig.textSize = s * 0.23f
                  c.drawText(big, cx, cy + s * 0.075f, tBig)

                  tSmall.textAlign = Paint.Align.CENTER
                  tSmall.typeface = tfReg
                  tSmall.color = Color.parseColor("#C5D5F5")
                  tSmall.textSize = s * 0.062f
                  c.drawText(small, cx, cy + s * 0.19f, tSmall)
              }
          }

          /**
           * หน้า 1 (อ่าน NFC): แตะมิเตอร์ -> วงแหวน % + จำนวน block -> ส่งข้อมูลเข้า Web App อัตโนมัติ
           * หน้า 2 (Web App) : SMCv4 Web App เต็มจอ มีปุ่ม "อ่าน NFC ใหม่" กลับมาหน้าแรก
           */
          class MainActivity : Activity(), NfcAdapter.ReaderCallback {

              companion object {
                  // แก้เป็น URL Web App ของคุณ
                  const val WEB_APP_URL = "https://your-webapp.example.com/"
                  private const val VERSION = "v14"
                  private const val REQ_FILE = 4711
                  private const val FLAGS =
                      NfcAdapter.FLAG_READER_NFC_V or NfcAdapter.FLAG_READER_SKIP_NDEF_CHECK
              }

              // ---- โทนสีน้ำเงิน (Flo Sensor Lab) ----
              private val cNavy = Color.parseColor("#061A49")
              private val cRoyal = Color.parseColor("#0B3A99")
              private val cBlue = Color.parseColor("#2563EB")
              private val cSky = Color.parseColor("#38BDF8")
              private val cMuted = Color.parseColor("#B7C9F2")
              private val cGreen = Color.parseColor("#34D399")
              private val cGreen2 = Color.parseColor("#059669")
              private val cRed = Color.parseColor("#F87171")
              private val cRed2 = Color.parseColor("#B91C1C")
              private val cAmber = Color.parseColor("#FBBF24")

              private lateinit var readerScreen: View
              private lateinit var webView: WebView
              private lateinit var loadBar: ProgressBar
              private lateinit var ring: RingView
              private lateinit var tvNfc: TextView
              private lateinit var rdBar: ProgressBar
              private lateinit var rdDetail: TextView
              private lateinit var rdHint: TextView
              private lateinit var valUid: TextView
              private lateinit var valMeter: TextView
              private lateinit var valSize: TextView
              private lateinit var valSend: TextView
              private lateinit var valTime: TextView
              private lateinit var tvWebState: TextView
              private lateinit var cbSave: CheckBox
              private lateinit var btnMode: Button
              @Volatile private var attemptNo = 1

              private var nfc: NfcAdapter? = null
              private var pendingDump: String? = null
              private var pageLoaded = false
              private var undelivered = false
              @Volatile private var reading = false
              @Volatile private var t0 = 0L
              private var token = 0
              private val handler = Handler(Looper.getMainLooper())
              private var fileCallback: ValueCallback<Array<Uri>>? = null

              private val prefs by lazy { getSharedPreferences("cfg", Context.MODE_PRIVATE) }
              private val feedJs: String by lazy { assets.open("feed.js").bufferedReader().readText() }
              private val openNfcJs: String by lazy { assets.open("opennfc.js").bufferedReader().readText() }
              private val tfReg: Typeface by lazy {
                  try { Typeface.createFromAsset(assets, "prompt_regular.ttf") } catch (e: Exception) { Typeface.DEFAULT }
              }
              private val tfBold: Typeface by lazy {
                  try { Typeface.createFromAsset(assets, "prompt_bold.ttf") } catch (e: Exception) { Typeface.DEFAULT_BOLD }
              }

              /** หน้าเว็บเรียกกลับมารายงานผล / ขอบันทึกไฟล์ที่ดาวน์โหลด */
              inner class Bridge {
                  @JavascriptInterface
                  fun report(msg: String) {
                      runOnUiThread {
                          val bad = msg.startsWith("ERR")
                          undelivered = bad
                          setSendStatus(if (bad) "✗ $msg" else "✓ เว็บประมวลผลข้อมูลแล้ว", !bad)
                          toast(msg)
                      }
                  }

                  @JavascriptInterface
                  fun saveFile(mime: String, b64: String) {
                      try {
                          val bytes = Base64.decode(b64, Base64.DEFAULT)
                          val ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(mime) ?: "bin"
                          val name = "SMCV4_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date()) + "." + ext
                          saveToDownloads(name, bytes, mime)
                          runOnUiThread { toast("บันทึกไฟล์ $name ลงโฟลเดอร์ Download แล้ว") }
                      } catch (e: Exception) {
                          runOnUiThread { toast("บันทึกไฟล์ไม่สำเร็จ: ${e.message}") }
                      }
                  }
              }

              // =====================================================================  สร้างหน้าจอ

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = cNavy

                  val webScreen = buildWebScreen()
                  readerScreen = buildReaderScreen()
                  setContentView(FrameLayout(this).apply {
                      addView(webScreen, FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT))      // เว็บอยู่ข้างล่าง ไม่ถูกซ่อน
                      addView(readerScreen, FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT))   // หน้าอ่าน NFC ซ้อนด้านบน
                  })

                  nfc = NfcAdapter.getDefaultAdapter(this)
                  uiIdle()
              }

              private fun glassCard(): GradientDrawable = rounded(Color.argb(40, 255, 255, 255), 22, Color.argb(80, 255, 255, 255), 1)

              private fun buildReaderScreen(): View {
                  tvNfc = label("", 12f, Color.WHITE, true)
                  tvNfc.setPadding(dp(12), dp(6), dp(12), dp(6))

                  val titleCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      addView(label("SMCV4 Reader", 25f, Color.WHITE, true))
                      addView(label("อ่านค่ามิเตอร์น้ำผ่าน NFC  •  ST25DV", 12f, cMuted))
                  }
                  val titleRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      addView(titleCol, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                      addView(tvNfc, LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT))
                  }

                  // ---- โลโก้บริษัท ----
                  val logo = logoImage("logo_full.png", ImageView.ScaleType.FIT_START)

                  // ---- การ์ดวงแหวนความคืบหน้า ----
                  ring = RingView(this)
                  ring.tfBold = tfBold
                  ring.tfReg = tfReg
                  rdBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  rdBar.max = 100
                  rdBar.progressDrawable = makeBar(cSky, cBlue)
                  rdDetail = label("อ่านแล้ว 0 / 0 blocks", 13f, Color.WHITE, true)
                  rdDetail.gravity = Gravity.CENTER
                  rdHint = label("แตะโทรศัพท์ที่มิเตอร์ SMCV4 แล้วถือให้นิ่งจนครบ 100%", 12f, cMuted)
                  rdHint.gravity = Gravity.CENTER
                  val progCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(dp(18), dp(18), dp(18), dp(16))
                      background = glassCard()
                      addView(ring, LinearLayout.LayoutParams(dp(204), dp(204)))
                      addView(rdBar, LinearLayout.LayoutParams(MATCH_PARENT, dp(10)).apply { topMargin = dp(10) })
                      addView(rdDetail, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(10) })
                      addView(rdHint, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(4) })
                  }

                  // ---- การ์ดข้อมูล ----
                  valUid = label("—", 13f, Color.WHITE, true)
                  valUid.gravity = Gravity.END
                  valMeter = label("—", 16f, cSky, true)
                  valMeter.gravity = Gravity.END
                  valSize = label("—", 13f, Color.WHITE, true)
                  valSize.gravity = Gravity.END
                  valSend = label("ยังไม่ได้ส่ง", 13f, cMuted, true)
                  valSend.gravity = Gravity.END
                  valTime = label("—", 13f, Color.WHITE, true)
                  valTime.gravity = Gravity.END
                  val infoCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(10), dp(18), dp(10))
                      background = glassCard()
                      addView(infoRow("UID", valUid))
                      addView(infoRow("Meter ID", valMeter))
                      addView(infoRow("ข้อมูลที่อ่าน", valSize))
                      addView(infoRow("เวลาที่ใช้อ่าน", valTime))
                      addView(infoRow("ส่งเข้า Web App", valSend))
                  }

                  // ---- ตัวเลือกบันทึกไฟล์ ----
                  cbSave = CheckBox(this)
                  cbSave.setTextColor(Color.WHITE)
                  cbSave.typeface = tfReg
                  cbSave.textSize = 13f
                  cbSave.buttonTintList = ColorStateList.valueOf(cSky)
                  cbSave.isChecked = prefs.getBoolean("save", false)
                  cbSave.setOnCheckedChangeListener { _, c -> prefs.edit().putBoolean("save", c).apply() }
                  refreshSaveLabel()

                  btnMode = pill("", false) { toggleMode() }
                  refreshModeLabel()

                  // ---- ปุ่ม ----
                  val row1 = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      addView(pill("Web App", true) { openWebScreen() },
                          LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f).apply { marginEnd = dp(8) })
                      addView(pill("ตั้งค่าอ่าน", false) { showSettings() },
                          LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                  }
                  val row2 = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      addView(pill("ส่งซ้ำ", false) { resend() },
                          LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f).apply { marginEnd = dp(8) })
                      addView(pill("ทดสอบ", false) { runTest() },
                          LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                  }

                  val footer = label("Flo Sensor Lab Co.,Ltd.  •  $VERSION", 11f, cMuted)
                  footer.gravity = Gravity.CENTER

                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(16), dp(18), dp(20))
                      addView(logo, LinearLayout.LayoutParams(MATCH_PARENT, dp(34)))
                      addView(titleRow, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(16) })
                      addView(progCard, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(16) })
                      addView(infoCard, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(14) })
                      addView(cbSave, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(10) })
                      addView(btnMode, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(10) })
                      addView(row1, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(10) })
                      addView(row2, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(8) })
                      addView(footer, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(16) })
                  }
                  return ScrollView(this).apply {
                      isFillViewport = true
                      background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(cNavy, cRoyal, cBlue))
                      isClickable = true
                      addView(content, FrameLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun buildWebScreen(): View {
                  val back = pill("←  อ่าน NFC ใหม่", true) { showReaderScreen() }
                  back.textSize = 13f
                  back.setPadding(dp(14), dp(8), dp(14), dp(8))
                  val reload = pill("↻", false) { reloadWeb() }
                  reload.textSize = 16f
                  reload.setPadding(dp(12), dp(6), dp(12), dp(6))
                  tvWebState = label("", 11f, cMuted)
                  val mark = logoImage("logo_mark.png", ImageView.ScaleType.FIT_END)
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(10), dp(8), dp(10), dp(8))
                      background = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(cNavy, cRoyal))
                      addView(back, LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT))
                      addView(reload, LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT).apply { marginStart = dp(6) })
                      addView(tvWebState, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f).apply { marginStart = dp(10) })
                      addView(mark, LinearLayout.LayoutParams(dp(62), dp(26)).apply { marginStart = dp(8) })
                  }

                  webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.cacheMode = WebSettings.LOAD_NO_CACHE       // โหลดหน้าเว็บล่าสุดจากเซิร์ฟเวอร์เสมอ
                      clearCache(true)
                      addJavascriptInterface(Bridge(), "NfcBridge")
                      setDownloadListener { url, _, _, mime, _ -> this@MainActivity.handleDownload(url, mime) }
                      webViewClient = object : WebViewClient() {
                          override fun onPageFinished(view: WebView?, url: String?) {
                              pageLoaded = true
                              view?.evaluateJavascript("($openNfcJs)()", null)       // เปิดแท็บ Tool NFC ให้อัตโนมัติ
                              if (undelivered) pendingDump?.let { push(it) }
                          }
                      }
                      webChromeClient = object : WebChromeClient() {
                          override fun onProgressChanged(view: WebView?, p: Int) {
                              this@MainActivity.loadBar.progress = p
                              this@MainActivity.loadBar.visibility = if (p < 100) View.VISIBLE else View.GONE
                          }

                          // ทำให้ปุ่มเลือกไฟล์ (เช่น .bin) ในหน้าเว็บใช้งานได้
                          override fun onShowFileChooser(
                              wv: WebView?, cb: ValueCallback<Array<Uri>>?, params: WebChromeClient.FileChooserParams?
                          ): Boolean {
                              this@MainActivity.fileCallback?.onReceiveValue(null)
                              this@MainActivity.fileCallback = cb
                              val i = Intent(Intent.ACTION_GET_CONTENT)
                              i.addCategory(Intent.CATEGORY_OPENABLE)
                              i.type = "*/*"
                              if (params?.mode == WebChromeClient.FileChooserParams.MODE_OPEN_MULTIPLE)
                                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                              return try {
                                  this@MainActivity.startActivityForResult(Intent.createChooser(i, "เลือกไฟล์"), REQ_FILE)
                                  true
                              } catch (e: Exception) {
                                  this@MainActivity.fileCallback = null
                                  cb?.onReceiveValue(null)
                                  false
                              }
                          }
                      }
                      loadUrl(WEB_APP_URL)
                  }
                  loadBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  loadBar.max = 100
                  loadBar.progressDrawable = makeBar(cSky, cBlue)

                  val frame = FrameLayout(this).apply {
                      addView(webView, FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT))
                      addView(loadBar, FrameLayout.LayoutParams(MATCH_PARENT, dp(4)))
                  }
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      addView(bar, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))
                      addView(frame, LinearLayout.LayoutParams(MATCH_PARENT, 0, 1f))
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == REQ_FILE) {
                      fileCallback?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data))
                      fileCallback = null
                  } else {
                      super.onActivityResult(requestCode, resultCode, data)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  webView.onResume()
                  refreshNfcChip()
                  nfc?.enableReaderMode(this, this, FLAGS, null)
              }

              override fun onPause() {
                  super.onPause()
                  nfc?.disableReaderMode(this)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (readerScreen.visibility == View.GONE) {
                      if (webView.canGoBack()) webView.goBack() else showReaderScreen()
                  } else {
                      super.onBackPressed()
                  }
              }

              // =====================================================================  NFC (background thread)

              override fun onTagDiscovered(tag: Tag) {
                  if (reading) return
                  reading = true
                  t0 = SystemClock.elapsedRealtime()
                  val mode = effectiveMode()
                  val start = cfgInt("start", 0)
                  val len = cfgInt("len", 8192)
                  runOnUiThread { showReaderScreen(); uiReading() }
                  try {
                      val onProg: (Int, Int) -> Unit = { done, total ->
                          val sec = (SystemClock.elapsedRealtime() - t0) / 1000.0
                          runOnUiThread { uiProgress(done, total, sec) }
                      }
                      var ver: QuickVerify.Verify? = null
                      var escalated = false
                      attemptNo = 1
                      val res = when (mode) {
                          "quick" -> {                                           // อ่านเร็ว: เฉพาะ ID · ขนาด · ค่าล่าสุด + อ่านซ้ำยืนยัน
                              val (q, vv) = readQuickVerified(tag, onProg) { n -> attemptNo = n }
                              ver = vv
                              if (!vv.confirmed || vv.suspect) {                 // ค่าไม่ตรงกัน / ปริมาตร 0 / น้อยกว่าครั้งก่อน → อ่านทั้งหมดเพื่อเทียบกับประวัติ
                                  escalated = true
                                  runOnUiThread { uiEscalate(vv.note) }
                                  readRange(tag, 0, 8192, onProg)
                              } else q
                          }
                          "bench" -> {                                           // แท่นเทส: ID · ขนาด · K1–K20 · จำนวนรอบ · ค่าล่าสุด + อ่านซ้ำยืนยัน (ไม่อ่านทั้งชิป)
                              val (q, vv) = readQuickVerified(tag, onProg, BENCH_RANGES) { n -> attemptNo = n }
                              ver = vv
                              q
                          }
                          "head" -> readRange(tag, 0, 212, onProg)              // ส่วนหัว Addr 0–211
                          "full" -> readRange(tag, 0, 8192, onProg)             // ทั้งหมด (มีประวัติ)
                          else -> readRange(tag, start, len, onProg)            // กำหนดเอง
                      }
                      val sec = (SystemClock.elapsedRealtime() - t0) / 1000.0
                      val rr: List<IntArray> = if (mode == "quick" && !escalated) QUICK_RANGES else if (mode == "bench") BENCH_RANGES else listOf(intArrayOf(res.start, res.range.size))
                      val partial = res.range.size < res.full.size
                      val hexEnd = if (partial) rr.maxOf { it[0] + it[1] } else res.full.size
                      val rj = JSONArray()
                      rr.forEach { rj.put(JSONArray().put(it[0]).put(it[1])) }
                      val json = JSONObject()
                          .put("ok", true)
                          .put("uid", res.uid)
                          .put("start", 0)
                          .put("length", hexEnd)
                          .put("hex", res.full.copyOf(hexEnd).toHex())          // เติม 00 ให้ address ตรงกับแอป ST25 (ตัดส่วนท้ายที่ไม่ได้อ่านทิ้ง)
                          .put("mode", if (escalated) "full" else mode)
                          .put("partial", partial)
                          .put("verify", ver != null)
                          .put("verified", ver?.confirmed ?: false)
                          .put("attempts", ver?.attempts ?: 0)
                          .put("same", ver?.same ?: 0)
                          .put("escalated", escalated)
                          .put("note", ver?.note ?: "")
                          .put("ranges", rj)
                          .put("unreadableBlocks", JSONArray(res.bad))
                          .toString()
                      val mm = if (covers(rr, 76, 77)) res.full[76].toInt() and 0xFF else 0
                      val idText = if (covers(rr, 72, 76)) res.full.copyOfRange(72, 76).toHex() + (if (mm in 1..254) "  ·  $mm mm" else "") else "—"
                      runOnUiThread {
                          pendingDump = json
                          undelivered = true
                          valUid.text = res.uid
                          valMeter.text = idText
                          valSize.text = when {
                              mode == "quick" && !escalated -> "${res.range.size} bytes  (อ่านเร็ว)"
                          mode == "bench" -> "${res.range.size} bytes  (แท่นเทส)"
                              res.start == 0 -> "${res.range.size} bytes"
                              else -> "${res.range.size} bytes (Addr ${res.start}–${res.start + res.range.size - 1})"
                          }
                          uiDone(res.bad.size, res.range.size, sec)
                      uiVerifyNote(mode, ver, escalated)
                      val v2 = ver
                      if (v2 != null && v2.confirmed && !v2.suspect) prefs.edit().putString("lv_" + res.uid, QuickVerify.volDigits(res.full)).apply()
                          if (pageLoaded) push(json) else setSendStatus("รอหน้าเว็บโหลดเสร็จ...", true)
                          if (cbSave.isChecked) saveDump(if ((mode == "quick" && !escalated) || mode == "bench") res.full.copyOf(hexEnd) else res.range)   // บันทึกไฟล์เฉพาะเมื่อติ๊กเลือกไว้
                          val t = token
                          handler.postDelayed({ if (t == token && !reading) openWebScreen() }, if (mode == "quick") 500L else 1100L)
                      }
                  } catch (e: Exception) {
                      val msg = e.message ?: e.toString()
                      runOnUiThread { uiError(msg) }
                  } finally {
                      reading = false
                  }
              }

              /** ช่วงที่อ่านในโหมด "อ่านเร็ว": Addr 68–83 (Command · Meter ID · ขนาด · เวลา · วันที่) และ 188–211 (ค่าล่าสุด 24 ไบต์) = 10 blocks */
              private val QUICK_RANGES: List<IntArray> = listOf(intArrayOf(68, 16), intArrayOf(188, 24))

              /** โหมดแท่นเทส: Addr 68–211 = Meter ID · ขนาด · K1–K20 · จำนวนรอบ (184–186) · ค่าล่าสุด = 36 blocks */
              private val BENCH_RANGES: List<IntArray> = listOf(intArrayOf(68, 144))

              private fun covers(rr: List<IntArray>, a: Int, b: Int): Boolean = rr.any { it[0] <= a && it[0] + it[1] >= b }

              private fun effectiveMode(): String {
                  val m = prefs.getString("mode", null)
                  if (m != null) return m
                  return if (cfgInt("start", 0) == 0 && cfgInt("len", 8192) >= 8192) "full" else "custom"
              }

              private fun refreshModeLabel() {
                  btnMode.text = when (effectiveMode()) {
                      "quick" -> "⚡ โหมดอ่านเร็ว  (แตะ = แท่นเทส 🧪)"
                      "bench" -> "🧪 โหมดแท่นเทส  (แตะ = อ่านทั้งหมด)"
                      "full" -> "โหมดอ่านทั้งหมด  (แตะ = อ่านเร็ว ⚡)"
                      "head" -> "โหมดอ่านส่วนหัว 0–211  (แตะ = อ่านเร็ว ⚡)"
                      else -> "โหมดกำหนดเอง  (แตะ = อ่านเร็ว ⚡)"
                  }
              }

              private fun toggleMode() {
                  val next = when (effectiveMode()) { "quick" -> "bench"; "bench" -> "full"; else -> "quick" }
                  prefs.edit().putString("mode", next).apply()
                  refreshModeLabel()
                  toast(when (next) {
                      "quick" -> "อ่านเร็ว: ID · ขนาด · ข้อมูลล่าสุด"
                      "bench" -> "แท่นเทส: ID · ขนาด · K1–K20 · จำนวนรอบ · ค่าล่าสุด"
                      else -> "อ่านทั้งหมด 8192 ไบต์ (มีประวัติ)"
                  })
              }

              /** อ่านหลายช่วงบนการเชื่อมต่อที่เปิดอยู่แล้ว แล้ววางลง address เดิม ส่วนที่ไม่ได้อ่านเป็น 00 */
              private fun readRangesOn(v: NfcV, info: MemInfo, uid: String, rs: List<IntArray>, onProgress: (Int, Int) -> Unit): DumpResult {
                  val bs = info.blockSize
                  val totalBytes = info.blockCount * bs
                  val chunk = ((v.maxTransceiveLength - 2) / bs).coerceIn(1, 32)
                  val spans = rs.map { r ->
                      val s0 = r[0].coerceIn(0, totalBytes - 1)
                      val n0 = r[1].coerceIn(1, totalBytes - s0)
                      intArrayOf(s0, n0, s0 / bs, (s0 + n0 - 1) / bs)
                  }
                  val total = spans.fold(0) { a, p -> a + (p[3] - p[2] + 1) }
                  val full = ByteArray(totalBytes)
                  val out = ByteArrayOutputStream()
                  val bad = ArrayList<Int>()
                  var done = 0
                  for (p in spans) {
                      val first = p[2]
                      val last = p[3]
                      val buf = ByteArrayOutputStream()
                      var b = first
                      while (b <= last) {
                          val cnt = minOf(chunk, last - b + 1)
                          val d = readBlocks(v, b, cnt, bs, info.extended)
                          if (d != null) buf.write(d)
                          else for (i in 0 until cnt) {                      // ถ้าพลาด ลองอ่านทีละ block
                              val one = readBlocks(v, b + i, 1, bs, info.extended)
                              if (one != null) buf.write(one) else { bad.add(b + i); buf.write(ByteArray(bs)) }
                          }
                          b += cnt
                          done += cnt
                          onProgress(done, total)
                      }
                      val all = buf.toByteArray()
                      val off = p[0] - first * bs
                      val part = all.copyOfRange(off, off + p[1])
                      System.arraycopy(part, 0, full, p[0], p[1])
                      out.write(part)
                  }
                  return DumpResult(uid, 0, out.toByteArray(), full, bad)
              }

              /** อ่านเร็ว + ตรวจยืนยัน: อ่านซ้ำในการเชื่อมต่อเดียวจนค่าตรงกัน (ปกติ 2 ครั้ง · ปริมาตร 0/น้อยลง 3 ครั้ง) */
              private fun readQuickVerified(tag: Tag, onProgress: (Int, Int) -> Unit, rs: List<IntArray> = QUICK_RANGES, onTry: (Int) -> Unit): Pair<DumpResult, QuickVerify.Verify> {
                  val v = NfcV.get(tag)
                      ?: error("แท็กไม่ใช่ NFC-V (ISO15693): " + tag.techList.joinToString())
                  v.connect()
                  try {
                      val info = readMemoryInfo(v)
                      val uid = tag.id.reversedArray().toHex()
                      val lastVol = prefs.getString("lv_" + uid, null)
                      return QuickVerify.run(
                          6, lastVol,
                          { readRangesOn(v, info, uid, rs, onProgress) },
                          onTry,
                          { try { Thread.sleep(90) } catch (_: InterruptedException) {} }
                      )
                  } finally {
                      try { v.close() } catch (_: Exception) {}
                  }
              }

              private class MemInfo(val blockCount: Int, val blockSize: Int, val extended: Boolean)
              class DumpResult(
                  val uid: String, val start: Int, val range: ByteArray, val full: ByteArray, val bad: List<Int>
              )

              private fun readRange(tag: Tag, start: Int, len: Int, onProgress: (Int, Int) -> Unit): DumpResult {
                  val v = NfcV.get(tag)
                      ?: error("แท็กไม่ใช่ NFC-V (ISO15693): " + tag.techList.joinToString())
                  v.connect()
                  try {
                      val info = readMemoryInfo(v)
                      val bs = info.blockSize
                      val totalBytes = info.blockCount * bs
                      val s = start.coerceIn(0, totalBytes - 1)
                      val n = len.coerceIn(1, totalBytes - s)
                      val first = s / bs
                      val last = (s + n - 1) / bs
                      val count = last - first + 1
                      val chunk = ((v.maxTransceiveLength - 2) / bs).coerceIn(1, 32)

                      val buf = ByteArrayOutputStream()
                      val bad = ArrayList<Int>()
                      var b = first
                      while (b <= last) {
                          val cnt = minOf(chunk, last - b + 1)
                          val d = readBlocks(v, b, cnt, bs, info.extended)
                          if (d != null) buf.write(d)
                          else for (i in 0 until cnt) {                      // ถ้าพลาด ลองอ่านทีละ block
                              val one = readBlocks(v, b + i, 1, bs, info.extended)
                              if (one != null) buf.write(one) else { bad.add(b + i); buf.write(ByteArray(bs)) }
                          }
                          b += cnt
                          onProgress(b - first, count)
                      }
                      val all = buf.toByteArray()
                      val off = s - first * bs
                      val range = all.copyOfRange(off, off + n)
                      val full = ByteArray(totalBytes)
                      System.arraycopy(range, 0, full, s, n)
                      return DumpResult(tag.id.reversedArray().toHex(), s, range, full, bad)
                  } finally {
                      try { v.close() } catch (_: Exception) {}
                  }
              }

              private fun readMemoryInfo(v: NfcV): MemInfo {
                  // Extended Get System Info (ST25DV64K = 2048 blocks x 4 bytes = 8192 bytes)
                  try {
                      val r = v.transceive(byteArrayOf(0x02, 0x3B))
                      if (r.size > 12 && (r[0].toInt() and 1) == 0) {
                          val f = r[1].toInt()
                          var i = 10
                          if (f and 1 != 0) i++
                          if (f and 2 != 0) i++
                          if (f and 4 != 0) {
                              val blocks = ((r[i].toInt() and 0xFF) or ((r[i + 1].toInt() and 0xFF) shl 8)) + 1
                              val size = (r[i + 2].toInt() and 0x1F) + 1
                              return MemInfo(blocks, size, true)
                          }
                      }
                  } catch (_: Exception) {}
                  try {
                      val r = v.transceive(byteArrayOf(0x02, 0x2B))
                      if (r.size > 12 && (r[0].toInt() and 1) == 0) {
                          val f = r[1].toInt()
                          var i = 10
                          if (f and 1 != 0) i++
                          if (f and 2 != 0) i++
                          if (f and 4 != 0)
                              return MemInfo((r[i].toInt() and 0xFF) + 1, (r[i + 1].toInt() and 0x1F) + 1, false)
                      }
                  } catch (_: Exception) {}
                  return MemInfo(2048, 4, true)   // ค่าเริ่มต้น = ST25DV64K (8192 bytes)
              }

              private fun readBlocks(v: NfcV, blk: Int, cnt: Int, bs: Int, ext: Boolean): ByteArray? {
                  val lo = blk.toByte(); val hi = (blk shr 8).toByte()
                  val nl = (cnt - 1).toByte(); val nh = ((cnt - 1) shr 8).toByte()
                  val cmd = when {
                      cnt == 1 && ext -> byteArrayOf(0x02, 0x30, lo, hi)
                      cnt == 1 -> byteArrayOf(0x02, 0x20, lo)
                      ext -> byteArrayOf(0x02, 0x33, lo, hi, nl, nh)
                      else -> byteArrayOf(0x02, 0x23, lo, nl)
                  }
                  repeat(3) {
                      try {
                          val r = v.transceive(cmd)
                          if (r.isNotEmpty() && (r[0].toInt() and 1) != 0) return null      // tag ตอบ error
                          if (r.size == 1 + cnt * bs) return r.copyOfRange(1, r.size)
                      } catch (_: Exception) { /* ลองใหม่ */ }
                  }
                  return null
              }

