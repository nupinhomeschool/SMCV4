          /** ตรวจความถูกต้องของข้อมูลล่าสุด (Addr 188–211) และอ่านซ้ำจนกว่าค่าจะตรงกัน — ใช้แยกค่า "ปริมาตร 0 จริง" ออกจาก "อ่านพลาด" */
          object QuickVerify {
              class Latest(val ok: Boolean, val reason: String, val volZero: Boolean)
              class Verify(val confirmed: Boolean, val suspect: Boolean, val attempts: Int, val same: Int, val note: String)

              val CRITICAL_BLOCKS: IntRange = 21..52          // Addr 84–211 (K1–K20 · จำนวนรอบ · ค่าล่าสุด)
              val ID_BLOCKS: IntRange = 17..20                 // Addr 68–83

              private fun u(b: Byte): Int = b.toInt() and 0xFF
              private fun bcdOk(b: Byte): Boolean = (u(b) shr 4) <= 9 && (u(b) and 15) <= 9
              private fun bcd(b: Byte): Int = (u(b) shr 4) * 10 + (u(b) and 15)
              fun hex(a: ByteArray): String = a.joinToString("") { "%02X".format(it) }

              /** โครงสร้างของบล็อกล่าสุด: ปริมาตร BCD 6 ไบต์ · ไหลย้อน · อัตราไหล BCD 3 ไบต์ · เวลา hh:mm · วันที่ dd mm yyyy */
              fun checkLatest(full: ByteArray): Latest {
                  if (full.size < 212) return Latest(false, "ข้อมูลสั้นกว่า 212 ไบต์", false)
                  val b = full.copyOfRange(188, 212)
                  if (b.all { it == 0.toByte() } || b.all { it == 0xFF.toByte() })
                      return Latest(false, "บล็อกค่าล่าสุดว่าง (00/FF ทั้งหมด)", false)
                  if (!(0..5).all { bcdOk(b[it]) }) return Latest(false, "ปริมาตรไม่ใช่รูปแบบ BCD", false)
                  if (!(12..14).all { bcdOk(b[it]) }) return Latest(false, "อัตราไหลไม่ใช่รูปแบบ BCD", false)
                  if (!(15..20).all { bcdOk(b[it]) }) return Latest(false, "วันที่/เวลาไม่ใช่รูปแบบ BCD", false)
                  val hh = bcd(b[15]); val mm = bcd(b[16]); val dd = bcd(b[17]); val mo = bcd(b[18])
                  val yr = bcd(b[19]) * 100 + bcd(b[20])
                  if (hh > 23 || mm > 59 || dd !in 1..31 || mo !in 1..12 || yr !in 2020..2099)
                      return Latest(false, "วันที่/เวลาไม่สมเหตุสมผล", false)
                  return Latest(true, "", (0..5).all { b[it] == 0.toByte() })
              }

              /** ปริมาตรสะสม 12 หลัก (BCD) ใช้เทียบ "น้อยกว่าครั้งก่อนหรือไม่" */
              fun volDigits(full: ByteArray): String = hex(full.copyOfRange(188, 194))

              /** กุญแจเปรียบเทียบการอ่าน: Meter ID/ขนาด (72–77) + ค่าล่าสุด (188–211) — ไม่รวมเวลาของมิเตอร์ที่เปลี่ยนทุกนาที */
              fun key(full: ByteArray): String = hex(full.copyOfRange(72, 78)) + hex(full.copyOfRange(184, 188)) + hex(full.copyOfRange(188, 212))

              fun criticalBad(bad: List<Int>): Boolean = bad.any { it in CRITICAL_BLOCKS || it in ID_BLOCKS }

              fun run(
                  maxTries: Int,
                  lastVol: String?,
                  readOnce: () -> MainActivity.DumpResult,
                  onTry: (Int) -> Unit,
                  pause: () -> Unit
              ): Pair<MainActivity.DumpResult, Verify> {
                  var prevKey: String? = null
                  var same = 0
                  var need = 2
                  var tries = 0
                  var note = ""
                  var suspect = false
                  var res: MainActivity.DumpResult? = null
                  while (tries < maxTries) {
                      tries++
                      onTry(tries)
                      val r = readOnce()
                      res = r
                      val chk = checkLatest(r.full)
                      if (!chk.ok || criticalBad(r.bad)) {
                          note = if (criticalBad(r.bad)) "อ่านบล็อกสำคัญไม่ได้" else chk.reason
                          prevKey = null
                          same = 0
                          suspect = false
                      } else {
                          val dropped = lastVol != null && volDigits(r.full) < lastVol
                          suspect = chk.volZero || dropped
                          need = if (suspect) 3 else 2                    // ปริมาตร 0 หรือน้อยกว่าครั้งก่อน ต้องอ่านตรงกัน 3 ครั้ง
                          note = if (chk.volZero) "ปริมาตรเป็น 0" else if (dropped) "ปริมาตรน้อยกว่าครั้งก่อน" else ""
                          val k = key(r.full)
                          same = if (k == prevKey) same + 1 else 1
                          prevKey = k
                          if (same >= need) break
                      }
                      pause()
                  }
                  val r = res!!
                  val ok = checkLatest(r.full).ok && !criticalBad(r.bad) && same >= need
                  return Pair(r, Verify(ok, suspect, tries, same, if (ok && !suspect) "" else if (note.isEmpty()) "ค่าไม่ตรงกันระหว่างอ่านซ้ำ" else note))
              }
          }
          EOF_FILE
          mkdir -p 'app/src/main/assets'
          cat > 'app/src/main/assets/feed.js' << 'EOF_FILE'
          function (d) {
            function rep(m) { try { NfcBridge.report(m); } catch (e) {} }
            try {
              var h = d.hex, u = new Uint8Array(h.length / 2);
              for (var i = 0; i < u.length; i++) u[i] = parseInt(h.substr(i * 2, 2), 16);

              function isReader(w) {
                try { return typeof w.load === 'function' && w.load.length === 2 && !!w.document.getElementById('file'); }
                catch (e) { return false; }
              }
              function find(w, depth) {
                if (isReader(w)) return w;
                if (depth > 3) return null;
                var fr;
                try { fr = w.document.querySelectorAll('iframe'); } catch (e) { return null; }
                for (var k = 0; k < fr.length; k++) {
                  var r = null;
                  try { r = find(fr[k].contentWindow, depth + 1); } catch (e) {}
                  if (r) return r;
                }
                return null;
              }
              function feed(w) { w.NFC_PART = (d.partial && d.ranges) ? d.ranges : null; w.NFC_META = d.verify ? { verify: true, verified: !!d.verified, attempts: d.attempts || 0, same: d.same || 0, escalated: !!d.escalated, note: d.note || '', unread: d.unreadableBlocks || [] } : { verify: false, unread: d.unreadableBlocks || [] }; w.load(u.buffer, 'nfc.bin'); rep('OK: เว็บประมวลผลข้อมูลจากมิเตอร์แล้ว' + (d.partial ? ' (อ่านเร็ว)' : '')); }

              var w = find(window, 0);
              if (w) { feed(w); return 'OK:direct'; }

              if (typeof ui !== 'undefined' && typeof render === 'function') {
                if (ui.tab !== 'nfc') {
                  var b = document.querySelector('[data-a="tab"][data-v="nfc"]');
                  if (b) b.click(); else { ui.tab = 'nfc'; render(); }
                }
                var n = 0, t = setInterval(function () {
                  n++;
                  var x = find(window, 0);
                  if (x) { clearInterval(t); try { feed(x); } catch (e) { rep('ERR:' + e.message); } }
                  else if (n > 80) { clearInterval(t); rep('ERR: รอเครื่องมือ NFC ในหน้า Dashboard นานเกินไป'); }
                }, 250);
                return 'WAIT:เปิดแท็บ NFC แล้ว';
              }
              return 'ERR: ไม่พบเครื่องมืออ่าน NFC ในหน้า ' + location.pathname;
            } catch (e) { return 'ERR:' + e.message; }
          }
