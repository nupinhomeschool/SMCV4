name: Build APK
on:
  workflow_dispatch:
  push:

env:
  # URL ของ Web App (ต้องขึ้นต้น https://)
  WEB_APP_URL: "https://nupinhomeschool.github.io/SMCV4/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          cat > 'settings.gradle.kts' << 'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SMCV4Reader"
          include(":app")
          EOF_FILE
          cat > 'build.gradle.kts' << 'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > 'gradle.properties' << 'EOF_FILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF_FILE
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' << 'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.smcv4reader"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.smcv4reader"
                  minSdk = 29          // ใช้ MediaStore Downloads ไม่ต้องขอ permission เก็บไฟล์
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF_FILE
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.NFC" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.nfc" android:required="true" />

              <application
                  android:label="SMCV4 Reader"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p 'app/src/main/java/com/example/smcv4reader'
          cat > 'app/src/main/java/com/example/smcv4reader/MainActivity.kt' << 'EOF_FILE'
          package com.example.smcv4reader

          import android.annotation.SuppressLint
          import android.content.ContentValues
          import android.content.Intent
          import android.net.Uri
          import android.graphics.Color
          import android.graphics.Typeface
          import android.nfc.NfcAdapter
          import android.nfc.Tag
          import android.nfc.tech.NfcV
          import android.os.Bundle
          import android.provider.MediaStore
          import android.text.InputType
          import android.view.View
          import android.view.ViewGroup.LayoutParams.MATCH_PARENT
          import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.util.concurrent.Callable
          import java.util.concurrent.FutureTask

          /**
           * หน้า 1 "Dump"   : เหมือนแอป ST25 -> ใส่ Start address / Number of bytes / ชื่อไฟล์ แล้วแตะแท็ก
           *                    แอปจะอ่านทั้งหมด, แสดง "Addr n: xx xx xx xx", บันทึกไฟล์ .bin ลงโฟลเดอร์ Download
           * หน้า 2 "Web App": เปิด SMCv4 Web App ใน WebView  ข้อมูลที่ dump จะถูกส่งเข้า window.onNfcDump(...)
           */
          class MainActivity : AppCompatActivity(), NfcAdapter.ReaderCallback {

              companion object {
                  // แก้เป็น URL Web App ของคุณ  หรือใช้ไฟล์ในแอป: "file:///android_asset/index.html"
                  const val WEB_APP_URL = "https://your-webapp.example.com/"
                  private const val FLAGS =
                      NfcAdapter.FLAG_READER_NFC_V or NfcAdapter.FLAG_READER_SKIP_NDEF_CHECK
              }

              private lateinit var etStart: EditText
              private lateinit var etLen: EditText
              private lateinit var etFile: EditText
              private lateinit var cbSend: CheckBox
              private lateinit var tvStatus: TextView
              private lateinit var tvHex: TextView
              private lateinit var dumpPanel: View
              private lateinit var webView: WebView
              private var nfc: NfcAdapter? = null
              private var pendingDump: String? = null     // dump ล่าสุด เผื่อหน้าเว็บยังโหลดไม่เสร็จ
              private var pageLoaded = false
              private var fileCallback: ValueCallback<Array<Uri>>? = null
              private lateinit var loadBar: ProgressBar
              private val feedJs: String by lazy { assets.open("feed.js").bufferedReader().readText() }
              private val openNfcJs: String by lazy { assets.open("opennfc.js").bufferedReader().readText() }

              // ให้ <input type=file> ในหน้าเว็บเปิดตัวเลือกไฟล์ของมือถือได้ (เช่นเลือกไฟล์ .bin)
              private val chooser = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                  fileCallback?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(r.resultCode, r.data))
                  fileCallback = null
              }

              /** หน้าเว็บเรียกกลับมารายงานผลการประมวลผล */
              inner class Bridge {
                  @JavascriptInterface
                  fun report(msg: String) {
                      runOnUiThread {
                          tvStatus.text = tvStatus.text.toString() + "  •  " + msg
                          toast(msg)
                          if (msg.startsWith("ERR")) undelivered = true else undelivered = false
                      }
                  }
              }

              private var undelivered = false             // มี dump ใหม่ที่ยังไม่ถูกประมวลผลในเว็บ

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val dp = resources.displayMetrics.density

                  // ---------- แผง Dump ----------
                  val panel = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  etStart = row(panel, "Start address:", "0", InputType.TYPE_CLASS_NUMBER)
                  etLen = row(panel, "Number of Bytes:", "8192", InputType.TYPE_CLASS_NUMBER)
                  etFile = row(panel, "Destination file:", "data4.bin", InputType.TYPE_CLASS_TEXT)
                  cbSend = CheckBox(this).apply {
                      text = "ส่งเข้า Web App อัตโนมัติหลังอ่านเสร็จ"
                      isChecked = true
                      setPadding((16 * dp).toInt(), 0, 0, 0)
                  }
                  panel.addView(cbSend)
                  tvStatus = TextView(this).apply {
                      text = "v6 • แตะโทรศัพท์ที่มิเตอร์ SMCV4 เพื่ออ่าน..."
                      setPadding((16 * dp).toInt(), (12 * dp).toInt(), (16 * dp).toInt(), (8 * dp).toInt())
                  }
                  tvHex = TextView(this).apply {
                      typeface = Typeface.MONOSPACE
                      textSize = 12f
                      setPadding((16 * dp).toInt(), 0, (16 * dp).toInt(), 0)
                      setTextIsSelectable(true)
                  }
                  panel.addView(tvHex)
                  dumpPanel = ScrollView(this).apply { addView(panel); setBackgroundColor(Color.WHITE) }

                  // ---------- WebView ----------
                  webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.allowFileAccess = true
                      addJavascriptInterface(Bridge(), "NfcBridge")
                      webViewClient = object : WebViewClient() {
                          override fun onPageFinished(view: WebView?, url: String?) {
                              pageLoaded = true
                              view?.evaluateJavascript("($openNfcJs)()", null)      // เปิดแท็บ Tool NFC ให้อัตโนมัติ
                              if (undelivered) pendingDump?.let { push(it) }
                          }
                      }
                      webChromeClient = object : WebChromeClient() {
                          override fun onProgressChanged(view: WebView?, p: Int) {
                              this@MainActivity.loadBar.progress = p
                              this@MainActivity.loadBar.visibility = if (p < 100) View.VISIBLE else View.GONE
                          }
                          override fun onShowFileChooser(
                              wv: WebView?, cb: ValueCallback<Array<Uri>>?, params: WebChromeClient.FileChooserParams?
                          ): Boolean {
                              fileCallback?.onReceiveValue(null)
                              fileCallback = cb
                              return try {
                                  val i = params!!.createIntent()
                                  i.type = "*/*"                                   // .bin ไม่มี MIME ตายตัว จึงเปิดให้เลือกได้ทุกไฟล์
                                  i.removeExtra(Intent.EXTRA_MIME_TYPES)
                                  chooser.launch(i)
                                  true
                              } catch (e: Exception) {
                                  fileCallback = null
                                  false
                              }
                          }
                      }
                      loadUrl(WEB_APP_URL)
                  }

                  // ---------- แถบสลับหน้า ----------
                  val btnDump = Button(this).apply { text = "Dump"; setOnClickListener { showWeb(false) } }
                  val btnWeb = Button(this).apply { text = "Web App"; setOnClickListener { showWeb(true) } }
                  val btnSend = Button(this).apply {
                      text = "ส่งซ้ำ"
                      setOnClickListener {
                          val j = pendingDump
                          if (j == null) toast("ยังไม่มีข้อมูล ให้แตะมิเตอร์ก่อน")
                          else { showWeb(true); push(j) }
                      }
                  }
                  val btnTest = Button(this).apply {
                      text = "ทดสอบ"
                      setOnClickListener {
                          showWeb(true)
                          if (pageLoaded) push(testDumpJson()) else toast("หน้าเว็บยังโหลดไม่เสร็จ")
                      }
                  }
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      addView(btnDump, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                      addView(btnWeb, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                      addView(btnSend, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                      addView(btnTest, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                      for (i in 0 until childCount) (getChildAt(i) as Button).apply { textSize = 12f; isAllCaps = false }
                  }
                  loadBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply { max = 100 }
                  val frame = FrameLayout(this).apply {
                      addView(webView, FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT))   // เว็บอยู่ข้างล่าง ไม่ถูกซ่อน
                      addView(loadBar, FrameLayout.LayoutParams(MATCH_PARENT, (6 * dp).toInt()))
                      addView(dumpPanel, FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT)) // หน้า Dump ซ้อนทับด้านบน
                  }
                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      addView(bar, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))
                      addView(tvStatus, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))
                      addView(frame, LinearLayout.LayoutParams(MATCH_PARENT, 0, 1f))
                  })

                  showWeb(true)       // เริ่มที่หน้า Web App แตะมิเตอร์แล้วข้อมูลเข้าเว็บทันที
                  nfc = NfcAdapter.getDefaultAdapter(this)
                  if (nfc == null) toast("เครื่องนี้ไม่มี NFC")
                  else if (nfc?.isEnabled == false) toast("กรุณาเปิด NFC ในการตั้งค่า")
              }

              override fun onResume() {
                  super.onResume()
                  webView.onResume()
                  nfc?.enableReaderMode(this, this, FLAGS, null)
              }

              override fun onPause() {
                  super.onPause()
                  nfc?.disableReaderMode(this)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (dumpPanel.visibility == View.GONE && webView.canGoBack()) webView.goBack()
                  else super.onBackPressed()
              }

              // ================================================================ NFC callback (background thread)

              override fun onTagDiscovered(tag: Tag) {
                  val start = ui { etStart.text.toString().toIntOrNull() ?: 0 }
                  val len = ui { etLen.text.toString().toIntOrNull() ?: 8192 }
                  val name = ui { etFile.text.toString().trim().ifEmpty { "dump.bin" } }
                  val send = ui { cbSend.isChecked }

                  try {
                      val res = readRange(tag, start, len)

                      val saveMsg = try { saveToDownloads(name, res.data); "File written successfully" }
                      catch (e: Exception) { "บันทึกไฟล์ไม่สำเร็จ: ${e.message}" }

                      val json = JSONObject()
                          .put("ok", true)
                          .put("uid", res.uid)
                          .put("start", res.start)
                          .put("length", res.data.size)
                          .put("hex", res.data.toHex())
                          .put("unreadableBlocks", JSONArray(res.bad))
                          .toString()

                      runOnUiThread {
                          tvHex.text = formatDump(res.start, res.data)
                          tvStatus.text = "v6 • UID ${res.uid}  •  ${res.data.size} bytes" +
                                  (if (res.bad.isNotEmpty()) "  •  อ่านไม่ได้ ${res.bad.size} blocks" else "")
                          toast(saveMsg)
                          pendingDump = json
                          undelivered = true
                          if (send) showWeb(true)          // showWeb จะส่งเข้าเว็บให้เอง
                          else if (pageLoaded) push(json)
                      }
                  } catch (e: Exception) {
                      runOnUiThread { tvStatus.text = "อ่านไม่สำเร็จ: ${e.message}"; toast("อ่านไม่สำเร็จ: ${e.message} (ลองแตะใหม่ ค้างไว้จนเสร็จ)") }
                  }
              }

              // ================================================================ อ่านหน่วยความจำ ISO15693

              private class MemInfo(val blockCount: Int, val blockSize: Int, val extended: Boolean)
              private class DumpResult(val uid: String, val start: Int, val data: ByteArray, val bad: List<Int>)

              private fun readRange(tag: Tag, start: Int, len: Int): DumpResult {
                  val v = NfcV.get(tag)
                      ?: error("แท็กไม่ใช่ NFC-V (ISO15693): " + tag.techList.joinToString())
                  v.connect()
                  try {
                      val info = readMemoryInfo(v)
                      val bs = info.blockSize
                      val totalBytes = info.blockCount * bs
                      val s = start.coerceIn(0, totalBytes - 1)
                      val n = len.coerceIn(1, totalBytes - s)
                      val first = s / bs
                      val last = (s + n - 1) / bs

                      val buf = ByteArrayOutputStream()
                      val bad = ArrayList<Int>()
                      var b = first
                      while (b <= last) {
                          val cnt = minOf(32, last - b + 1)               // อ่านทีละ 32 blocks (128 bytes)
                          val d = readBlocks(v, b, cnt, bs, info.extended)
                          if (d != null) buf.write(d)
                          else for (i in 0 until cnt) {                   // ถ้าพลาด ลองอ่านทีละ block
                              val one = readBlocks(v, b + i, 1, bs, info.extended)
                              if (one != null) buf.write(one) else { bad.add(b + i); buf.write(ByteArray(bs)) }
                          }
                          b += cnt
                          val done = b - first
                          runOnUiThread { tvStatus.text = "กำลังอ่าน... $done/${last - first + 1} blocks  (อย่าเอาโทรศัพท์ออกจากมิเตอร์)" }
                      }
                      val off = s - first * bs
                      return DumpResult(tag.id.reversedArray().toHex(), s, buf.toByteArray().copyOfRange(off, off + n), bad)
                  } finally {
                      try { v.close() } catch (_: Exception) {}
                  }
              }

              private fun readMemoryInfo(v: NfcV): MemInfo {
                  // Extended Get System Info (ST25DV64K = 2048 blocks x 4 bytes = 8192 bytes)
                  try {
                      val r = v.transceive(byteArrayOf(0x02, 0x3B))
                      if (r.size > 12 && (r[0].toInt() and 1) == 0) {
                          val f = r[1].toInt()
                          var i = 10
                          if (f and 1 != 0) i++
                          if (f and 2 != 0) i++
                          if (f and 4 != 0) {
                              val blocks = ((r[i].toInt() and 0xFF) or ((r[i + 1].toInt() and 0xFF) shl 8)) + 1
                              val size = (r[i + 2].toInt() and 0x1F) + 1
                              return MemInfo(blocks, size, true)
                          }
                      }
                  } catch (_: Exception) {}
                  try {
                      val r = v.transceive(byteArrayOf(0x02, 0x2B))
                      if (r.size > 12 && (r[0].toInt() and 1) == 0) {
                          val f = r[1].toInt()
                          var i = 10
                          if (f and 1 != 0) i++
                          if (f and 2 != 0) i++
                          if (f and 4 != 0)
                              return MemInfo((r[i].toInt() and 0xFF) + 1, (r[i + 1].toInt() and 0x1F) + 1, false)
                      }
                  } catch (_: Exception) {}
                  return MemInfo(2048, 4, true)   // ค่าเริ่มต้น = ST25DV64K ตามภาพ (8192 bytes)
              }

              private fun readBlocks(v: NfcV, blk: Int, cnt: Int, bs: Int, ext: Boolean): ByteArray? {
                  val lo = blk.toByte(); val hi = (blk shr 8).toByte()
                  val nl = (cnt - 1).toByte(); val nh = ((cnt - 1) shr 8).toByte()
                  val cmd = when {
                      cnt == 1 && ext -> byteArrayOf(0x02, 0x30, lo, hi)
                      cnt == 1 -> byteArrayOf(0x02, 0x20, lo)
                      ext -> byteArrayOf(0x02, 0x33, lo, hi, nl, nh)
                      else -> byteArrayOf(0x02, 0x23, lo, nl)
                  }
                  repeat(3) {
                      try {
                          val r = v.transceive(cmd)
                          if (r.isNotEmpty() && (r[0].toInt() and 1) != 0) return null      // tag ตอบ error
                          if (r.size == 1 + cnt * bs) return r.copyOfRange(1, r.size)
                      } catch (_: Exception) { /* ลองใหม่ */ }
                  }
                  return null
              }

              // ================================================================ helper

              private fun saveToDownloads(name: String, data: ByteArray) {
                  val values = ContentValues().apply {
                      put(MediaStore.Downloads.DISPLAY_NAME, name)
                      put(MediaStore.Downloads.MIME_TYPE, "application/octet-stream")
                      put(MediaStore.Downloads.IS_PENDING, 1)
                  }
                  val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      ?: error("สร้างไฟล์ไม่ได้")
                  contentResolver.openOutputStream(uri)!!.use { it.write(data) }
                  values.clear()
                  values.put(MediaStore.Downloads.IS_PENDING, 0)
                  contentResolver.update(uri, values, null, null)
              }

              /** รูปแบบเหมือนแอป ST25:  Addr     72: 69 10 00 04   i... */
              private fun formatDump(start: Int, d: ByteArray): String {
                  val sb = StringBuilder()
                  var i = 0
                  while (i < d.size) {
                      val end = minOf(i + 4, d.size)
                      sb.append("Addr %5d: ".format(start + i))
                      for (j in i until end) sb.append("%02X ".format(d[j]))
                      repeat(4 - (end - i)) { sb.append("   ") }
                      sb.append(" ")
                      for (j in i until end) {
                          val c = d[j].toInt() and 0xFF
                          sb.append(if (c in 32..126) c.toChar() else ' ')
                      }
                      sb.append('\n')
                      i = end
                  }
                  return sb.toString()
              }

              private fun push(json: String) {
                  webView.evaluateJavascript("($feedJs)($json)") { r ->
                      val res = (r ?: "").trim('"')
                      tvStatus.text = tvStatus.text.toString() + "  •  ส่งเข้า Web App: " + res
                      if (res.startsWith("OK") || res.startsWith("WAIT")) undelivered = false
                      else toast("ส่งเข้า Web App ไม่สำเร็จ: $res")
                  }
              }

              /** ข้อมูลทดสอบ (ตัวอย่าง 3.31 V จากเว็บ) ใช้เช็กว่าท่อส่งข้อมูลเข้าเว็บทำงานไหม โดยไม่ต้องใช้มิเตอร์ */
              private fun testDumpJson(): String {
                  val d = ByteArray(8192)
                  "69 10 00 04".split(" ").forEachIndexed { i, h -> d[72 + i] = h.toInt(16).toByte() }
                  ("00 00 00 00 19 85 B5 B5 B5 B5 B5 B5 00 00 00 17 06 16 04 20 25 11 FF 76")
                      .split(" ").forEachIndexed { i, h -> d[188 + i] = h.toInt(16).toByte() }
                  return JSONObject().put("ok", true).put("uid", "TEST").put("start", 0)
                      .put("length", d.size).put("hex", d.toHex())
                      .put("unreadableBlocks", JSONArray()).toString()
              }

              private fun showWeb(web: Boolean) {
                  dumpPanel.visibility = if (web) View.GONE else View.VISIBLE
                  // ทุกครั้งที่เปิดหน้า Web App ถ้ามีข้อมูลใหม่ที่ยังไม่ได้ประมวลผล ให้ส่งเข้าเว็บทันที
                  if (web && undelivered && pageLoaded) pendingDump?.let { push(it) }
              }

              private fun row(parent: LinearLayout, label: String, def: String, type: Int): EditText {
                  val dp = resources.displayMetrics.density
                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding((16 * dp).toInt(), (8 * dp).toInt(), (16 * dp).toInt(), 0)
                  }
                  r.addView(TextView(this).apply { text = label }, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                  val et = EditText(this).apply { setText(def); inputType = type; setSingleLine() }
                  r.addView(et, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                  parent.addView(r)
                  return et
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              private fun <T> ui(block: () -> T): T {
                  val t = FutureTask(Callable { block() })
                  runOnUiThread(t)
                  return t.get()
              }

              private fun ByteArray.toHex() = joinToString("") { "%02X".format(it) }
          }
          EOF_FILE
          mkdir -p 'app/src/main/assets'
          cat > 'app/src/main/assets/feed.js' << 'EOF_FILE'
          function (d) {
            function rep(m) { try { NfcBridge.report(m); } catch (e) {} }
            try {
              var h = d.hex, u = new Uint8Array(h.length / 2);
              for (var i = 0; i < u.length; i++) u[i] = parseInt(h.substr(i * 2, 2), 16);

              function isReader(w) {
                try { return typeof w.load === 'function' && w.load.length === 2 && !!w.document.getElementById('file'); }
                catch (e) { return false; }
              }
              function find(w, depth) {
                if (isReader(w)) return w;
                if (depth > 3) return null;
                var fr;
                try { fr = w.document.querySelectorAll('iframe'); } catch (e) { return null; }
                for (var k = 0; k < fr.length; k++) {
                  var r = null;
                  try { r = find(fr[k].contentWindow, depth + 1); } catch (e) {}
                  if (r) return r;
                }
                return null;
              }
              function feed(w) { w.load(u.buffer, 'nfc.bin'); rep('OK: เว็บประมวลผลข้อมูลจากมิเตอร์แล้ว'); }

              var w = find(window, 0);
              if (w) { feed(w); return 'OK:direct'; }

              if (typeof ui !== 'undefined' && typeof render === 'function') {
                if (ui.tab !== 'nfc') {
                  var b = document.querySelector('[data-a="tab"][data-v="nfc"]');
                  if (b) b.click(); else { ui.tab = 'nfc'; render(); }
                }
                var n = 0, t = setInterval(function () {
                  n++;
                  var x = find(window, 0);
                  if (x) { clearInterval(t); try { feed(x); } catch (e) { rep('ERR:' + e.message); } }
                  else if (n > 80) { clearInterval(t); rep('ERR: รอเครื่องมือ NFC ในหน้า Dashboard นานเกินไป'); }
                }, 250);
                return 'WAIT:เปิดแท็บ NFC แล้ว';
              }
              return 'ERR: ไม่พบเครื่องมืออ่าน NFC ในหน้า ' + location.pathname;
            } catch (e) { return 'ERR:' + e.message; }
          }
          EOF_FILE
          mkdir -p 'app/src/main/assets'
          cat > 'app/src/main/assets/opennfc.js' << 'EOF_FILE'
          function () {
            try {
              if (typeof ui !== 'undefined' && typeof render === 'function' && ui.tab !== 'nfc') {
                var b = document.querySelector('[data-a="tab"][data-v="nfc"]');
                if (b) b.click(); else { ui.tab = 'nfc'; render(); }
              }
            } catch (e) {}
          }
          EOF_FILE
          sed -i "s|https://your-webapp.example.com/|$WEB_APP_URL|" app/src/main/java/com/example/smcv4reader/MainActivity.kt
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SMCV4Reader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
