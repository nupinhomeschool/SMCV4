                  when {
                      a == null -> { tvNfc.text = "ไม่มี NFC"; tvNfc.background = rounded(cRed2, 20) }
                      !a.isEnabled -> { tvNfc.text = "NFC ปิดอยู่"; tvNfc.background = rounded(Color.parseColor("#92400E"), 20) }
                      else -> { tvNfc.text = "●  NFC พร้อม"; tvNfc.background = rounded(cTeal2, 20) }
