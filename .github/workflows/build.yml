              }

              // =====================================================================  การนำทาง / ปุ่ม

              private fun showReaderScreen() {
                  readerScreen.visibility = View.VISIBLE
              }

              private fun openWebScreen() {
                  readerScreen.visibility = View.GONE
                  if (undelivered && pageLoaded) pendingDump?.let { push(it) }
              }

              private fun resend() {
                  val j = pendingDump
                  if (j == null) toast("ยังไม่มีข้อมูล ให้แตะมิเตอร์ก่อน")
                  else if (!pageLoaded) toast("หน้าเว็บยังโหลดไม่เสร็จ")
                  else { readerScreen.visibility = View.GONE; push(j) }
              }

              private fun runTest() {
                  if (!pageLoaded) { toast("หน้าเว็บยังโหลดไม่เสร็จ"); return }
                  readerScreen.visibility = View.GONE
                  push(testDumpJson())
              }

              private fun showSettings() {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(dp(22), dp(10), dp(22), dp(0))
                  fun field(name: String, value: String, numeric: Boolean): EditText {
                      box.addView(label(name, 12f, Color.parseColor("#475569")).apply { setPadding(0, dp(10), 0, 0) })
                      val e = EditText(this)
                      e.setText(value)
                      e.setSingleLine()
                      e.inputType = if (numeric) InputType.TYPE_CLASS_NUMBER else InputType.TYPE_CLASS_TEXT
                      box.addView(e)
                      return e
                  }
                  val eStart = field("Start address", cfgInt("start", 0).toString(), true)
                  val eLen = field("Number of Bytes", cfgInt("len", 8192).toString(), true)
                  val eName = field("ชื่อไฟล์ที่บันทึก", cfgName(), false)
                  AlertDialog.Builder(this)
                      .setTitle("ตั้งค่าอ่าน")
                      .setView(box)
                      .setPositiveButton("บันทึก") { _, _ ->
                          prefs.edit()
                              .putInt("start", eStart.text.toString().toIntOrNull() ?: 0)
                              .putInt("len", (eLen.text.toString().toIntOrNull() ?: 8192).coerceAtLeast(1))
                              .putString("name", eName.text.toString().trim().ifEmpty { "data.bin" })
                              .apply()
                          refreshSaveLabel()
                          toast("บันทึกการตั้งค่าแล้ว")
                      }
                      .setNegativeButton("ยกเลิก", null)
                      .show()
              }

              // =====================================================================  บันทึกไฟล์ / ดาวน์โหลดจากเว็บ

              private fun saveDump(data: ByteArray) {
                  try {
                      saveToDownloads(cfgName(), data, "application/octet-stream")
                      toast("บันทึกไฟล์ ${cfgName()} ลงโฟลเดอร์ Download แล้ว")
                  } catch (e: Exception) {
                      toast("บันทึกไฟล์ไม่สำเร็จ: ${e.message}")
                  }
              }

              private fun saveToDownloads(name: String, data: ByteArray, mime: String) {
                  val values = ContentValues()
                  values.put(MediaStore.Downloads.DISPLAY_NAME, name)
                  values.put(MediaStore.Downloads.MIME_TYPE, mime)
                  values.put(MediaStore.Downloads.IS_PENDING, 1)
                  val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      ?: error("สร้างไฟล์ไม่ได้")
                  contentResolver.openOutputStream(uri)!!.use { it.write(data) }
                  values.clear()
                  values.put(MediaStore.Downloads.IS_PENDING, 0)
                  contentResolver.update(uri, values, null, null)
              }

              /** ปุ่ม Export (เช่น Excel) ในเว็บสร้างลิงก์ blob: ต้องดึงข้อมูลออกมาบันทึกเอง */
              private fun handleDownload(url: String, mime: String?) {
                  val m = (mime ?: "").replace("'", "")
                  if (url.startsWith("blob:")) {
                      val u = url.replace("'", "")
                      webView.evaluateJavascript(
                          "(function(u,m){fetch(u).then(function(r){return r.blob();}).then(function(b){" +
                              "var f=new FileReader();f.onload=function(){" +
                              "NfcBridge.saveFile(m||b.type||'application/octet-stream',String(f.result).split(',')[1]);};" +
                              "f.readAsDataURL(b);}).catch(function(e){NfcBridge.report('ERR: ดาวน์โหลดไม่สำเร็จ '+e.message);});})('$u','$m')",
                          null
                      )
                  } else if (url.startsWith("data:")) {
                      try {
                          val comma = url.indexOf(',')
                          val meta = url.substring(5, comma)
                          val payload = url.substring(comma + 1)
                          val bytes = if (meta.contains("base64")) Base64.decode(payload, Base64.DEFAULT)
                          else Uri.decode(payload).toByteArray()
                          val mm = meta.substringBefore(';').ifEmpty { "application/octet-stream" }
                          val ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(mm) ?: "bin"
                          val name = "SMCV4_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date()) + "." + ext
                          saveToDownloads(name, bytes, mm)
                          toast("บันทึกไฟล์ $name ลงโฟลเดอร์ Download แล้ว")
                      } catch (e: Exception) {
                          toast("บันทึกไฟล์ไม่สำเร็จ: ${e.message}")
                      }
                  } else {
                      toast("ไม่รองรับการดาวน์โหลดจากลิงก์นี้")
                  }
              }

              // =====================================================================  ส่งข้อมูลเข้า Web App

              private fun push(json: String) {
                  webView.evaluateJavascript("($feedJs)($json)") { r ->
                      val res = (r ?: "").trim('"')
                      when {
                          res.startsWith("OK") -> { undelivered = false; setSendStatus("✓ ส่งเข้า Web App แล้ว", true) }
                          res.startsWith("WAIT") -> { undelivered = false; setSendStatus("กำลังเปิดเครื่องมือ NFC ในเว็บ...", true) }
                          else -> { undelivered = true; setSendStatus("✗ $res", false); toast("ส่งเข้า Web App ไม่สำเร็จ: $res") }
                      }
                  }
              }

              /** ข้อมูลทดสอบ (ตัวอย่าง 3.31 V) ใช้เช็กว่าท่อส่งข้อมูลเข้าเว็บทำงานไหม โดยไม่ต้องใช้มิเตอร์ */
              private fun testDumpJson(): String {
                  val d = ByteArray(8192)
                  "69 10 00 04".split(" ").forEachIndexed { i, h -> d[72 + i] = h.toInt(16).toByte() }
                  ("00 00 00 00 19 85 B5 B5 B5 B5 B5 B5 00 00 00 17 06 16 04 20 25 11 FF 76")
                      .split(" ").forEachIndexed { i, h -> d[188 + i] = h.toInt(16).toByte() }
                  return JSONObject().put("ok", true).put("uid", "TEST").put("start", 0)
                      .put("length", d.size).put("hex", d.toHex())
                      .put("unreadableBlocks", JSONArray()).toString()
              }

              // =====================================================================  helper ด้าน UI

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun rounded(color: Int, radiusDp: Int, strokeColor: Int = 0, strokeDp: Int = 0): GradientDrawable {
                  val g = GradientDrawable()
                  g.cornerRadius = dp(radiusDp).toFloat()
                  g.setColor(color)
                  if (strokeDp > 0) g.setStroke(dp(strokeDp), strokeColor)
                  return g
              }

              private fun label(t: String, sp: Float, color: Int, bold: Boolean = false): TextView {
                  val tv = TextView(this)
                  tv.text = t
                  tv.textSize = sp
                  tv.setTextColor(color)
                  if (bold) tv.typeface = Typeface.DEFAULT_BOLD
                  return tv
              }

              private fun pill(text: String, filled: Boolean, onClick: () -> Unit): Button {
                  val b = Button(this)
                  b.text = text
                  b.isAllCaps = false
                  b.textSize = 14f
                  b.typeface = Typeface.DEFAULT_BOLD
                  b.setTextColor(if (filled) cNavy else cTeal)
                  b.background = if (filled) rounded(cTeal, 14) else rounded(Color.TRANSPARENT, 14, cTeal, 2)
                  b.minHeight = 0
                  b.minimumHeight = 0
                  b.setPadding(dp(12), dp(12), dp(12), dp(12))
                  b.setOnClickListener { onClick() }
                  return b
              }

              private fun infoRow(name: String, value: TextView): View {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.setPadding(0, dp(7), 0, dp(7))
                  row.addView(label(name, 13f, cMuted), LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                  row.addView(value, LinearLayout.LayoutParams(0, WRAP_CONTENT, 2f))
                  return row
              }

              private fun makeBar(c1: Int, c2: Int): LayerDrawable {
                  val bg = GradientDrawable()
                  bg.cornerRadius = 100f
                  bg.setColor(Color.parseColor("#163A66"))
                  val fg = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(c1, c2))
                  fg.cornerRadius = 100f
                  val clip = ClipDrawable(fg, Gravity.START, ClipDrawable.HORIZONTAL)
                  val layers = LayerDrawable(arrayOf<Drawable>(bg, clip))
                  layers.setId(0, android.R.id.background)
                  layers.setId(1, android.R.id.progress)
                  return layers
              }

              private fun refreshSaveLabel() {
                  cbSave.text = "บันทึกไฟล์ ${cfgName()} ลงมือถือ (โฟลเดอร์ Download)"
              }

              private fun cfgInt(k: String, d: Int): Int = prefs.getInt(k, d)
              private fun cfgName(): String = prefs.getString("name", "data.bin") ?: "data.bin"

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              private fun ByteArray.toHex() = joinToString("") { "%02X".format(it) }
          }
          EOF_FILE
          mkdir -p 'app/src/main/assets'
          cat > 'app/src/main/assets/feed.js' << 'EOF_FILE'
          function (d) {
            function rep(m) { try { NfcBridge.report(m); } catch (e) {} }
            try {
              var h = d.hex, u = new Uint8Array(h.length / 2);
              for (var i = 0; i < u.length; i++) u[i] = parseInt(h.substr(i * 2, 2), 16);

              function isReader(w) {
                try { return typeof w.load === 'function' && w.load.length === 2 && !!w.document.getElementById('file'); }
                catch (e) { return false; }
              }
              function find(w, depth) {
                if (isReader(w)) return w;
                if (depth > 3) return null;
                var fr;
                try { fr = w.document.querySelectorAll('iframe'); } catch (e) { return null; }
                for (var k = 0; k < fr.length; k++) {
                  var r = null;
                  try { r = find(fr[k].contentWindow, depth + 1); } catch (e) {}
                  if (r) return r;
                }
                return null;
              }
              function feed(w) { w.load(u.buffer, 'nfc.bin'); rep('OK: เว็บประมวลผลข้อมูลจากมิเตอร์แล้ว'); }

              var w = find(window, 0);
              if (w) { feed(w); return 'OK:direct'; }

              if (typeof ui !== 'undefined' && typeof render === 'function') {
                if (ui.tab !== 'nfc') {
                  var b = document.querySelector('[data-a="tab"][data-v="nfc"]');
                  if (b) b.click(); else { ui.tab = 'nfc'; render(); }
                }
                var n = 0, t = setInterval(function () {
                  n++;
                  var x = find(window, 0);
                  if (x) { clearInterval(t); try { feed(x); } catch (e) { rep('ERR:' + e.message); } }
                  else if (n > 80) { clearInterval(t); rep('ERR: รอเครื่องมือ NFC ในหน้า Dashboard นานเกินไป'); }
                }, 250);
                return 'WAIT:เปิดแท็บ NFC แล้ว';
              }
              return 'ERR: ไม่พบเครื่องมืออ่าน NFC ในหน้า ' + location.pathname;
            } catch (e) { return 'ERR:' + e.message; }
          }
          EOF_FILE
          mkdir -p 'app/src/main/assets'
          cat > 'app/src/main/assets/opennfc.js' << 'EOF_FILE'
          function () {
            try {
              if (typeof ui !== 'undefined' && typeof render === 'function' && ui.tab !== 'nfc') {
                var b = document.querySelector('[data-a="tab"][data-v="nfc"]');
                if (b) b.click(); else { ui.tab = 'nfc'; render(); }
              }
            } catch (e) {}
          }
          EOF_FILE
          sed -i "s|https://your-webapp.example.com/|$WEB_APP_URL|" app/src/main/java/com/example/smcv4reader/MainActivity.kt
