              private fun saveDump(data: ByteArray) {
                  try {
                      saveToDownloads(cfgName(), data, "application/octet-stream")
                      toast("บันทึกไฟล์ ${cfgName()} ลงโฟลเดอร์ Download แล้ว")
                  } catch (e: Exception) {
                      toast("บันทึกไฟล์ไม่สำเร็จ: ${e.message}")
                  }
              }

              private fun saveToDownloads(name: String, data: ByteArray, mime: String) {
                  val values = ContentValues()
                  values.put(MediaStore.Downloads.DISPLAY_NAME, name)
                  values.put(MediaStore.Downloads.MIME_TYPE, mime)
                  values.put(MediaStore.Downloads.IS_PENDING, 1)
                  val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      ?: error("สร้างไฟล์ไม่ได้")
                  contentResolver.openOutputStream(uri)!!.use { it.write(data) }
                  values.clear()
                  values.put(MediaStore.Downloads.IS_PENDING, 0)
                  contentResolver.update(uri, values, null, null)
              }

              /** ปุ่ม Export (เช่น Excel) ในเว็บสร้างลิงก์ blob: ต้องดึงข้อมูลออกมาบันทึกเอง */
              private fun handleDownload(url: String, mime: String?) {
                  val m = (mime ?: "").replace("'", "")
                  if (url.startsWith("blob:")) {
                      val u = url.replace("'", "")
                      webView.evaluateJavascript(
                          "(function(u,m){fetch(u).then(function(r){return r.blob();}).then(function(b){" +
                              "var f=new FileReader();f.onload=function(){" +
                              "NfcBridge.saveFile(m||b.type||'application/octet-stream',String(f.result).split(',')[1]);};" +
                              "f.readAsDataURL(b);}).catch(function(e){NfcBridge.report('ERR: ดาวน์โหลดไม่สำเร็จ '+e.message);});})('$u','$m')",
                          null
                      )
                  } else if (url.startsWith("data:")) {
                      try {
                          val comma = url.indexOf(',')
                          val meta = url.substring(5, comma)
                          val payload = url.substring(comma + 1)
                          val bytes = if (meta.contains("base64")) Base64.decode(payload, Base64.DEFAULT)
                          else Uri.decode(payload).toByteArray()
                          val mm = meta.substringBefore(';').ifEmpty { "application/octet-stream" }
                          val ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(mm) ?: "bin"
                          val name = "SMCV4_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date()) + "." + ext
                          saveToDownloads(name, bytes, mm)
                          toast("บันทึกไฟล์ $name ลงโฟลเดอร์ Download แล้ว")
                      } catch (e: Exception) {
                          toast("บันทึกไฟล์ไม่สำเร็จ: ${e.message}")
                      }
                  } else {
                      toast("ไม่รองรับการดาวน์โหลดจากลิงก์นี้")
                  }
              }

