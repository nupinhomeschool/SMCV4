name: Build APK
on:
  workflow_dispatch:
  push:

env:
  # URL ของ Web App (ต้องขึ้นต้น https://)
  WEB_APP_URL: "https://nupinhomeschool.github.io/SMCV4/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          cat > 'settings.gradle.kts' << 'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SMCV4Reader"
          include(":app")
          EOF_FILE
          cat > 'build.gradle.kts' << 'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > 'gradle.properties' << 'EOF_FILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF_FILE
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' << 'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.smcv4reader"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.smcv4reader"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF_FILE
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.NFC" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.nfc" android:required="true" />

              <application
                  android:label="SMCV4 NFC Reader"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p 'app/src/main/java/com/example/smcv4reader'
          cat > 'app/src/main/java/com/example/smcv4reader/MainActivity.kt' << 'EOF_FILE'
          package com.example.smcv4reader
          
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.nfc.NfcAdapter
          import android.nfc.Tag
          import android.nfc.tech.NfcV
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup.LayoutParams.MATCH_PARENT
          import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.util.concurrent.Callable
          import java.util.concurrent.FutureTask
          
          class MainActivity : AppCompatActivity(), NfcAdapter.ReaderCallback {
          
              companion object {
                  const val WEB_APP_URL = "https://your-webapp.example.com/"
                  private const val FLAGS =
                      NfcAdapter.FLAG_READER_NFC_V or NfcAdapter.FLAG_READER_SKIP_NDEF_CHECK
                  private const val NAVY = 0xFF101B36.toInt()
                  private const val PANEL = 0xFF192746.toInt()
                  private const val TEAL = 0xFF20D6C7.toInt()
                  private const val WHITE = 0xFFF5F8FF.toInt()
                  private const val MUTED = 0xFFB7C4DC.toInt()
              }
          
              private lateinit var etStart: EditText
              private lateinit var etLen: EditText
              private lateinit var tvStatus: TextView
              private lateinit var tvHex: TextView
              private lateinit var dumpPanel: View
              private lateinit var webView: WebView
              private lateinit var loadBar: ProgressBar
              private lateinit var nfcProgress: ProgressBar
              private lateinit var tvPercent: TextView
              private lateinit var tvProgressDetail: TextView
              private lateinit var tvUid: TextView
          
              private var nfc: NfcAdapter? = null
              private var pendingDump: String? = null
              private var pageLoaded = false
              private var fileCallback: ValueCallback<Array<Uri>>? = null
              private var undelivered = false
              private val feedJs: String by lazy { assets.open("feed.js").bufferedReader().readText() }
              private val openNfcJs: String by lazy { assets.open("opennfc.js").bufferedReader().readText() }
          
              private val chooser = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                  fileCallback?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(r.resultCode, r.data))
                  fileCallback = null
              }
          
              inner class Bridge {
                  @JavascriptInterface
                  fun report(msg: String) {
                      runOnUiThread {
                          tvStatus.text = msg
                          undelivered = msg.startsWith("ERR")
                          if (msg.startsWith("OK")) {
                              tvStatus.setTextColor(TEAL)
                              tvProgressDetail.text = "ข้อมูลถูกส่งไปยัง Web App แล้ว"
                          } else if (msg.startsWith("ERR")) {
                              tvStatus.setTextColor(0xFFFF8A8A.toInt())
                              tvProgressDetail.text = "ส่งไม่สำเร็จ แตะ “ส่งซ้ำ” เพื่อลองอีกครั้ง"
                          }
                          toast(msg)
                      }
                  }
              }
          
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = NAVY
                  window.navigationBarColor = NAVY
                  window.decorView.systemUiVisibility = 0
          
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(NAVY)
                  }
          
                  // Header
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(20), dp(18), dp(20), dp(18))
                      background = gradient(0xFF213B69.toInt(), 0xFF14213E.toInt(), 22)
                  }
                  header.addView(TextView(this).apply {
                      text = "SMCV4  •  NFC READER"
                      textSize = 22f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                  })
                  header.addView(TextView(this).apply {
                      text = "อ่านข้อมูลมิเตอร์ แล้วส่งตรงเข้า Web App"
                      textSize = 13f
                      setTextColor(0xFFD4E4FF.toInt())
                      setPadding(0, dp(5), 0, 0)
                  })
                  root.addView(header, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))
          
                  // NFC progress card
                  val progressCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                      background = rounded(PANEL, 18)
                  }
                  val progressHeading = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  progressHeading.addView(TextView(this).apply {
                      text = "สถานะการอ่าน NFC"
                      textSize = 15f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(WHITE)
                  }, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                  tvPercent = TextView(this).apply {
                      text = "0%"
                      textSize = 25f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(TEAL)
                  }
                  progressHeading.addView(tvPercent)
                  progressCard.addView(progressHeading)
          
                  nfcProgress = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 100
                      progress = 0
                      progressTintList = ColorStateList.valueOf(TEAL)
                      progressBackgroundTintList = ColorStateList.valueOf(0xFF344361.toInt())
                      progressDrawable?.setTint(TEAL)
                  }
                  progressCard.addView(nfcProgress, LinearLayout.LayoutParams(MATCH_PARENT, dp(10)).apply {
                      topMargin = dp(10)
                      bottomMargin = dp(7)
                  })
          
                  tvProgressDetail = TextView(this).apply {
                      text = "พร้อมใช้งาน • แตะโทรศัพท์ค้างไว้ที่มิเตอร์"
                      textSize = 12f
                      setTextColor(MUTED)
                  }
                  progressCard.addView(tvProgressDetail)
                  tvUid = TextView(this).apply {
                      text = "UID: —"
                      textSize = 12f
                      setTextColor(0xFF9FB3D9.toInt())
                      setPadding(0, dp(4), 0, 0)
                  }
                  progressCard.addView(tvUid)
                  root.addView(progressCard, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply {
                      setMargins(dp(12), dp(12), dp(12), dp(8))
                  })
          
                  tvStatus = TextView(this).apply {
                      text = "พร้อมอ่านข้อมูลจาก ST25DV64KC"
                      textSize = 13f
                      setTextColor(WHITE)
                      setPadding(dp(16), dp(5), dp(16), dp(8))
                  }
                  root.addView(tvStatus, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))
          
                  // Dump controls: retained for custom address/length, but no file name or file saving.
                  val dumpContents = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                      setBackgroundColor(0xFF111D35.toInt())
                  }
                  etStart = row(dumpContents, "Start address", "0", InputType.TYPE_CLASS_NUMBER)
                  etLen = row(dumpContents, "จำนวน bytes", "8192", InputType.TYPE_CLASS_NUMBER)
                  tvHex = TextView(this).apply {
                      typeface = Typeface.MONOSPACE
                      textSize = 11f
                      setTextColor(WHITE)
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                      setTextIsSelectable(true)
                  }
                  dumpContents.addView(tvHex)
                  dumpPanel = ScrollView(this).apply {
                      addView(dumpContents)
                      visibility = View.GONE
                      background = rounded(0xFF111D35.toInt(), 16)
                  }
          
                  // WebView
                  loadBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 100
                      progressTintList = ColorStateList.valueOf(TEAL)
                      progressBackgroundTintList = ColorStateList.valueOf(0xFF344361.toInt())
                      visibility = View.GONE
                  }
                  webView = WebView(this).apply {
                      setBackgroundColor(Color.WHITE)
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.allowFileAccess = true
                      addJavascriptInterface(Bridge(), "NfcBridge")
                      webViewClient = object : WebViewClient() {
                          override fun onPageFinished(view: WebView?, url: String?) {
                              pageLoaded = true
                              view?.evaluateJavascript("($openNfcJs)()", null)
                              if (undelivered) pendingDump?.let { push(it) }
                          }
                      }
                      webChromeClient = object : WebChromeClient() {
                          override fun onProgressChanged(view: WebView?, p: Int) {
                              loadBar.progress = p
                              loadBar.visibility = if (p < 100) View.VISIBLE else View.GONE
                          }
          
                          override fun onShowFileChooser(
                              wv: WebView?,
                              cb: ValueCallback<Array<Uri>>?,
                              params: WebChromeClient.FileChooserParams?
                          ): Boolean {
                              fileCallback?.onReceiveValue(null)
                              fileCallback = cb
                              return try {
                                  val i = params!!.createIntent()
                                  i.type = "*/*"
                                  i.removeExtra(Intent.EXTRA_MIME_TYPES)
                                  chooser.launch(i)
                                  true
                              } catch (_: Exception) {
                                  fileCallback = null
                                  false
                              }
                          }
                      }
                  }
          
                  val frame = FrameLayout(this).apply {
                      addView(webView, FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT))
                      addView(dumpPanel, FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT))
                      addView(loadBar, FrameLayout.LayoutParams(MATCH_PARENT, dp(4), Gravity.TOP))
                  }
          
                  val actions = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(8), dp(4), dp(8), dp(8))
                      addView(actionButton("Web App", TEAL) { showWeb(true) },
                          LinearLayout.LayoutParams(0, dp(46), 1f).apply { setMargins(dp(3), 0, dp(3), 0) })
                      addView(actionButton("ตั้งค่าอ่าน", 0xFF344361.toInt()) { showWeb(false) },
                          LinearLayout.LayoutParams(0, dp(46), 1f).apply { setMargins(dp(3), 0, dp(3), 0) })
                      addView(actionButton("ส่งซ้ำ", 0xFF4D63A8.toInt()) {
                          val j = pendingDump
                          if (j == null) toast("ยังไม่มีข้อมูล กรุณาแตะมิเตอร์ก่อน")
                          else {
                              showWeb(true)
                              if (pageLoaded) push(j) else toast("กำลังโหลด Web App")
                          }
                      }, LinearLayout.LayoutParams(0, dp(46), 1f).apply { setMargins(dp(3), 0, dp(3), 0) })
                      addView(actionButton("ทดสอบ", 0xFF344361.toInt()) {
                          showWeb(true)
                          if (pageLoaded) {
                              pendingDump = testDumpJson()
                              undelivered = true
                              push(pendingDump!!)
                          } else toast("หน้าเว็บยังโหลดไม่เสร็จ")
                      }, LinearLayout.LayoutParams(0, dp(46), 1f).apply { setMargins(dp(3), 0, dp(3), 0) })
                  }
          
                  root.addView(actions)
                  root.addView(frame, LinearLayout.LayoutParams(MATCH_PARENT, 0, 1f))
                  setContentView(root)
          
                  showWeb(true)
                  webView.loadUrl(WEB_APP_URL)
                  nfc = NfcAdapter.getDefaultAdapter(this)
                  if (nfc == null) {
                      tvStatus.text = "เครื่องนี้ไม่มี NFC"
                      tvStatus.setTextColor(0xFFFF8A8A.toInt())
                  } else if (nfc?.isEnabled == false) {
                      tvStatus.text = "กรุณาเปิด NFC ในการตั้งค่าโทรศัพท์"
                  }
              }
          
              override fun onResume() {
                  super.onResume()
                  if (::webView.isInitialized) webView.onResume()
                  nfc?.enableReaderMode(this, this, FLAGS, null)
              }
          
              override fun onPause() {
                  super.onPause()
                  nfc?.disableReaderMode(this)
                  if (::webView.isInitialized) webView.onPause()
              }
          
              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (dumpPanel.visibility == View.GONE && webView.canGoBack()) webView.goBack()
                  else super.onBackPressed()
              }
          
              override fun onTagDiscovered(tag: Tag) {
                  val start = ui { etStart.text.toString().toIntOrNull() ?: 0 }
                  val len = ui { etLen.text.toString().toIntOrNull() ?: 8192 }
          
                  runOnUiThread {
                      nfcProgress.progress = 0
                      tvPercent.text = "0%"
                      tvUid.text = "UID: กำลังอ่าน..."
                      tvProgressDetail.text = "กำลังอ่านหน่วยความจำ กรุณาค้างโทรศัพท์ไว้"
                      tvStatus.text = "เริ่มอ่าน NFC..."
                      tvStatus.setTextColor(WHITE)
                  }
          
                  try {
                      val res = readRange(tag, start, len) { done, total ->
                          val percent = if (total <= 0) 0 else ((done * 100f) / total).toInt().coerceIn(0, 100)
                          runOnUiThread {
                              nfcProgress.progress = percent
                              tvPercent.text = "$percent%"
                              tvProgressDetail.text = "อ่านแล้ว $done / $total blocks"
                              tvStatus.text = "กำลังอ่านข้อมูล NFC • กรุณาอย่าเอาโทรศัพท์ออก"
                          }
                      }
          
                      val json = JSONObject()
                          .put("ok", true)
                          .put("uid", res.uid)
                          .put("start", res.start)
                          .put("length", res.data.size)
                          .put("hex", res.data.toHex())
                          .put("unreadableBlocks", JSONArray(res.bad))
                          .toString()
          
                      runOnUiThread {
                          nfcProgress.progress = 100
                          tvPercent.text = "100%"
                          tvUid.text = "UID: ${res.uid}"
                          tvProgressDetail.text = "อ่านเสร็จ ${res.data.size} bytes • กำลังส่งข้อมูลเข้า Web App"
                          tvHex.text = formatDump(res.start, res.data)
                          tvStatus.text = if (res.bad.isEmpty()) "อ่าน NFC สำเร็จ กำลังส่งข้อมูล..." else
                              "อ่านเสร็จ แต่มี ${res.bad.size} blocks ที่อ่านไม่ได้"
                          tvStatus.setTextColor(if (res.bad.isEmpty()) TEAL else 0xFFFFC46B.toInt())
                          pendingDump = json
                          undelivered = true
                          showWeb(true)
                          if (pageLoaded) push(json) else tvProgressDetail.text = "อ่านครบแล้ว • รอ Web App โหลดเพื่อส่งข้อมูล"
                      }
                  } catch (e: Exception) {
                      runOnUiThread {
                          tvStatus.text = "อ่านไม่สำเร็จ: ${e.message ?: "ไม่ทราบสาเหตุ"}"
                          tvStatus.setTextColor(0xFFFF8A8A.toInt())
                          tvProgressDetail.text = "ลองแตะมิเตอร์อีกครั้ง และค้างไว้จนแถบครบ 100%"
                          toast("อ่านไม่สำเร็จ กรุณาลองแตะใหม่")
                      }
                  }
              }
          
              private class MemInfo(val blockCount: Int, val blockSize: Int, val extended: Boolean)
              private class DumpResult(val uid: String, val start: Int, val data: ByteArray, val bad: List<Int>)
          
              private fun readRange(tag: Tag, start: Int, len: Int, onProgress: (Int, Int) -> Unit): DumpResult {
                  val v = NfcV.get(tag) ?: error("แท็กไม่ใช่ NFC-V (ISO15693)")
                  v.connect()
                  try {
                      val info = readMemoryInfo(v)
                      val bs = info.blockSize
                      val totalBytes = info.blockCount * bs
                      require(totalBytes > 0) { "ไม่พบขนาดหน่วยความจำ" }
                      val s = start.coerceIn(0, totalBytes - 1)
                      val n = len.coerceIn(1, totalBytes - s)
                      val first = s / bs
                      val last = (s + n - 1) / bs
                      val totalBlocks = last - first + 1
                      val buf = ByteArrayOutputStream()
                      val bad = ArrayList<Int>()
                      var b = first
                      while (b <= last) {
                          val cnt = minOf(32, last - b + 1)
                          val d = readBlocks(v, b, cnt, bs, info.extended)
                          if (d != null) buf.write(d)
                          else {
                              for (i in 0 until cnt) {
                                  val one = readBlocks(v, b + i, 1, bs, info.extended)
                                  if (one != null) buf.write(one)
                                  else {
                                      bad.add(b + i)
                                      buf.write(ByteArray(bs))
                                  }
                              }
                          }
                          b += cnt
                          onProgress((b - first).coerceAtMost(totalBlocks), totalBlocks)
                      }
                      val off = s - first * bs
                      return DumpResult(tag.id.reversedArray().toHex(), s,
                          buf.toByteArray().copyOfRange(off, off + n), bad)
                  } finally {
                      try { v.close() } catch (_: Exception) {}
                  }
              }
          
              private fun readMemoryInfo(v: NfcV): MemInfo {
                  try {
                      val r = v.transceive(byteArrayOf(0x02, 0x3B))
                      if (r.size > 12 && (r[0].toInt() and 1) == 0) {
                          val f = r[1].toInt()
                          var i = 10
                          if (f and 1 != 0) i++
                          if (f and 2 != 0) i++
                          if (f and 4 != 0) {
                              val blocks = ((r[i].toInt() and 0xFF) or ((r[i + 1].toInt() and 0xFF) shl 8)) + 1
                              val size = (r[i + 2].toInt() and 0x1F) + 1
                              return MemInfo(blocks, size, true)
                          }
                      }
                  } catch (_: Exception) {}
                  try {
                      val r = v.transceive(byteArrayOf(0x02, 0x2B))
                      if (r.size > 12 && (r[0].toInt() and 1) == 0) {
                          val f = r[1].toInt()
                          var i = 10
                          if (f and 1 != 0) i++
                          if (f and 2 != 0) i++
                          if (f and 4 != 0)
                              return MemInfo((r[i].toInt() and 0xFF) + 1, (r[i + 1].toInt() and 0x1F) + 1, false)
                      }
                  } catch (_: Exception) {}
                  return MemInfo(2048, 4, true)
              }
          
              private fun readBlocks(v: NfcV, blk: Int, cnt: Int, bs: Int, ext: Boolean): ByteArray? {
                  val lo = blk.toByte()
                  val hi = (blk shr 8).toByte()
                  val nl = (cnt - 1).toByte()
                  val nh = ((cnt - 1) shr 8).toByte()
                  val cmd = when {
                      cnt == 1 && ext -> byteArrayOf(0x02, 0x30, lo, hi)
                      cnt == 1 -> byteArrayOf(0x02, 0x20, lo)
                      ext -> byteArrayOf(0x02, 0x33, lo, hi, nl, nh)
                      else -> byteArrayOf(0x02, 0x23, lo, nl)
                  }
                  repeat(3) {
                      try {
                          val r = v.transceive(cmd)
                          if (r.isNotEmpty() && (r[0].toInt() and 1) != 0) return null
                          if (r.size == 1 + cnt * bs) return r.copyOfRange(1, r.size)
                      } catch (_: Exception) {}
                  }
                  return null
              }
          
              private fun formatDump(start: Int, d: ByteArray): String {
                  val sb = StringBuilder()
                  var i = 0
                  while (i < d.size) {
                      val end = minOf(i + 4, d.size)
                      sb.append("Addr %5d: ".format(start + i))
                      for (j in i until end) sb.append("%02X ".format(d[j]))
                      repeat(4 - (end - i)) { sb.append("   ") }
                      sb.append(" ")
                      for (j in i until end) {
                          val c = d[j].toInt() and 0xFF
                          sb.append(if (c in 32..126) c.toChar() else ' ')
                      }
                      sb.append('\n')
                      i = end
                  }
                  return sb.toString()
              }
          
              private fun push(json: String) {
                  if (!pageLoaded) {
                      undelivered = true
                      tvProgressDetail.text = "ข้อมูลพร้อมแล้ว • รอ Web App โหลด"
                      return
                  }
                  webView.evaluateJavascript("($feedJs)($json)") { raw ->
                      val res = (raw ?: "").trim('"')
                      if (res.startsWith("OK")) {
                          tvStatus.text = "ส่งข้อมูลเข้า Web App แล้ว"
                          tvStatus.setTextColor(TEAL)
                          tvProgressDetail.text = "ส่งข้อมูลสำเร็จ • ตรวจสอบผลใน Web App"
                          undelivered = false
                      } else if (res.startsWith("WAIT")) {
                          tvStatus.text = "กำลังเตรียมเครื่องมือ NFC ใน Web App"
                          tvStatus.setTextColor(0xFFFFC46B.toInt())
                          tvProgressDetail.text = "รอ Web App พร้อมรับข้อมูล"
                          undelivered = true
                      } else {
                          tvStatus.text = "ส่งข้อมูลไม่สำเร็จ: $res"
                          tvStatus.setTextColor(0xFFFF8A8A.toInt())
                          tvProgressDetail.text = "แตะ “ส่งซ้ำ” เพื่อลองอีกครั้ง"
                          undelivered = true
                          toast("ส่งเข้า Web App ไม่สำเร็จ")
                      }
                  }
              }
          
              private fun testDumpJson(): String {
                  val d = ByteArray(8192)
                  "69 10 00 04".split(" ").forEachIndexed { i, h -> d[72 + i] = h.toInt(16).toByte() }
                  "00 00 00 00 19 85 B5 B5 B5 B5 B5 B5 00 00 00 17 06 16 04 20 25 11 FF 76"
                      .split(" ").forEachIndexed { i, h -> d[188 + i] = h.toInt(16).toByte() }
                  return JSONObject().put("ok", true).put("uid", "TEST").put("start", 0)
                      .put("length", d.size).put("hex", d.toHex())
                      .put("unreadableBlocks", JSONArray()).toString()
              }
          
              private fun showWeb(web: Boolean) {
                  dumpPanel.visibility = if (web) View.GONE else View.VISIBLE
                  if (web && undelivered && pageLoaded) pendingDump?.let { push(it) }
              }
          
              private fun row(parent: LinearLayout, label: String, def: String, type: Int): EditText {
                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(8), dp(6), dp(8), dp(2))
                  }
                  r.addView(TextView(this).apply {
                      text = label
                      textSize = 13f
                      setTextColor(WHITE)
                  }, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                  val et = EditText(this).apply {
                      setText(def)
                      inputType = type
                      setSingleLine()
                      textSize = 14f
                      setTextColor(WHITE)
                      setHintTextColor(MUTED)
                  }
                  r.addView(et, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                  parent.addView(r)
                  return et
              }
          
              private fun actionButton(label: String, color: Int, action: () -> Unit): Button =
                  Button(this).apply {
                      text = label
                      isAllCaps = false
                      textSize = 12f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(if (color == TEAL) NAVY else Color.WHITE)
                      background = rounded(color, 14)
                      setOnClickListener { action() }
                  }
          
              private fun rounded(color: Int, radiusDp: Int) = GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = dp(radiusDp).toFloat()
              }
          
              private fun gradient(a: Int, b: Int, radiusDp: Int) = GradientDrawable(
                  GradientDrawable.Orientation.TL_BR, intArrayOf(a, b)
              ).apply { cornerRadius = dp(radiusDp).toFloat() }
          
              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
          
              private fun <T> ui(block: () -> T): T {
                  val t = FutureTask(Callable { block() })
                  runOnUiThread(t)
                  return t.get()
              }
          
              private fun ByteArray.toHex() = joinToString("") { "%02X".format(it) }
          }
          EOF_FILE
          mkdir -p 'app/src/main/assets'
          cat > 'app/src/main/assets/feed.js' << 'EOF_FILE'
          function (d) {
            function rep(m) { try { NfcBridge.report(m); } catch (e) {} }
            try {
              var h = d.hex, u = new Uint8Array(h.length / 2);
              for (var i = 0; i < u.length; i++) u[i] = parseInt(h.substr(i * 2, 2), 16);

              function isReader(w) {
                try { return typeof w.load === 'function' && w.load.length === 2 && !!w.document.getElementById('file'); }
                catch (e) { return false; }
              }
              function find(w, depth) {
                if (isReader(w)) return w;
                if (depth > 3) return null;
                var fr;
                try { fr = w.document.querySelectorAll('iframe'); } catch (e) { return null; }
                for (var k = 0; k < fr.length; k++) {
                  var r = null;
                  try { r = find(fr[k].contentWindow, depth + 1); } catch (e) {}
                  if (r) return r;
                }
                return null;
              }
              function feed(w) { w.load(u.buffer, 'nfc.bin'); rep('OK: เว็บประมวลผลข้อมูลจากมิเตอร์แล้ว'); }

              var w = find(window, 0);
              if (w) { feed(w); return 'OK:direct'; }

              if (typeof ui !== 'undefined' && typeof render === 'function') {
                if (ui.tab !== 'nfc') {
                  var b = document.querySelector('[data-a="tab"][data-v="nfc"]');
                  if (b) b.click(); else { ui.tab = 'nfc'; render(); }
                }
                var n = 0, t = setInterval(function () {
                  n++;
                  var x = find(window, 0);
                  if (x) { clearInterval(t); try { feed(x); } catch (e) { rep('ERR:' + e.message); } }
                  else if (n > 80) { clearInterval(t); rep('ERR: รอเครื่องมือ NFC ในหน้า Dashboard นานเกินไป'); }
                }, 250);
                return 'WAIT:เปิดแท็บ NFC แล้ว';
              }
              return 'ERR: ไม่พบเครื่องมืออ่าน NFC ในหน้า ' + location.pathname;
            } catch (e) { return 'ERR:' + e.message; }
          }
          EOF_FILE
          mkdir -p 'app/src/main/assets'
          cat > 'app/src/main/assets/opennfc.js' << 'EOF_FILE'
          function () {
            try {
              if (typeof ui !== 'undefined' && typeof render === 'function' && ui.tab !== 'nfc') {
                var b = document.querySelector('[data-a="tab"][data-v="nfc"]');
                if (b) b.click(); else { ui.tab = 'nfc'; render(); }
              }
            } catch (e) {}
          }
          EOF_FILE
          sed -i "s|https://your-webapp.example.com/|$WEB_APP_URL|" app/src/main/java/com/example/smcv4reader/MainActivity.kt
