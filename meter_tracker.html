<style>

</style></head><body>
<div class="app"><div class="top"><div><span class="pill g">SMCV4</span><span class="pill">ทะเบียนมิเตอร์ที่ผ่านการทดสอบ R160</span><h1>📇 ติดตามมิเตอร์ที่ผ่านการทดสอบ</h1><p>โหลดไฟล์ Excel ผลทดสอบแต่ละน้ำ → คัดเลือกเฉพาะมิเตอร์ที่ผ่านครบ → บันทึกคุณสมบัติ (K1–K20, แบตเตอรี่, รุ่น, ผู้ทดสอบ, Lot) → ค้นหาและเชื่อม Google Sheet</p></div><div class="bar"><a class="btn" href="index.html">⬅ กลับ Web App หลัก</a></div></div>
<nav id="nav"></nav><main id="view"></main></div><div id="toast"></div><input id="fi" type="file" accept=".xlsx,.xls" multiple hidden><input id="fj" type="file" accept=".json" hidden>
<script>
const KEY='smacv4_trk_db_v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),f=(v,d=2)=>v!==''&&v!=null&&isFinite(v)?(+v).toFixed(d):'—',sg=v=>v!==''&&isFinite(v)?(v>0?'+':'')+(+v).toFixed(2):'—',fm=v=>(+v).toLocaleString('en-US');
const SLOTS=[['น้ำที่ 1','ไหลต่ำ','#22d3ee',15,16],['น้ำที่ 2','ไหลต่ำ–กลาง','#a78bfa',22.5,25],['น้ำที่ 3','ไหลกลาง–สูง','#fbbf24',1200,1300],['น้ำที่ 4','ไหลสูงสุด','#34d399',2400,2500]];
const PEND='รอระบุ',SHIP=['ผ่านทดสอบ','พร้อมส่งมอบ','ส่งมอบแล้ว','ส่งซ่อม/ทดสอบซ้ำ'],KC=['#22d3ee','#fbbf24','#a78bfa','#f472b6','#34d399','#fb923c'];
const COLS=['rid','id','date','tester','dept','lot','model','size','type','hw','fw','batBrand','batModel','batV','flow1','err1','batch1','flow2','err2','batch2','flow3','err3','batch3','flow4','err4','batch4','maxErr','status','ship','customer','shipDate','note','kmix','ts'];
const defDB=()=>({v:2,slots:[[],[],[],[]],rg:SLOTS.map(s=>[s[3],s[4]]),reg:[],cfg:{url:'',token:'',last:''},def:{model:'Multijet',type:'อิเล็กทรอนิกส์ (Hall)',fw:PEND,batBrand:PEND,batModel:PEND,dept:'ฝ่ายผลิต',tester:'',lot:'',date:'',note:'',size:''},rule:{n:4,multi:'last',needK:1}});
let DB,S={tab:'gate',pend:null,sel:new Set(),flt:'all',q:'',sz:'',md:'',sh:'',ks:'',d1:'',d2:'',pendOnly:0,open:null,regSel:new Set(),gs:[],gsq:'',gsid:'',gslot:''};
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}const b=defDB();DB=d&&d.slots?{...b,...d,cfg:{...b.cfg,...d.cfg},def:{...b.def,...d.def},rule:{...b.rule,...d.rule}}:b;if(!DB.rg||DB.rg.length!==4)DB.rg=b.rg}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('⚠ บันทึกในเบราว์เซอร์ไม่ได้ — ใช้ปุ่มสำรอง JSON')}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3600)}
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
function needXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('โหลดตัวอ่าน Excel ไม่ได้ (ต้องต่ออินเทอร์เน็ตครั้งแรก)'));document.head.appendChild(s)})}
/* ---------- วันที่ ---------- */
function isoOf(s){s=String(s||'');let x=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);if(x)return x[3]+'-'+x[2].padStart(2,'0')+'-'+x[1].padStart(2,'0');x=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(x)return x[0];const d=new Date(s);return isNaN(d)?'':d.toISOString().slice(0,10)}
function tOf(s){s=String(s||'');const x=/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T]?(\d{1,2})?:?(\d{2})?:?(\d{2})?/.exec(s);if(x)return Date.UTC(+x[3],+x[2]-1,+x[1],+x[4]||0,+x[5]||0,+x[6]||0);const d=Date.parse(s);return isNaN(d)?0:d}
const th=iso=>{const x=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');return x?x[3]+'/'+x[2]+'/'+(+x[1]+543):'—'};
/* ---------- อ่านไฟล์ Excel (รองรับหลาย Batch ต่อชีต) ---------- */
function parseBlocks(a,fn){const out=[];let B=null;const fin=()=>{if(B&&B.rows.length)out.push(mk(B,fn));B=null};
 for(const r of a){const c0=r[0];
  if(c0==='No.'){if(B&&B.H&&B.rows.length)fin();if(!B)B={P:{},H:null,rows:[]};B.H={};r.forEach((c,i)=>B.H[c]=i);continue}
  if(B&&B.H&&B.rows.length&&!(+c0>0)&&c0!==''&&r[1]!==undefined&&r[1]!=='')fin();
  if(!B)B={P:{},H:null,rows:[]};
  if(!B.H){if(c0&&r[1]!==undefined&&r[1]!=='')B.P[c0]=r[1];continue}
  if(+c0>0)B.rows.push(r)}
 fin();return out}
function mk(B,fn){const H=B.H,g=(r,n)=>r[H[n]]??'';
 const ms=B.rows.map(r=>({meter:String(g(r,'Meter Number')),err:+g(r,'err (%)'),vol:+g(r,'Volume (litre)'),test:+g(r,'Volume Test (litre)'),st:String(g(r,'Status')),R:[1,2].map(n=>{const q=k=>g(r,'Round '+n+' '+k);return{sz:parseInt(q('Meter Size'),16)||0,bat:String(q('Battery')),k:String(q('K1-K20')).split('|').map(x=>parseInt(x.trim(),10))}})})),P=B.P;
 return{id:String(P['Batch ID']||fn),file:fn,date:String(P['Date']||''),prod:String(P['Production Batch']||''),op:String(P['Leader Tester / Operator']||''),hw:String(P['Hardware Model']||''),tv:+P['Target Volume (litre)']||0,tf:+P['Target Flow Rate (L/h)']||0,pe:+P['Pass Error (±%)']||2,sz:ms[0].R[0].sz||0,ms}}
const slotOf=tf=>DB.rg.findIndex(r=>tf>=r[0]*.99&&tf<=r[1]*1.01);
function ingestWB(wb,fn,target){const rep={n:0,skip:[],warn:[]};for(const sn of wb.SheetNames){const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});let bl=[];try{bl=parseBlocks(a,fn)}catch(e){}
  for(const b of bl){let si=target!=null?target:slotOf(b.tf);if(si<0){rep.skip.push(b.id+' ('+b.tf+' L/h)');continue}
   if(target!=null&&slotOf(b.tf)!==target)rep.warn.push(b.id+' Flow '+b.tf+' ไม่อยู่ในช่วง '+DB.rg[target].join('–'));
   const L=DB.slots[si],i=L.findIndex(x=>x.id===b.id);if(i>=0)L[i]=b;else L.push(b);rep.n++}}return rep}
async function loadFiles(files,target){try{await needXLSX();const tot={n:0,skip:[],warn:[]};for(const file of files){const wb=XLSX.read(await file.arrayBuffer());const r=ingestWB(wb,file.name,target);tot.n+=r.n;tot.skip.push(...r.skip);tot.warn.push(...r.warn)}
  save();autoSel();render();toast('โหลด '+tot.n+' Batch'+(tot.skip.length?' · ข้าม '+tot.skip.length+' (ไม่อยู่ในช่วงน้ำใดๆ: '+tot.skip.slice(0,3).join(', ')+')':'')+(tot.warn.length?' · ⚠ '+tot.warn[0]:''))}catch(e){toast('อ่านไฟล์ไม่ได้: '+(e.message||e))}}
/* ---------- คัดเลือก ---------- */
function evalAll(){const R=DB.rule,M=new Map();DB.slots.forEach((L,si)=>L.forEach(b=>b.ms.forEach(m=>{if(!M.has(m.meter))M.set(m.meter,{id:m.meter,A:[[],[],[],[]]});M.get(m.meter).A[si].push({b,m,t:tOf(b.date),pass:m.st==='PASS'&&isFinite(m.err)&&Math.abs(m.err)<=b.pe+1e-9})})));
 return[...M.values()].map(x=>{x.A.forEach(a=>a.sort((p,q)=>p.t-q.t));
  x.F=x.A.map(a=>{if(!a.length)return null;const l=a[a.length-1],ok=R.multi==='all'?a.every(z=>z.pass):l.pass;return{flow:l.b.tf,err:l.m.err,batch:l.b.id,pass:ok,n:a.length,lim:l.b.pe}});
  const tested=x.F.filter(Boolean),failed=x.F.map((q,i)=>q&&!q.pass?i+1:0).filter(Boolean),all=x.A.flat().sort((p,q)=>p.t-q.t),last=all[all.length-1],ks=all.map(z=>(z.m.R[1].k.length===20&&z.m.R[1].k.every(Number.isFinite))?z.m.R[1].k.join(','):'').filter(Boolean);
  x.tested=tested.length;x.K=ks.length?ks[ks.length-1].split(',').map(Number):null;x.kmix=new Set(ks).size>1?1:0;
  const bt=String(last.m.R[1].bat).trim(),bv=/^(\d+(?:\.\d+)?)\s*V?$/i.exec(bt);x.batV=bv&&+bv[1]<10?+bv[1]:'';x.tester=last.b.op;x.lot=last.b.prod;x.date=isoOf(last.b.date);x.hw=last.b.hw;x.size=last.b.sz||0;x.files=[...new Set(all.map(z=>z.b.id))];
  x.maxErr=Math.max(...tested.map(q=>Math.abs(q.err)));
  x.ok=!failed.length&&x.tested>=R.n&&(!R.needK||!!x.K);
  x.why=failed.length?'ไม่ผ่าน น้ำ '+failed.join(', '):x.tested<R.n?'ทดสอบ '+x.tested+'/'+R.n+' น้ำ (ขาด '+x.F.map((q,i)=>q?0:i+1).filter(Boolean).join(', ')+')':(!x.K&&R.needK)?'ไม่มี K1–K20':'ผ่านครบ';
  x.cls=x.ok?'ok':failed.length?'bad':'miss';return x}).sort((a,b)=>a.id.localeCompare(b.id))}
function autoSel(){const rg=new Set(DB.reg.map(r=>r.id));S.sel=new Set(evalAll().filter(x=>x.ok&&!rg.has(x.id)).map(x=>x.id))}
/* ---------- กราฟเล็ก ---------- */
function ring(v,c,t){const r=34,C=2*Math.PI*r;return `<svg width="86" height="86" viewBox="0 0 86 86"><circle cx="43" cy="43" r="${r}" fill="none" stroke="#1e293b" stroke-width="9"/><circle cx="43" cy="43" r="${r}" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*v} ${C}" transform="rotate(-90 43 43)"/><text x="43" y="47" text-anchor="middle" style="fill:#fff;font-size:15px;font-weight:700">${t}</text></svg>`}
function ksets(L){const m=new Map();L.forEach(r=>{if(!r.K)return;const k=r.K.join(',');if(!m.has(k))m.set(k,{k:r.K,ids:[]});m.get(k).ids.push(r.id)});return[...m.values()].sort((a,b)=>b.ids.length-a.ids.length).map((s,i)=>({...s,name:'ชุด K-'+String.fromCharCode(65+i),c:KC[i%6]}))}
function kChart(sets){if(!sets.length)return'';const w=760,h=260,p={l:54,r:14,t:14,b:30},iw=w-p.l-p.r,ih=h-p.t-p.b,al=sets.flatMap(s=>s.k),mn=Math.floor((Math.min(...al)-50)/100)*100,mx=Math.ceil((Math.max(...al)+50)/100)*100,X=i=>p.l+iw*(i+.5)/20,Y=v=>p.t+ih*(1-(v-mn)/(mx-mn));let s=`<svg class="svg" viewBox="0 0 ${w} ${h}">`;

function out_(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);}

function doGet(e){var p=e.parameter;if(p.token!==TOKEN)return out_({error:'token ไม่ถูกต้อง'});
  var rows=rows_();

    rows=rows.filter(function(o){
      if(p.id&&String(o.id).indexOf(p.id)<0)return false;
      if(p.lot&&String(o.lot).toLowerCase().indexOf(p.lot.toLowerCase())<0)return false;
      if(p.from&&String(o.date)<p.from)return false;

function doPost(e){var b=JSON.parse(e.postData.contents);if(b.token!==TOKEN)return out_({error:'token ไม่ถูกต้อง'});

const flat=r=>{const o={};COLS.forEach(c=>o[c]=r[c]??'');(r.F||[]).forEach((q,i)=>{o['flow'+(i+1)]=q?q.flow:'';o['err'+(i+1)]=q?q.err:'';o['batch'+(i+1)]=q?q.batch:''});for(let i=0;i<20;i++)o['K'+(i+1)]=r.K?r.K[i]:'';return o};
const unflat=o=>{const r={};COLS.forEach(c=>r[c]=o[c]??'');['size','batV','maxErr','ts','kmix'].forEach(c=>{if(r[c]!==''&&isFinite(+r[c]))r[c]=+r[c]});r.F=[1,2,3,4].map(i=>o['err'+i]!==''&&o['err'+i]!=null&&isFinite(+o['err'+i])?{flow:+o['flow'+i],err:+o['err'+i],batch:String(o['batch'+i]||''),pass:Math.abs(+o['err'+i])<=(+o['flow'+i]<=16?5:2),n:1}:null);const k=Array.from({length:20},(_,i)=>o['K'+(i+1)]);r.K=k.every(v=>v!==''&&v!=null&&isFinite(+v))?k.map(Number):null;r.src=[];return r};
