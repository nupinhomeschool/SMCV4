<div class="app"><div class="top"><div><span class="pill g">SMCV4</span><span class="pill">ทะเบียนมิเตอร์ที่ผ่านการทดสอบ R160</span><h1>📇 ติดตามมิเตอร์ที่ผ่านการทดสอบ</h1><p>โหลดไฟล์ Excel ผลทดสอบแต่ละน้ำ → คัดเลือกเฉพาะมิเตอร์ที่ผ่านครบ → บันทึกคุณสมบัติ (K1–K20, แบตเตอรี่, รุ่น, ผู้ทดสอบ, Lot) → ค้นหาและเชื่อม Google Sheet</p></div><div class="bar"><span id="sync"></span><a class="btn" href="index.html">⬅ กลับ Web App หลัก</a></div></div>
<nav id="nav"></nav><main id="view"></main></div><div id="pv" hidden></div><div id="toast"></div><input id="fi" type="file" accept=".xlsx,.xls" multiple hidden><input id="fj" type="file" accept=".json" hidden>
<script>
const GS_DEFAULT={url:'https://script.google.com/macros/s/AKfycbxo0sEfBznbnavl_FyT_4zXVG_E6H3UTmERlf9NddMFa1wRtdKYYQl951bk46b0Dr_k/exec',token:'1234'};   // ลิงก์ Web App + Token เริ่มต้น (แก้ได้ที่นี่ หรือในแท็บ ☁️)
const LEG_HEAD=['rid', 'date', 'id', 'lot', 'model', 'size', 'type', 'hw', 'fw', 'batBrand', 'batV', 'flow', 'vTest', 'vRead', 'err', 'result', 'tester', 'dept', 'note', 'src', 'ts', 'K1', 'K2', 'K3', 'K4', 'K5', 'K6', 'K7', 'K8', 'K9', 'K10', 'K11', 'K12', 'K13', 'K14', 'K15', 'K16', 'K17', 'K18', 'K19', 'K20'];
const KEY='smacv4_trk_db_v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),f=(v,d=2)=>v!==''&&v!=null&&isFinite(v)?(+v).toFixed(d):'—',sg=v=>v!==''&&isFinite(v)?(v>0?'+':'')+(+v).toFixed(2):'—',fm=v=>(+v).toLocaleString('en-US');
const SLOTS=[['น้ำที่ 1','ไหลต่ำ','#22d3ee',15,16],['น้ำที่ 2','ไหลต่ำ–กลาง','#a78bfa',22.5,25],['น้ำที่ 3','ไหลกลาง–สูง','#fbbf24',1200,1300],['น้ำที่ 4','ไหลสูงสุด','#34d399',2400,2500]];
const RCL=['R100','R160','R200','R400'],KQ3={15:2500,20:4000,25:6300,40:16000,50:25000,60:40000,80:63000,100:100000,120:160000,150:250000},q1Of=(sz,rc)=>KQ3[+sz]&&rc?KQ3[+sz]/+String(rc).slice(1):0;
const PEND='รอระบุ',SHIP=['ผ่านทดสอบ','พร้อมส่งมอบ','ส่งมอบแล้ว','ส่งซ่อม/ทดสอบซ้ำ'],KC=['#22d3ee','#fbbf24','#a78bfa','#f472b6','#34d399','#fb923c'];
/* หัวตาราง = เหมือน Apps Script ทุกตัวอักษร: LEGACY.concat(EXTRA) — ถ้าแก้ฝั่ง Apps Script ให้แก้ตรงนี้ให้ตรงกันด้วย */
const LEGACY=['rid','date','id','lot','model','size','type','hw','fw','batBrand','batV','flow','vTest','vRead','err','result','tester','dept','note','src','ts',...Array.from({length:20},(_,i)=>'K'+(i+1))];
const EXTRA=['batModel','rclass','flow1','err1','batch1','flow2','err2','batch2','flow3','err3','batch3','flow4','err4','batch4','maxErr','status','ship','customer','shipDate','kmix'];
const HEAD=LEGACY.concat(EXTRA);
const MIRROR=['flow','vTest','vRead','err','result'];   // คอลัมน์เดิมของ Sheet: แอปเติมให้ (flow/err/result) แต่ไม่อ่านกลับ
const COLS=HEAD.filter(c=>!/^K\d+$/.test(c)&&!MIRROR.includes(c)&&c!=='src');   // ฟิลด์ของรายการในแอป (ไม่รวม K, F, src)
let SY={st:'idle',err:null},flushing=false;
const defDB=()=>({v:2,slots:[[],[],[],[]],rg:SLOTS.map(s=>[s[3],s[4]]),reg:[],cfg:{url:'',token:'',last:'',auto:1,q:[],dq:[]},use:[1,1,1,1],def:{rclass:'R160',model:'Multijet',type:'อิเล็กทรอนิกส์ (Hall)',fw:PEND,batBrand:PEND,batModel:PEND,dept:'ฝ่ายผลิต',tester:'',lot:'',date:'',note:'',size:''},rule:{n:4,multi:'last',needK:1}});
let DB,S={src:'local',gsr:null,gsraw:[],gsTotal:0,pv:{on:0,mode:'table',orient:'landscape',k:1,onlySel:0},rc:'',incReg:0,tab:'gate',pend:null,sel:new Set(),flt:'all',q:'',sz:'',md:'',sh:'',ks:'',d1:'',d2:'',pendOnly:0,open:null,regSel:new Set(),gs:[],gsq:'',gsid:'',gslot:''};
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}const b=defDB();DB=d&&d.slots?{...b,...d,cfg:{...b.cfg,...d.cfg},def:{...b.def,...d.def},rule:{...b.rule,...d.rule}}:b;if(!DB.rg||DB.rg.length!==4)DB.rg=b.rg;if(!DB.cfg.url){DB.cfg.url=GS_DEFAULT.url;DB.cfg.token=GS_DEFAULT.token}if(!Array.isArray(DB.use)||DB.use.length!==4)DB.use=[1,1,1,1];DB.reg.forEach(r=>{if(!r.F0)r.F0=r.F;if(!r.rclass)r.rclass='R160'})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('⚠ บันทึกในเบราว์เซอร์ไม่ได้ — ใช้ปุ่มสำรอง JSON')}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3600)}
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
function needXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('โหลดตัวอ่าน Excel ไม่ได้ (ต้องต่ออินเทอร์เน็ตครั้งแรก)'));document.head.appendChild(s)})}
/* ---------- วันที่ ---------- */
function isoOf(s){s=String(s||'');let x=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);if(x)return x[3]+'-'+x[2].padStart(2,'0')+'-'+x[1].padStart(2,'0');x=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(x)return x[0];const d=new Date(s);return isNaN(d)?'':d.toISOString().slice(0,10)}
function tOf(s){s=String(s||'');const x=/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T]?(\d{1,2})?:?(\d{2})?:?(\d{2})?/.exec(s);if(x)return Date.UTC(+x[3],+x[2]-1,+x[1],+x[4]||0,+x[5]||0,+x[6]||0);const d=Date.parse(s);return isNaN(d)?0:d}
const th=iso=>{const x=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');return x?x[3]+'/'+x[2]+'/'+(+x[1]+543):'—'};
/* ---------- อ่านไฟล์ Excel (รองรับหลาย Batch ต่อชีต) ---------- */
function parseBlocks(a,fn){const out=[];let B=null;const fin=()=>{if(B&&B.rows.length)out.push(mk(B,fn));B=null};
 for(const r of a){const c0=r[0];
  if(c0==='No.'){if(B&&B.H&&B.rows.length)fin();if(!B)B={P:{},H:null,rows:[]};B.H={};r.forEach((c,i)=>B.H[c]=i);continue}
  if(B&&B.H&&B.rows.length&&!(+c0>0)&&c0!==''&&r[1]!==undefined&&r[1]!=='')fin();
  if(!B)B={P:{},H:null,rows:[]};
  if(!B.H){if(c0&&r[1]!==undefined&&r[1]!=='')B.P[c0]=r[1];continue}
  if(+c0>0)B.rows.push(r)}
 fin();return out}
function mk(B,fn){const H=B.H,g=(r,n)=>r[H[n]]??'';
 const ms=B.rows.map(r=>({meter:String(g(r,'Meter Number')),err:+g(r,'err (%)'),vol:+g(r,'Volume (litre)'),test:+g(r,'Volume Test (litre)'),st:String(g(r,'Status')),R:[1,2].map(n=>{const q=k=>g(r,'Round '+n+' '+k);return{sz:parseInt(q('Meter Size'),16)||0,bat:String(q('Battery')),k:String(q('K1-K20')).split('|').map(x=>parseInt(x.trim(),10))}})})),P=B.P;
 return{id:String(P['Batch ID']||fn),file:fn,date:String(P['Date']||''),prod:String(P['Production Batch']||''),op:String(P['Leader Tester / Operator']||''),hw:String(P['Hardware Model']||''),tv:+P['Target Volume (litre)']||0,tf:+P['Target Flow Rate (L/h)']||0,pe:+P['Pass Error (±%)']||2,sz:ms[0].R[0].sz||0,ms}}
const slotOf=tf=>DB.rg.findIndex(r=>tf>=r[0]*.99&&tf<=r[1]*1.01);
function ingestWB(wb,fn,target){const rep={n:0,skip:[],warn:[]};for(const sn of wb.SheetNames){const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});let bl=[];try{bl=parseBlocks(a,fn)}catch(e){}
  for(const b of bl){let si=target!=null?target:slotOf(b.tf);if(si<0){rep.skip.push(b.id+' ('+b.tf+' L/h)');continue}
   if(target!=null&&slotOf(b.tf)!==target)rep.warn.push(b.id+' Flow '+b.tf+' ไม่อยู่ในช่วง '+DB.rg[target].join('–'));
   const L=DB.slots[si],i=L.findIndex(x=>x.id===b.id);if(i>=0)L[i]=b;else L.push(b);rep.n++}}return rep}
async function loadFiles(files,target){try{await needXLSX();const tot={n:0,skip:[],warn:[]};for(const file of files){const wb=XLSX.read(await file.arrayBuffer());const r=ingestWB(wb,file.name,target);tot.n+=r.n;tot.skip.push(...r.skip);tot.warn.push(...r.warn)}

function backfill(){const m=new Map(evalAll().map(x=>[x.id,x])),ids=[];DB.reg.forEach(r=>{const x=m.get(r.id);if(!x)return;let ch=0;r.F0=r.F0||[null,null,null,null];r.F=r.F||[null,null,null,null];x.Fall.forEach((q,i)=>{if(q&&!r.F0[i]){r.F0[i]=q;if(DB.use[i])r.F[i]=q;ch=1}});if(!r.K&&x.K){r.K=x.K;ch=1}if((r.batV===''||r.batV==null)&&x.batV!==''){r.batV=x.batV;ch=1}if(!r.lot&&x.lot){r.lot=x.lot;ch=1}if(!r.hw&&x.hw){r.hw=x.hw;ch=1}if(ch){r.maxErr=+Math.max(0,...r.F.filter(Boolean).map(q=>Math.abs(q.err))).toFixed(2);r.ts=Date.now();ids.push(r.rid)}});if(ids.length){save();queue(ids)}return ids.length}

 else return;render()});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.rf!==undefined){S[d.rf]=d.rf==='pendOnly'?+t.value:t.value;regRefresh()}else if(d.gq!==undefined){S['gs'+d.gq]=t.value}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(d.df){DB.def[d.df]=t.value.trim();save();render()}else if(d.cf){DB.cfg[d.cf]=d.cf==='auto'?+t.value:t.value.trim();save();syncUI();toast('บันทึกการตั้งค่าแล้ว');if(d.cf==='auto'&&+t.value)flush()}else if(d.rl){DB.rule[d.rl]=d.rl==='multi'?t.value:+t.value;save();autoSel();render()}else if(d.rg){const[i,j]=d.rg.split('.');DB.rg[+i][+j]=+t.value;save();render()}else if(d.rf!==undefined){S[d.rf]=d.rf==='pendOnly'?+t.value:t.value;regRefresh()}});
$('#fi').onchange=e=>{const fl=[...e.target.files];if(fl.length)loadFiles(fl,S.pend)};
$('#fj').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(j.reg){const rows=(j.reg||[]).map(r=>r);let ad=0;rows.forEach(r=>{if(!DB.reg.some(x=>x.rid===r.rid)){DB.reg.push(r);ad++}});if(j.slots&&!DB.slots.flat().length)DB.slots=j.slots;save();render();toast('นำเข้าจาก JSON: เพิ่ม '+ad+' รายการ')}else toast('ไฟล์ JSON ไม่ใช่ข้อมูลจากโปรแกรมนี้')}catch(x){toast('อ่าน JSON ไม่ได้')}};
const dr=$('#view');document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('#drop')){e.preventDefault();$('#drop').classList.add('on')}});document.addEventListener('dragleave',e=>{const d=$('#drop');if(d)d.classList.remove('on')});
document.addEventListener('drop',e=>{if(e.target.closest&&e.target.closest('#drop')){e.preventDefault();const fl=[...e.dataTransfer.files].filter(f=>/\.xlsx?$/i.test(f.name));if(fl.length)loadFiles(fl,null)}});
load();autoSel();render();if(DB.cfg.auto&&DB.cfg.url&&((DB.cfg.q||[]).length||(DB.cfg.dq||[]).length))flush();
</script></body></html>
