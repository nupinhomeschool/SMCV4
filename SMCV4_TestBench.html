<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMCV4 Test Bench · แท่นทดสอบมิเตอร์น้ำ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f1f6;--card:#fff;--card2:#f4f9fc;--ink:#0d2b3e;--mut:#5d7586;--line:#d3e2ec;--acc:#0b7ea4;--acc2:#14b8a6;--navy:#0a2a43;
 --ok:#047857;--okb:#d1fae5;--bad:#be123c;--badb:#ffe4e6;--warn:#b45309;--warnb:#fef3c7;--info:#1d4ed8;--infob:#dbeafe;--sh:0 10px 30px rgba(10,42,67,.10)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:linear-gradient(135deg,var(--h1,#0a2a43) 0%,var(--h2,#0b6d94) 58%,var(--h3,#14b8a6) 120%);color:#fff;padding:14px 22px 0;position:sticky;top:0;z-index:30;box-shadow:0 6px 22px rgba(10,42,67,.28)}
.top .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:46px;height:46px;flex:none}
.top h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:.2px;line-height:1.15}.top h1 small{display:block;font-size:.78rem;font-weight:400;opacity:.85;letter-spacing:.3px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 12px;font-size:.82rem;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);white-space:nowrap}
.sp{flex:1}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;color:rgba(255,255,255,.78);padding:10px 18px;font-weight:600;border-radius:12px 12px 0 0;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap;font-size:.95rem}
.tab i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;background:rgba(255,255,255,.2)}
.tab:hover{color:#fff;background:rgba(255,255,255,.1)}
.tab.on{background:var(--bg);color:var(--navy)}.tab.on i{background:var(--acc);color:#fff}
.tab .dot{width:8px;height:8px;border-radius:50%;background:#fbbf24;display:none}.tab.warn .dot{display:inline-block}
main{max-width:1380px;margin:0 auto;padding:20px 22px 60px}
.btn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--ink);display:inline-flex;gap:7px;align-items:center;transition:.15s;font-size:.92rem}
.btn:hover{border-color:var(--acc);box-shadow:0 3px 12px rgba(11,126,164,.18)}
.btn.p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0}.btn.p:hover{filter:brightness(1.07)}
.btn.g{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}.btn.g:hover{background:rgba(255,255,255,.25);box-shadow:none}
.btn.ok{background:var(--ok);color:#fff;border:0}.btn.bad{background:var(--bad);color:#fff;border:0}.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--sh);margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:1.12rem;display:flex;gap:9px;align-items:center}.card h2 em{font-style:normal;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:1rem}
.card .sub{color:var(--mut);font-size:.88rem;margin:0 0 12px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.g2,.g3,.g4{grid-template-columns:1fr}.top{padding:12px 12px 0}main{padding:14px 12px 50px}}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.fld label{font-size:.8rem;color:var(--mut);font-weight:600}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:var(--card2);outline:none;width:100%;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(11,126,164,.15);background:#fff}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fr3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hint{font-size:.8rem;color:var(--mut)}
.kpi{border-radius:16px;padding:14px 16px;background:linear-gradient(160deg,#fff,var(--card2));border:1px solid var(--line);position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--acc))}
.kpi small{display:block;color:var(--mut);font-size:.8rem;font-weight:600}.kpi b{display:block;font-size:1.9rem;line-height:1.15;font-weight:700;letter-spacing:-.5px}.kpi em{display:block;font-style:normal;color:var(--mut);font-size:.8rem}
.pill{display:inline-block;border-radius:99px;padding:2px 11px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.bad{background:var(--badb);color:var(--bad)}.pill.warn{background:var(--warnb);color:var(--warn)}.pill.info{background:var(--infob);color:var(--info)}.pill.mut{background:#e6eef3;color:#4b6578}
table{border-collapse:collapse;width:100%}th,td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--line);font-size:.9rem}
th{background:var(--card2);color:var(--mut);font-weight:700;font-size:.8rem;position:sticky;top:0}td.l,th.l{text-align:left}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}.tw table{min-width:560px}
.h0{background:rgba(5,150,105,.14)}.h1{background:rgba(250,204,21,.26)}.h2{background:rgba(245,158,11,.34)}.h3{background:rgba(225,29,72,.26);font-weight:700}.hn{background:#f1f5f9;color:#94a3b8}
/* จุดทดสอบ */
.steps{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.pt{flex:none;min-width:132px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;cursor:pointer;text-align:left;position:relative}
.pt b{display:block;font-size:1rem}.pt small{color:var(--mut);font-size:.76rem;display:block}
.pt.cur{border-color:var(--acc);box-shadow:0 0 0 4px rgba(11,126,164,.15)}.pt.done{background:#f0fdf8;border-color:#86e0c3}.pt.fail{background:#fff1f3;border-color:#f6a6b5}
.pt .st{position:absolute;right:8px;top:6px;font-size:.9rem}
.banner{border-radius:20px;color:#fff;padding:18px 22px;background:linear-gradient(135deg,#0a2a43,#0b7ea4 70%,#14b8a6);display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:center}
@media(max-width:860px){.banner{grid-template-columns:1fr}}
.banner h3{margin:0;font-size:2.2rem;line-height:1.1;letter-spacing:-.5px}.banner h3 small{font-size:1rem;font-weight:400;opacity:.85}
.banner .k{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.banner .k span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:4px 12px;font-size:.88rem}
.stage{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.stg{flex:1;min-width:104px;text-align:center;border-radius:14px;padding:10px 8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-weight:700;font-size:.9rem}
.stg.on{background:#fff;color:var(--navy);box-shadow:0 6px 18px rgba(0,0,0,.25)}.stg.ok{background:rgba(52,211,153,.28)}.stg small{display:block;font-weight:400;opacity:.85;font-size:.74rem}
.tmr{font-size:2.6rem;font-weight:700;text-align:right;letter-spacing:1px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px}
.mc{border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff;position:relative}
.mc.pass{border-color:#6ee7b7;background:linear-gradient(180deg,#f0fdf8,#fff)}.mc.fail{border-color:#fda4af;background:linear-gradient(180deg,#fff1f3,#fff)}.mc.empty{border-style:dashed;background:var(--card2)}
.mc .no{position:absolute;right:10px;top:8px;font-size:.78rem;color:var(--mut);font-weight:700}
.mc .id{font-weight:700;font-size:1.05rem}.mc .sz{color:var(--mut);font-size:.8rem}
.mc .er{font-size:2.15rem;font-weight:700;letter-spacing:-.5px;line-height:1.15}.mc .er.p{color:var(--ok)}.mc .er.f{color:var(--bad)}.mc .er.n{color:#a3b4c0}
.mc .ln{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mut);margin-top:2px}.mc .ln b{color:var(--ink)}
.fl{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.fl .pill{font-size:.7rem;padding:1px 8px}
.drop{border:2px dashed #9ec7d8;border-radius:16px;padding:14px;text-align:center;background:var(--card2);cursor:pointer}.drop.on{background:#e6f6fb;border-color:var(--acc)}
.log{max-height:150px;overflow:auto;font-size:.82rem}.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.ring{width:150px;height:150px}
.modal{position:fixed;inset:0;background:rgba(5,20,32,.6);z-index:80;display:none;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}
.modal .box{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:20px 22px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal h3{margin:0 0 10px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:var(--navy);color:#fff;padding:10px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.35)}#toast.on{opacity:1;transform:translateX(-50%)}
/* Monitor */
#mon{position:fixed;inset:0;z-index:90;background:radial-gradient(1200px 700px at 20% -10%,var(--mb1,#12456b),var(--mb2,#071a2a) 70%);color:var(--mfg,#eaf6fb);display:none;flex-direction:column;padding:2.2vh 2.4vw;overflow:hidden}#mon.on{display:flex}
#mon .mt{display:flex;align-items:center;gap:2vw;flex-wrap:wrap}#mon .mt h2{margin:0;font-size:2.6vh}#mon .mt .c{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:.5vh 1.3vw;font-size:2vh}
#mon .mc2{display:grid;grid-template-columns:1.25fr 1fr;gap:2vw;margin:2vh 0}
#mon .big{font-size:9.5vh;font-weight:700;line-height:1;letter-spacing:-1px}#mon .big small{font-size:3.3vh;font-weight:400;opacity:.8}
#mon .tim{font-size:11vh;font-weight:700;text-align:right;line-height:1}
#mon .mgrid{flex:1;display:grid;gap:1.2vh 1vw;align-content:start;overflow:hidden}
#mon .t{border-radius:1.6vh;padding:1.4vh 1vw;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);min-width:0}
#mon .t.pass{background:rgba(16,185,129,.22);border-color:#34d399}#mon .t.fail{background:rgba(244,63,94,.28);border-color:#fb7185}#mon .t.empty{opacity:.45;border-style:dashed}
#mon .t b{display:block;font-size:2.1vh;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#mon .t .e{font-size:6.4vh;font-weight:700;line-height:1.1}#mon .t .d{font-size:1.9vh;opacity:.8}
#mon .bar{height:2.2vh;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;display:flex}#mon .bar i{display:block;height:100%}
#mon .x{position:absolute;right:1.5vw;top:1.5vh}
.rtb{position:relative;background:linear-gradient(135deg,#0a2a43,#0b6d94);color:#fff;border-radius:16px;padding:12px 16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(10,42,67,.25)}
.rtb .rt1{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.rtb .rt1 b{font-size:1.15rem}.rtb .rt1 small{display:block;opacity:.8;font-size:.82rem}.rtb .rbt{display:flex;gap:8px;flex-wrap:wrap}
.rtb .rt2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:.85rem}.rtb .rt2>span{opacity:.8}
.rtg{border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;border-radius:99px;padding:5px 13px 5px 8px;font:600 .85rem Sarabun,sans-serif;cursor:pointer;display:inline-flex;gap:7px;align-items:center}.rtg i{font-style:normal;width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);display:grid;place-items:center;font-size:.72rem}
.rtg.on{background:#fff;color:#0a4f6e;border-color:#fff}.rtg.on i{background:#14b8a6;border-color:#14b8a6;color:#fff}
.sheetw{background:#cfdde7;padding:18px;border-radius:18px}.sheetw .paper{box-shadow:0 14px 40px rgba(10,42,67,.25);border:0}
.ptb{margin:8px 0 14px}.pth{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;background:#eef6fa;border:1px solid #cfe3ee;border-left:5px solid var(--acc);border-radius:10px;padding:7px 12px;font-size:.88rem}.pth>b{font-size:1.12rem;color:#0a4f6e}
.pth .ed{font-style:normal;background:#fef3c7;color:#92400e;border-radius:8px;padding:1px 8px;font-size:.78rem;font-weight:700}
.pth .vae{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:700;color:#0a4f6e}.pth .vae input{width:84px;border:1.5px solid #8fb6c9;border-radius:9px;padding:4px 8px;font:700 1rem 'JetBrains Mono',ui-monospace,monospace;text-align:right}
.paper table.dt th small{display:block;font-weight:400;font-size:.7rem;opacity:.75}.paper table.dt td{font-size:.86rem;white-space:nowrap}.paper table.dt tr.rp td:last-child,.paper table.dt tr.rf td:last-child{font-weight:700}
.paper table.dt td.ok{color:var(--ok)}.paper table.dt td.bad{color:var(--bad)}
@media print{.noprint{display:none!important}.sheetw{background:none;padding:0}.ptb{break-inside:avoid}.paper table.dt td{font-size:.78rem}}

.sl .lcd{font-size:1.7rem;padding:7px 40px 5px 10px;border-radius:12px}.sl .lcd .gh{right:40px;top:7px}.sl .lcd i{font-size:.8rem;right:9px;top:6px}.sl .lcd.rv{font-size:1.4rem;margin-top:5px}.sl .lcd.rv .gh{right:40px}
.sl .odo b{font-size:1.45rem}.sl .idr{font-size:1.02rem;margin-top:8px}.sl .idr b{font-size:1.2rem;letter-spacing:.5px}.sl .idr .szp2{font-size:.9rem;padding:2px 11px}.sl .bt{font-size:.95rem;font-weight:600}
.sl .er{font-size:2.7rem;margin-top:4px}.sl .sm{font-size:.84rem}
.sl .stt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.sl .stt>div{background:#f1f7fb;border:1px solid #d9e8f1;border-radius:12px;padding:6px 8px;text-align:center;min-width:0}
.sl.pass .stt>div{background:#e9faf2;border-color:#a7ebcb}.sl.fail .stt>div{background:#ffeef0;border-color:#fbc0c9}
.sl .stt small{display:block;font-size:.72rem;color:var(--mut);font-weight:600}.sl .stt b{display:block;font-size:1.45rem;line-height:1.15;font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--navy);letter-spacing:-.5px}.sl .stt em{display:block;font-style:normal;font-size:.68rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vact{margin-top:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:16px;padding:10px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.vact.chg{background:rgba(251,191,36,.22);border-color:#fbbf24}
.vact .vl b{display:block;font-size:1.02rem}.vact .vl small{opacity:.85;font-size:.8rem}
.vact .vst{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}.vact .vst button{border:0;border-radius:10px;background:rgba(255,255,255,.92);color:var(--navy);font:700 .95rem Sarabun,sans-serif;padding:8px 12px;min-width:48px;cursor:pointer}.vact .vst button.rs{background:#fbbf24}
.vact .vin{display:flex;align-items:center;background:#fff;border-radius:12px;padding:0 12px;gap:4px}.vact .vin input{width:96px;border:0;outline:0;background:none;font:700 1.7rem 'JetBrains Mono',ui-monospace,monospace;color:var(--navy);text-align:right;padding:5px 0}.vact .vin i{font-style:normal;font-weight:700;color:var(--mut)}
@media(max-width:680px){.vact .vst{margin-left:0;width:100%}.vact .vin{flex:1}.vact .vin input{width:100%}.sl .stt b{font-size:1.2rem}}

#pgpal{position:fixed;left:14px;bottom:14px;z-index:60}#mon.on~#pgpal{display:none}body.monitor #pgpal{display:none}
#pgpb{width:44px;height:44px;border-radius:50%;border:1px solid rgba(10,42,67,.25);background:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(10,42,67,.25);opacity:.8}#pgpb:hover{opacity:1}
#pgpp{display:none;position:absolute;left:0;bottom:54px;width:270px;background:#fff;color:#0d2b3e;border-radius:14px;padding:12px;box-shadow:0 10px 36px rgba(10,42,67,.35);border:1px solid #d3e2ec}#pgpal.o #pgpp{display:block}
#pgsw{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:8px 0}#pgsw i{height:34px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1px #c5d4de;cursor:pointer}#pgsw i.on{box-shadow:0 0 0 3px #0b7ea4}
#pgpp .mpr{display:flex;gap:10px}#pgpp .mpr label{flex:1;font-size:12px;display:flex;flex-direction:column;gap:3px}#pgpp input[type=color]{width:100%;height:34px;border:0;padding:0;background:none}
@media print{#pgpal,#monpal{display:none!important}}

#monpal{display:none;position:fixed;right:1.5vw;bottom:1.5vh;z-index:95;font-family:inherit}#mon.on~#monpal{display:block}
#monpb{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.45);color:#fff;font-size:22px;cursor:pointer;opacity:.55}#monpb:hover{opacity:1}
#monpp{display:none;position:absolute;right:0;bottom:56px;width:270px;background:#fff;color:#0d2b3e;border-radius:14px;padding:12px;box-shadow:0 10px 36px rgba(0,0,0,.5)}#monpal.o #monpp{display:block}#monpal.o #monpb{opacity:1}
#monsw{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:8px 0}#monsw i{height:34px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1px #c5d4de;cursor:pointer}#monsw i.on{box-shadow:0 0 0 3px #0b7ea4}
#monpp .mpr{display:flex;gap:10px}#monpp .mpr label{flex:1;font-size:12px;display:flex;flex-direction:column;gap:3px}#monpp input[type=color]{width:100%;height:34px;border:0;padding:0;background:none}#monpp small{display:block;margin-top:6px;color:#5d7586;font-size:11px}
#mon.lt{--mfg:#0d2b3e}#mon.lt .x,#mon.lt button{color:#0d2b3e}#mon.lt .x{background:rgba(255,255,255,.7);border-color:rgba(10,42,67,.3)}#mon.lt .pc.cur{background:#0a2a43;color:#fff}#mon.lt .c,#mon.lt .pc,#mon.lt .t,#mon.lt .md{background:rgba(255,255,255,.55);border-color:rgba(10,42,67,.25)}

#rep{display:none}
/* รายงาน */
.paper{background:#fff;color:#0d2b3e;max-width:1120px;margin:0 auto;padding:26px 30px;border:1px solid var(--line);border-radius:14px}
.paper .hd{display:flex;align-items:center;gap:16px;border-bottom:4px solid var(--acc);padding-bottom:12px;margin-bottom:12px}
.paper .hd h1{margin:0;font-size:1.5rem;color:#0a4f6e}.paper .hd small{color:var(--mut)}
.paper .kg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}

<script>
'use strict';
/* ============ SMCV4 Test Bench · core ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fx=(n,d=0)=>(n==null||!isFinite(n))?'–':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(n,d=2)=>(n==null||!isFinite(n))?'–':(n>0?'+':'')+Number(n).toFixed(d);
const p2=n=>String(n).padStart(2,'0');
const fdate=t=>{const d=new Date(t);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()};
const fdt=t=>{const d=new Date(t);return fdate(t)+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())};
const ldt=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())};
const dur=ms=>{ms=Math.max(0,Math.round(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return(h?h+':':'')+p2(m)+':'+p2(s)};
const med=a=>{a=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const mean=a=>{a=a.filter(x=>x!=null&&isFinite(x));return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const toast=(m,ms=2600)=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),ms)};

const LS='smcv4_bench_v1',TPLK='smcv4_bench_tpl_v1';
const SIZES=[15,20,25,32,40,50,65,80,100,125,150];
const Q3SER=[1000,1600,2500,4000,6300,10000,16000,25000,40000,63000,100000,160000,250000];
const Q3T={15:2500,20:4000,25:6300,32:10000,40:16000,50:25000,65:40000,80:63000,100:100000,125:160000,150:250000};   // Q3 อ้างอิง (L/h) ตามขนาด — แก้ได้ในหน้าตั้งค่า
const q3Of=(model,size)=>{const v=S.q3map&&S.q3map[model+size];return v>0?v:(Q3T[size]||null)};
const q3Std=()=>q3Of(S.batch.model,S.batch.size);
/* ชุด K1–K20 และอัตราไหลที่ใช้แต่ละดัชนี (L/h) แยกตามชนิด/ขนาด — ข้อมูลเดียวกับ Studio K ของ Web App */
const KREF={"SJ15":{"k":[6901,6714,6754,6754,6754,6754,6878,6878,6878,6878,6878,6878,6878,6878,6878,6878,6878,6878,6878,6878],"q":[15.625,23,35,50,100,120,150,250,350,450,550,800,1200,1500,1850,2400,2700,2900,3100,3400],"src":"BATCH-102851 · K1–K20 ผ่านการทดสอบจริง"},"MJ15":{"k":[7221,6882,6770,6549,6328,6221,6227,6045,5863,5802,5741,5711,5681,5664,5648,5648,5648,5648,5648,5648],"q":[30,55,80,100,120,140,160,480,800,1150,1500,1750,2000,2200,2400,2400,2400,2400,2400,2400],"src":"SMCV4 Dashboard · Multijet 15 mm K set"},"MJ20":{"k":[12266,11345,10931,10919,10493,10505,10572,10634,10697,10759,10822,10814,10807,10723,10618,10574,10574,10549,10549,10549],"q":[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,4357,5027,5764,6434,7239],"src":"ข้อมูลจริง · 8 ล็อต × 10 มาตร + RPM จากใบจด (16-10-2026)"}};
function kRef(model,size){const key=model+size,own=KREF[key],base=model==='SJ'?KREF.SJ15:KREF.MJ15,s=(q3Of(model,size)||2500)/2500;
  const est=base.q.map((x,i)=>!(own&&own.q[i]!=null)),q=base.q.map((x,i)=>est[i]?x*s:own.q[i]);
  return{key,q,est,k:own?own.k:null,src:own?own.src:'ประมาณจาก '+(model==='SJ'?'Single Jet':'Multijet')+' 15 mm ตามสัดส่วน Q3 — รอข้อมูลจริงของรุ่น/ขนาดนี้'}}
const idxByFlow=(f,R)=>{let b=0,bd=1e9;R.q.forEach((x,i)=>{if(!(x>0))return;const d=Math.abs(Math.log(f/x));if(d<bd-1e-12){bd=d;b=i}});return b};
const pad6=n=>n==null?'------':String(Math.max(0,Math.round(n))%1000000).padStart(6,'0');
let CFN=null;const askConfirm=(msg,fn)=>{CFN=fn;modal('<h3>⚠ ยืนยันการเปลี่ยนแปลง</h3><p style="line-height:1.6;white-space:pre-line">'+esc(msg)+'</p><div style="display:flex;gap:8px;margin-top:12px"><button class="btn bad" data-a="cfok">ดำเนินการต่อ</button><button class="btn" data-a="mclose">ยกเลิก</button></div>')};
const RCL=[50,63,80,100,125,160,200,250,315,400];
const RPM_MAP=[10,15,25,40,60,80,100,150,200,300,500,800,1000,1250,1500,1750,2000,2300,2500,Infinity];   // ช่วง RPM → ดัชนี K1..K20
const kIdx=rpm=>{const i=RPM_MAP.findIndex(m=>rpm<=m);return i<0?19:i};
const TPL_DEF=()=>{const o={};RCL.forEach(r=>o[r]=r<=80?'Q1,Q2,Q3':r<=100?'Q1,Q2,0.1,Q3':r<=160?'Q1,Q2,0.1,0.5,Q3':'Q1,Q2,0.1,0.5,Q3,Q4');return o};
const rs3=v=>{if(!(v>0))return v;const m=Math.pow(10,Math.floor(Math.log10(v))-2);return +(Math.round(v/m)*m).toPrecision(12)};
const qs=(q3,R)=>{const q1=q3/R;return{q1,q2:1.6*q1,q3,q4:1.25*q3}};
const defVol=f=>f<100?10:f<500?50:f<2000?100:200;
const newId=()=>'BATCH-'+String(Math.floor(Math.random()*900000)+100000);
const hash6=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return 'BATCH-'+String(Math.abs(h)%900000+100000)};

const defState=()=>({v:1,
  batch:{id:newId(),date:Date.now(),tester:'',checker:'',org:'FSL · Flo Sensor Lab',bench:'',hw:'',model:'MJ',size:25,R:160,q3:6300,q3Custom:false,limLow:5,limHigh:2,nm:10,passPct:100,
    tmpC:'',bar:'',ref:'',refDue:'',flowTol:5,carry:true,note:''},
  tpl:TPL_DEF(),q3map:{},plan:[],meters:[],rd:{},pt:{},cur:0,log:[]});
let S=defState(),TAB='setup',MON=false,IS_MON=/[?&]monitor=1/.test(location.search)||window.name==='smcv4mon';
function loadState(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j&&j.v)S=Object.assign(defState(),j,{batch:Object.assign(defState().batch,j.batch||{})})}catch(e){}
  try{const t=JSON.parse(localStorage.getItem(TPLK)||'null');if(t)S.tpl=Object.assign(TPL_DEF(),t)}catch(e){}
  while(S.meters.length<S.batch.nm)S.meters.push({id:'',size:null,k:null})}
let BC=null;try{BC=('BroadcastChannel' in window)?new BroadcastChannel('smcv4-bench'):null}catch(e){}
/* ---------- Relay: มือถือ (แอป SMCV4 Reader) → จอคอมพิวเตอร์ ผ่านบริการ ntfy (SSE) ---------- */
const RLK='smcv4_bench_relay';
const RL={code:'',role:'',beep:true,server:'https://ntfy.sh',st:'off',last:0,n:0,sent:0,err:'',es:null,seen:new Set()};
const rlBridge=()=>{try{return !!(window.NfcBridge||(window.parent&&window.parent.NfcBridge))}catch(e){return false}};
const rlGen=()=>{const c='abcdefghjkmnpqrstuvwxyz23456789';let s='';const a=new Uint8Array(8);(window.crypto||{getRandomValues:x=>x.forEach((_,i)=>x[i]=Math.random()*256)}).getRandomValues(a);a.forEach(x=>s+=c[x%c.length]);return s};
function rlSave(){try{localStorage.setItem(RLK,JSON.stringify({code:RL.code,role:RL.role,beep:RL.beep,server:RL.server,tp:RL.tp||'auto',gs:RL.gs||null}))}catch(e){}}
function rlLoad(){try{const j=JSON.parse(localStorage.getItem(RLK)||'null');if(j)Object.assign(RL,{code:j.code||'',role:j.role||'',beep:j.beep!==false,server:j.server||RL.server,tp:j.tp||'auto',gs:j.gs&&j.gs.url?j.gs:null})}catch(e){}
  try{const q=new URLSearchParams(location.search),pc=q.get('pair');if(pc){RL.code=pc.toLowerCase().replace(/[^a-z0-9]/g,'');RL.role=q.get('role')||(rlBridge()?'send':'recv')}}catch(e){}
  if(!RL.role)RL.role=rlBridge()?'off':'recv';
  if(RL.role==='recv'&&!RL.code)RL.code=rlGen();
  rlSave()}
const rlTopic=()=>RL.server.replace(/\/+$/,'')+'/smcv4-'+RL.code;
let AC=null;

function q3Info(){const b=S.batch,s=q3Std();if(!s)return'';const same=Math.abs(b.q3-s)<1e-9;

    return`<tr class="${on?'cur':''}"><td><b>${sz}</b></td><td><input class="in" type="number" data-q3m="SJ${sz}" value="${sj||''}" style="width:80px"></td><td><input class="in" type="number" data-q3m="MJ${sz}" value="${mj||''}" style="width:80px"></td><td>${flowT(rs3(q.q1))}</td><td>${flowT(rs3(q.q2))}</td><td>${flowT(rs3(q.q3))}</td><td>${flowT(rs3(q.q4))}</td></tr>`}).join('');

  <p class="hint">Q1 = Q3 ÷ R · Q2 = 1.6 × Q1 · Q4 = 1.25 × Q3 (L/h) · ค่า Q3 เริ่มต้นตามอนุกรมมาตรฐาน ISO 4064 (2.5 / 4 / 6.3 / 10 / 16 / 25 / 40 / 63 / 100 / 160 / 250 m³/h) — ถ้าข้อกำหนดผลิตภัณฑ์ของคุณต่างจากนี้ ให้แก้ในตาราง</p></details>`}

function chartSvg(o){o=o||{};const W=o.w||680,H=o.h||280,L=46,Rr=14,T=14,B=34,pl=S.plan,Q=qs(S.batch.q3,S.batch.R);
  const f0=Math.min(...pl.map(p=>p.f),Q.q1)*0.7,f1=Math.max(...pl.map(p=>p.f),Q.q4)*1.35,lg=Math.log10;
  const x=f=>L+(lg(f)-lg(f0))/(lg(f1)-lg(f0))*(W-L-Rr),Ll=S.batch.limLow,Lh=S.batch.limHigh;
  let ym=Math.max(8,Math.ceil(Ll+2));if(o.series)o.series.forEach(s=>s.pts.forEach(p=>{if(p&&isFinite(p.e))ym=Math.max(ym,Math.ceil(Math.abs(p.e)+1))}));
  const y=e=>T+(ym-e)/(2*ym)*(H-T-B),x2=x(Math.max(f0,Math.min(f1,Q.q2)));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="กราฟ % error เทียบอัตราการไหล" style="font-family:Sarabun,sans-serif">`;
  s+=`<rect x="${L}" y="${y(Ll)}" width="${x2-L}" height="${y(-Ll)-y(Ll)}" fill="#fde68a" opacity=".38"/><rect x="${x2}" y="${y(Lh)}" width="${W-Rr-x2}" height="${y(-Lh)-y(Lh)}" fill="#6ee7b7" opacity=".38"/>`;
  s+=`<path d="M${L} ${y(Ll)}H${x2}V${y(Lh)}H${W-Rr}M${L} ${y(-Ll)}H${x2}V${y(-Lh)}H${W-Rr}" fill="none" stroke="#be123c" stroke-width="1.4" stroke-dasharray="5 4"/>`;
  for(let e=-ym;e<=ym;e+=ym>8?4:2)s+=`<line x1="${L}" x2="${W-Rr}" y1="${y(e)}" y2="${y(e)}" stroke="${e===0?'#0b7ea4':'#d3e2ec'}" stroke-width="${e===0?1.6:1}"/><text x="${L-6}" y="${y(e)+4}" text-anchor="end" font-size="11" fill="#5d7586">${e>0?'+':''}${e}</text>`;
  pl.forEach((p,i)=>{s+=`<line x1="${x(p.f)}" x2="${x(p.f)}" y1="${T}" y2="${H-B}" stroke="#9ec7d8" stroke-dasharray="2 4"/><text x="${x(p.f)}" y="${H-B+15}" text-anchor="middle" font-size="11" font-weight="700" fill="#0d2b3e">${flowT(p.f)}</text><text x="${x(p.f)}" y="${H-B+28}" text-anchor="middle" font-size="10" fill="#5d7586">${esc(p.l)}</text>`});
  s+=`<text x="${L+4}" y="${y(Ll)-5}" font-size="11" fill="#b45309" font-weight="700">±${Ll}%</text><text x="${W-Rr-4}" y="${y(Lh)-5}" text-anchor="end" font-size="11" fill="#047857" font-weight="700">±${Lh}%</text>`;
  (o.series||[]).forEach(se=>{const ok=se.pass,c=ok?'#0b7ea4':'#e11d48',pts=se.pts.map((p,i)=>p&&isFinite(p.e)?[x(pl[i].f),y(p.e),p]:null).filter(Boolean);
    if(pts.length>1)s+=`<path d="M${pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L')}" fill="none" stroke="${c}" stroke-width="${ok?1.6:2.4}" opacity="${ok?.55:.95}"/>`;
    pts.forEach(q=>{s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${q[2].ok?3.4:5}" fill="${q[2].ok?'#fff':'#e11d48'}" stroke="${c}" stroke-width="2"><title>${esc(se.id)} @ ${flowT(q[2].f)} L/h = ${sg(q[2].e)}%</title></circle>`})});
  return s+'</svg>'}

function batSeries(id){const pts=[];Object.keys(S.rd).forEach(pi=>{const rd=(S.rd[pi]||{})[id];if(!rd)return;[rd.s,rd.e].forEach(r=>{if(r&&r.bat!=null&&!r.carried)pts.push({t:r.ts||0,v:r.bat,pi:+pi})})});
  const seen=new Set();return pts.filter(p=>{const k=p.t+'|'+p.v;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.t-b.t)}
function batStat(id){const s=batSeries(id);if(!s.length)return null;const f=s[0],l=s[s.length-1],mn=Math.min(...s.map(x=>x.v)),dv=l.v-f.v,hrs=(l.t-f.t)/3600e3,rate=hrs>0.05?dv/hrs*1000:null;

function batTable(A){const rows=A.mids.map(id=>{const b=batStat(id);if(!b)return`<tr><td class="l mono">${esc(id)}</td><td colspan="7" class="hint">ไม่มีค่าแบตเตอรี่</td></tr>`;

    return{k,real:true,lib:true,cand:c,v,best:c===L[0],src:'ผลทดสอบจริง · '+c.n+(c.d?' ('+c.d+')':'')+' · '+(v==='n'?'K แนะนำใหม่':'K ที่ใช้ทดสอบ'),q:v==='n'?c.p1/c.N:c.p0/c.N,qk:v==='n'?'คาดการณ์':'ผ่านจริง'}}

  return D.map(d=>{const th=`<tr><th class="l">มิเตอร์</th><th>ปริมาตรเริ่มต้น<small>m³</small></th><th>ปริมาตรสิ้นสุด<small>m³</small></th><th>น้ำที่ใช้<small>L</small></th><th>อ้างอิง<small>L</small></th>${mech?'':'<th>รอบเริ่มต้น</th><th>รอบสิ้นสุด</th><th>Δ รอบ</th><th>K ที่มิเตอร์ใช้<small>µL/รอบ</small></th><th>K ที่ต้องใช้<small>µL/รอบ</small></th>'}<th>% error</th><th>ผล</th></tr>`;
    const body=d.rows.map(({m,r,c})=>{const ok=c&&c.valid;return`<tr class="${ok?(c.pass?'rp':'rf'):''}"><td class="l mono"><b>${esc(m.id)}</b>${m.size?'<small> · '+m.size+' mm</small>':''}</td><td class="mono">${volStr(r.s.vol)}</td><td class="mono">${volStr(r.e.vol)}</td><td class="mono"><b>${c?fx(c.dVol,2):'–'}</b></td><td class="mono">${c?fx(c.vref,2):fx(d.vref,2)}</td>${mech?'':`<td class="mono">${r.s.rev==null?'–':pad6(r.s.rev)}</td><td class="mono">${r.e.rev==null?'–':pad6(r.e.rev)}</td><td class="mono"><b>${c&&c.dRev!=null?fx(c.dRev):'–'}</b></td><td class="mono">${c&&c.kObs!=null?fx(c.kObs,c.kObs<1000?1:0):'–'}</td><td class="mono"><b>${c&&c.kNeed!=null?fx(c.kNeed,c.kNeed<1000?1:0):'–'}</b></td>`}<td class="mono ${ok?(c.pass?'ok':'bad'):''}"><b>${ok?sg(c.err)+'%':'–'}</b></td><td>${ok?(c.pass?'<span class="pill ok">PASS</span>':'<span class="pill bad">FAIL</span>'):'–'}</td></tr>`}).join('');
    const ed=edit?`<span class="vae noprint">✎ ปริมาตรจริง <input class="vaP" data-i="${d.i}" inputmode="decimal" value="${String(d.vref)}"> L${d.edited?` <button class="btn sm" data-a="vapreset" data-v="${d.i}">↺ กลับเป็น ${d.p.v} L</button>`:''}</span>`:'';
    return`<div class="ptb"><div class="pth"><b>${esc(d.p.l)}</b><span>${flowT(d.p.f)} L/h</span><span>อ้างอิง <b>${fx(d.vref,2)} L</b>${d.edited?' <em class="ed">แก้จากแผน '+d.p.v+' L</em>':''}</span>${d.fa?`<span>อัตราไหลจริง ${fx(d.fa,d.fa<100?1:0)} L/h</span>`:''}${d.st.t0?`<span>เวลา ${hhmm(d.st.t0)}${d.st.t1?'–'+hhmm(d.st.t1):''}</span>`:''}<span>เกณฑ์ ±${d.p.lim}%</span><span class="pill ${d.n&&d.pass===d.n?'ok':'bad'}">ผ่าน ${d.pass}/${d.n}</span>${ed}</div><div class="tw"><table class="dt"><thead>${th}</thead><tbody>${body}</tbody></table></div></div>`}).join('')}
function detAoa(){const a=[['จุดทดสอบ','อัตราไหล (L/h)','ปริมาตรอ้างอิง (L)','แก้จากแผน (L)','เกณฑ์ ±%','Meter ID','ขนาด (mm)','ปริมาตรเริ่มต้น (m³)','ปริมาตรสิ้นสุด (m³)','น้ำที่ใช้ (L)','รอบเริ่มต้น','รอบสิ้นสุด','Δ รอบ','K ที่มิเตอร์ใช้ (µL/รอบ)','K ที่ต้องใช้ (µL/รอบ)','% error','ผล','แบตเริ่มต้น (V)','แบตสิ้นสุด (V)','เวลาเริ่ม','เวลาสิ้นสุด']];
  detRows().forEach(d=>d.rows.forEach(({m,r,c})=>{const ok=c&&c.valid;a.push([d.p.l,d.p.f,c?+c.vref.toFixed(3):d.vref,d.edited?d.p.v:'',d.p.lim,m.id,m.size||'',r.s.vol==null?'':r.s.vol/1e5,r.e.vol==null?'':r.e.vol/1e5,c?+c.dVol.toFixed(3):'',r.s.rev==null?'':r.s.rev,r.e.rev==null?'':r.e.rev,c&&c.dRev!=null?c.dRev:'',c&&c.kObs!=null?+c.kObs.toFixed(2):'',c&&c.kNeed!=null?+c.kNeed.toFixed(2):'',ok?+c.err.toFixed(3):'',ok?(c.pass?'PASS':'FAIL'):'',r.s.bat==null?'':r.s.bat,r.e.bat==null?'':r.e.bat,d.st.t0?fdt(d.st.t0):'',d.st.t1?fdt(d.st.t1):''])}));return a}

   <div class="kg"><div class="kpi"><small>มิเตอร์ผ่านครบ</small><b>${A.full}/${A.nm}</b><em>${fx(A.pct,1)}%</em></div><div class="kpi" style="--c:var(--ok)"><small>จุดทดสอบที่ผ่าน</small><b>${A.cellsPass}/${A.cellsAll}</b><em>${A.cellsAll?fx(A.cellsPass/A.cellsAll*100,1):0}%</em></div><div class="kpi" style="--c:#f59e0b"><small>error เฉลี่ย</small><b>${sg(A.mean)}%</b><em>ค่ากลางทั้ง Batch</em></div><div class="kpi" style="--c:var(--bad)"><small>error สูงสุด</small><b>${sg(A.worst)}%</b><em>ห่างศูนย์มากสุด</em></div></div>

   ${MECH()||!RO().k?'':`<h3>ค่า K รายจุดทดสอบ</h3>${kPtsTable(A)}<h3>ค่าคงที่ K1–K20 ที่แนะนำ (µL/รอบ)</h3>${A.kRec.some(r=>r.prop!=null)?kGrid(A):'<p class="hint">ไม่มีข้อมูลจำนวนรอบ</p>'}`}
   ${MECH()?'':`${RO().bat?`<h3>แบตเตอรี่ระหว่างทดสอบ</h3>${batTable(A)}`:''}${RO().cfg?`<h3>ค่าตั้งของมิเตอร์ (จาก NFC)</h3>${cfgTable(A)}`:''}`}
   ${RO().qc?`<h3>ตรวจสอบคุณภาพข้อมูล</h3>${qcList(A)}`:''}
   ${b.note?`<h3>หมายเหตุ</h3><p>${esc(b.note)}</p>`:''}
   <div class="sg"><div>ผู้ทดสอบ<br><b>${esc(b.tester||'')}</b></div><div>ผู้ตรวจสอบ<br><b>${esc(b.checker||'')}</b></div><div>ผู้อนุมัติ</div></div></div>`}
function qcList(A){const out=[];A.mids.forEach(id=>A.M[id].cells.forEach((c,i)=>{if(c&&c.flags.length)out.push(`<tr><td class="l mono">${esc(id)}</td><td>${esc(S.plan[i].l)} · ${flowT(S.plan[i].f)} L/h</td><td class="l">${c.flags.map(esc).join(' · ')}</td></tr>`)}));
  const bad=A.P.filter((p,i)=>{const fa=p.fa;return fa&&Math.abs(fa-S.plan[i].f)/S.plan[i].f*100>S.batch.flowTol}).map(p=>`<tr><td class="l">—</td><td>${esc(S.plan[p.i].l)}</td><td class="l">อัตราไหลจริง ${fx(p.fa,1)} L/h เบี่ยงจากที่ตั้ง ${flowT(S.plan[p.i].f)} เกิน ±${S.batch.flowTol}%</td></tr>`);
  const rows=[...out,...bad];return rows.length?`<div class="tw"><table><thead><tr><th class="l">มิเตอร์</th><th>จุด</th><th class="l">ข้อสังเกต</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<p class="pill ok">✔ ไม่พบข้อสังเกตด้านคุณภาพข้อมูล</p>'}
function vRep(A){const o=RO(),tg=(k,t)=>`<button class="rtg ${o[k]?'on':''}" data-a="rotg" data-v="${k}"><i>${o[k]?'✓':''}</i>${t}</button>`,nD=detRows().reduce((n,d)=>n+d.rows.length,0);

function monHtml(A){
  const np=S.plan.filter(q=>!q.off).length,pi=Math.min(S.cur,Math.max(0,S.plan.length-1)),p=S.plan[pi],st=np?pointState(pi):{step:'start'},b=S.batch,v=VD[A.verdict],N=Math.max(1,b.nm,S.meters.length),cols=N>12?4:N>6?2:2,rows=Math.ceil(N/cols);
  const stT={start:'① อ่านค่าเริ่มต้น',run:'② กำลังปล่อยน้ำ',end:'③ อ่านค่าสิ้นสุด',done:'✔ จุดนี้เสร็จแล้ว'}[st.step];
  const fa=np?flowAct(pi):null,rdOf=m=>(S.rd[pi]||{})[m.id]||{};

  else if(a==='mrnew'){MR.step=1;MR.src=null;MR.cells=[];mrRender()}
  else if(a==='mrback'){MR.step=2;mrRender()}
  else if(a==='mrlcd'){MR.n=6;MR.red=5;MR.ptrOn=false;MR.act='drum';MR.pbox=null;MR.cells=[];mrSaveCfg();mrFit();mrZoom(true);toast('โหมด LCD: 6 หลัก (1 หลักจำนวนเต็ม + 5 ทศนิยม) — ลากกรอบครอบเฉพาะตัวเลขบนจอ แล้วกด “อ่านตัวเลข” และตรวจทีละหลัก',5200);mrRender()}
  else if(a==='mrn'){MR.n=Math.max(4,Math.min(9,MR.n+v));if(MR.red>MR.n-1)MR.red=MR.n-1;mrSaveCfg();mrRender()}
  else if(a==='mrr'){MR.red=Math.max(0,Math.min(Math.min(5,MR.n-1),MR.red+v));mrSaveCfg();mrRender()}
  else if(a==='mrauto'){const b=mrAuto();if(b){MR.box=b;const s=MR.src;b.x=Math.max(0,b.x);b.y=Math.max(0,b.y);b.w=Math.min(s.width-b.x,b.w);b.h=Math.min(s.height-b.y,b.h);toast('พบช่องตัวเลขแล้ว — ตรวจเส้นแบ่งหลัก และลากมุมปรับได้');mrZoom(true);mrRender()}else toast('หาช่องอัตโนมัติไม่เจอ — ลากมุมกรอบครอบช่องตัวเลขเอง',3200);mrDraw()}
  else if(a==='mract'){MR.act=v?'ptr':'drum';MR.tapZero=false;if(v&&!MR.pbox)mrPtrAuto();mrZoom(true);mrRender()}
  else if(a==='mrptron'){MR.ptrOn=t.checked;if(!MR.ptrOn)MR.act='drum';else if(!MR.pbox)mrPtrAuto();mrSaveCfg();mrRender()}
  else if(a==='mrpauto'){if(mrPtrAuto()){toast('พบเข็มละเอียดแล้ว — ตรวจเส้นเลข 0');mrZoom(true)}else toast('หาเข็มอัตโนมัติไม่เจอ — ลากกรอบครอบหน้าปัดเล็กเอง',3200);mrRender()}
  else if(a==='mrtapz'){MR.tapZero=!MR.tapZero;if(MR.tapZero)toast('แตะที่เลข “0” บนหน้าปัดเล็กในรูป');mrRender()}
  else if(a==='mrzok'){MR.zeroOk=t.checked;mrUpdVal()}
  else if(a==='mrp'){const b=MR.pval==null?0:MR.pval;MR.pval=Math.round(((b+v/10)%10+10)%10*10)/10;mrUpdVal();mrPtrThumb()}
  else if(a==='mrzoom'){mrZoom(!MR.view);mrDraw();mrRender()}
  else if(a==='mrread'){mrSaveCfg();mrRead()}
  else if(a==='mrok'){const val=mrReading();if(!val){toast('ใส่ตัวเลขให้ครบทุกหลักก่อน');return}
    const id=(document.getElementById('mrId')||{}).value||'',sl=document.getElementById('mrSlot'),slot=sl&&sl.value!==''?+sl.value:null;
    if(rlBridge()&&!rlAuto()){mrClose();TAB='run';render();rlNeedPair();return}
    const ok=mechIn({id:id.trim(),reading:val,slot,by:'photo'},rlBridge()?'app':'web');if(ok!==false){mrClose();TAB='run';render();scrollTo(0,0)}}});
document.addEventListener('change',e=>{const f=e.target;if(f&&f.dataset&&f.dataset.a==='mrmult'){MR.pmult=+f.value;mrSaveCfg();mrRender();return}
  if(f&&f.hasAttribute&&f.hasAttribute('data-mrf')&&f.files&&f.files[0]){MR.fname=f.files[0].name;mrLoad(URL.createObjectURL(f.files[0]));f.value=''}});
document.addEventListener('input',e=>{const f=e.target;if(!f||!f.dataset||f.dataset.mrd==null)return;const i=+f.dataset.mrd,v=String(f.value).replace(/\D/g,'').slice(-1);f.value=v;if(MR.cells[i]){MR.cells[i].d=v;MR.cells[i].conf=v?1:0}mrUpdVal();
  if(v){const nx=document.querySelector('[data-mrd="'+(i+1)+'"]');if(nx){nx.focus();nx.select()}}});
document.addEventListener('keydown',e=>{if(!MR.open)return;if(e.key==='Escape')mrClose();if(e.key==='Enter'&&MR.step===3){const b=document.getElementById('mrOk');if(b&&!b.disabled)b.click()}});
/* ลากกรอบ: มุม = ปรับขนาด · ข้างใน = ย้าย · นอกกรอบ = วาดใหม่ */
(function(){const pt=(cv,e)=>{const V=mrView(),r=cv.getBoundingClientRect(),sc=V.w/r.width;return{x:V.x+(e.clientX-r.left)*sc,y:V.y+(e.clientY-r.top)*sc,sc}};
  document.addEventListener('pointerdown',e=>{const cv=e.target;if(!cv||cv.id!=='mrCv'||!MR.src)return;e.preventDefault();const p=pt(cv,e);if(MR.act==='ptr'&&MR.tapZero&&MR.pdet){const bs=MR.pdet.base;MR.pzero=((Math.atan2(p.x-bs.x,-(p.y-bs.y))*180/Math.PI)%360+360)%360;MR.zeroSet=true;MR.tapZero=false;mrRender();return}
    const ptrM=MR.act==='ptr',b=ptrM?(MR.pbox||(MR.pbox={x:p.x,y:p.y,w:1,h:1})):MR.box,hit=22*p.sc;let mode='new',cor=null;
    [[b.x,b.y],[b.x+b.w,b.y],[b.x,b.y+b.h],[b.x+b.w,b.y+b.h]].forEach((c,i)=>{if(Math.abs(p.x-c[0])<hit&&Math.abs(p.y-c[1])<hit)cor=i});
    if(cor!=null)mode='rs';else if(p.x>b.x&&p.x<b.x+b.w&&p.y>b.y&&p.y<b.y+b.h)mode='mv';
    MR.drag={mode,cor,sx:p.x,sy:p.y,b0:Object.assign({},b),ptr:ptrM};if(mode==='new'){const nb={x:p.x,y:p.y,w:1,h:1};if(ptrM)MR.pbox=nb;else MR.box=nb}try{cv.setPointerCapture(e.pointerId)}catch(x){}});
  document.addEventListener('pointermove',e=>{const d=MR.drag,cv=document.getElementById('mrCv');if(!d||!cv)return;const p=pt(cv,e),S0=MR.src,b0=d.b0;let b;
    if(d.mode==='mv'){b={x:b0.x+p.x-d.sx,y:b0.y+p.y-d.sy,w:b0.w,h:b0.h};b.x=Math.max(0,Math.min(S0.width-b.w,b.x));b.y=Math.max(0,Math.min(S0.height-b.h,b.y))}
    else if(d.mode==='rs'){const fx_=d.cor%2?b0.x:b0.x+b0.w,fy=d.cor<2?b0.y+b0.h:b0.y;let x=Math.max(0,Math.min(S0.width,p.x)),y=Math.max(0,Math.min(S0.height,p.y));b={x:Math.min(x,fx_),y:Math.min(y,fy),w:Math.abs(x-fx_),h:Math.abs(y-fy)}}
    else{let x=Math.max(0,Math.min(S0.width,p.x)),y=Math.max(0,Math.min(S0.height,p.y));b={x:Math.min(x,d.sx),y:Math.min(y,d.sy),w:Math.abs(x-d.sx),h:Math.abs(y-d.sy)}}
    if(b.w>4&&b.h>4){if(d.ptr)MR.pbox=b;else MR.box=b}mrDraw()});
  const up=()=>{if(MR.drag){const pp=MR.drag.ptr;MR.drag=null;if(pp){if(MR.pbox&&(MR.pbox.w<30||MR.pbox.h<30))mrPtrAuto()}else if(MR.box&&(MR.box.w<30||MR.box.h<20))mrFit();mrDraw()}};document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  addEventListener('resize',()=>{if(MR.open&&MR.step===2)mrDraw()})})();

/* ===== ลงทะเบียนมิเตอร์ใหม่ → ทะเบียนคุณภาพ (Google Sheet) ทันทีหลังเขียนสำเร็จ ===== */
function qrRegister(e){const h=qrHost();if(!h||!S.pv||S.pv.autoReg===false)return null;
  const d=new Date(),date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),hhmm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  try{const r=h.smcvTrkAdd([{id:e.id,lot:'L'+String(e.id).slice(0,6),date,model:e.model==='SJ'?'Single Jet':'Multijet',size:e.size,rclass:'R160',tester:S.batch.tester||'',hw:'SMCV.4',K:e.k&&e.k.length===20?e.k:null,
      kset:e.ksrc||(e.real===false?'Dummy (ยังไม่ได้ทดสอบ)':''),cfg:(e.dir?'Backward':'Forward')+' · log '+(e.logMin>=60&&e.logMin%60===0?(e.logMin/60)+' ชม.':e.logMin+' นาที'),regAt:date+' '+hhmm,regBy:S.batch.tester||'',F:[null,null,null,null],register:true}],QR.stage);
    return r}catch(x){return null}}
function pvRegCard(p){const h=qrHost();
  return`<div class="card" style="margin-top:14px"><h2><em>☁</em>ลงทะเบียนเข้าทะเบียนคุณภาพ (Google Sheet)</h2><p class="sub">เมื่อเขียนมิเตอร์สำเร็จ ระบบบันทึก <b>ID · Lot · รุ่น · ขนาด · ชุด K · Config · วันเวลา · ผู้ทำรายการ</b> เข้าทะเบียนให้ทันที (สถานะ “ลงทะเบียน · รอทดสอบ”) — ตอนทดสอบเสร็จผลจะมาต่อที่ ID เดิม ไม่ซ้ำ</p>
   <div class="qrg"><label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" data-pv="autoReg" ${p.autoReg!==false?'checked':''}> ลงทะเบียนเข้าทะเบียนอัตโนมัติ</label>
   <div class="seg" style="max-width:420px">${[['trial','🧪 รุ่นทดลอง'],['test','✅ ทดสอบจริง'],['prod','🏭 ผลิตจริง']].map(x=>`<button class="${QR.stage===x[0]?'on':''}" data-a="qrstage" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
   <span class="hint">${h?'เชื่อมต่อทะเบียนแล้ว':'⚠ เปิดผ่านหน้าแดชบอร์ด (index.html) จึงจะเชื่อมทะเบียนได้'}</span></div></div>`}

/* ---------- ปรับสีพื้นหลังจอ Monitor ---------- */
(function(){const K='smcv4.monbg',P=[['#12456b','#071a2a'],['#0f3d2e','#04140e'],['#3b1d63','#12081f'],['#5a1d2e','#1c070d'],['#1f2937','#030712'],['#0e7490','#083344'],['#7c2d12','#1c0a04'],['#000000','#000000'],['#e2edf5','#bcd0de'],['#fef3c7','#fcd9a0']];
 const lum=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255};
 function apply(a,b,save){const m=document.getElementById('mon');if(!m)return;m.style.setProperty('--mb1',a);m.style.setProperty('--mb2',b);m.classList.toggle('lt',(lum(a)+lum(b))/2>.62);
  const c1=document.getElementById('monc1'),c2=document.getElementById('monc2');if(c1)c1.value=a;if(c2)c2.value=b;
  document.querySelectorAll('#monsw i').forEach(i=>i.classList.toggle('on',i.dataset.a===a&&i.dataset.b===b));
  if(save)try{localStorage.setItem(K,JSON.stringify([a,b]))}catch(e){}}
 function init(){const sw=document.getElementById('monsw');if(!sw)return;sw.innerHTML=P.map(p=>`<i data-a="${p[0]}" data-b="${p[1]}" style="background:linear-gradient(${p[0]},${p[1]})"></i>`).join('');
  let v=null;try{v=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}if(!v||v.length<2)v=P[0];apply(v[0],v[1],false);
  document.getElementById('monpb').onclick=()=>document.getElementById('monpal').classList.toggle('o');
  sw.onclick=e=>{const i=e.target.closest('i');if(i)apply(i.dataset.a,i.dataset.b,true)};
  const f=()=>apply(document.getElementById('monc1').value,document.getElementById('monc2').value,true);
  document.getElementById('monc1').oninput=f;document.getElementById('monc2').oninput=f}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();

/* ---------- ปรับสีหน้า Test Bench (แยกจากสีจอ Monitor) ---------- */
(function(){const K='smcv4.pgbg',P=[['#0a2a43','#0b6d94','#14b8a6','#e8f1f6'],['#052e1c','#0f766e','#4ade80','#e6f4ee'],['#2e1065','#6d28d9','#a78bfa','#f0ebfa'],['#4c0519','#be123c','#fb7185','#fbeaee'],['#1f2937','#475569','#94a3b8','#eef0f3'],['#082f49','#0369a1','#38bdf8','#e6f1fb'],['#431407','#c2410c','#fb923c','#fbefe6'],['#111827','#111827','#374151','#e5e7eb'],['#0b6d94','#14b8a6','#a7f3d0','#f4fbf9'],['#78350f','#d97706','#fcd34d','#fdf6e3']];
 const mix=(h,t,k)=>{const n=parseInt(h.slice(1),16),r=[n>>16,(n>>8)&255,n&255].map(c=>Math.round(c+(t-c)*k));return'#'+r.map(c=>c.toString(16).padStart(2,'0')).join('')};
 function apply(c,save){const r=document.documentElement.style;r.setProperty('--h1',c[0]);r.setProperty('--h2',c[1]);r.setProperty('--h3',c[2]);r.setProperty('--bg',c[3]);
  const a=document.getElementById('pgc1'),b=document.getElementById('pgc2');if(a)a.value=c[1];if(b)b.value=c[3];
  document.querySelectorAll('#pgsw i').forEach(i=>i.classList.toggle('on',i.dataset.c===c.join()));
  if(save)try{localStorage.setItem(K,JSON.stringify(c))}catch(e){}}
 function init(){const sw=document.getElementById('pgsw');if(!sw)return;sw.innerHTML=P.map(p=>`<i data-c="${p.join()}" style="background:linear-gradient(135deg,${p[0]},${p[1]} 55%,${p[2]});outline:4px solid ${p[3]};outline-offset:-4px"></i>`).join('');
  let v=null;try{v=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}if(!v||v.length<4)v=P[0];apply(v,false);
  document.getElementById('pgpb').onclick=()=>document.getElementById('pgpal').classList.toggle('o');
  sw.onclick=e=>{const i=e.target.closest('i');if(i)apply(i.dataset.c.split(','),true)};
  const f=()=>{const h=document.getElementById('pgc1').value;apply([mix(h,0,.55),h,mix(h,255,.45),document.getElementById('pgc2').value],true)};
  document.getElementById('pgc1').oninput=f;document.getElementById('pgc2').oninput=f;
  document.getElementById('pgrst').onclick=()=>{try{localStorage.removeItem(K)}catch(e){}apply(P[0],false)}}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();
</script>
