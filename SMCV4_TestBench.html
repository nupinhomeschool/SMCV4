<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMCV4 Test Bench · แท่นทดสอบมิเตอร์น้ำ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f1f6;--card:#fff;--card2:#f4f9fc;--ink:#0d2b3e;--mut:#5d7586;--line:#d3e2ec;--acc:#0b7ea4;--acc2:#14b8a6;--navy:#0a2a43;
 --ok:#047857;--okb:#d1fae5;--bad:#be123c;--badb:#ffe4e6;--warn:#b45309;--warnb:#fef3c7;--info:#1d4ed8;--infob:#dbeafe;--sh:0 10px 30px rgba(10,42,67,.10)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:linear-gradient(135deg,#0a2a43 0%,#0b6d94 58%,#14b8a6 120%);color:#fff;padding:14px 22px 0;position:sticky;top:0;z-index:30;box-shadow:0 6px 22px rgba(10,42,67,.28)}
.top .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:46px;height:46px;flex:none}
.top h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:.2px;line-height:1.15}.top h1 small{display:block;font-size:.78rem;font-weight:400;opacity:.85;letter-spacing:.3px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 12px;font-size:.82rem;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);white-space:nowrap}
.sp{flex:1}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;color:rgba(255,255,255,.78);padding:10px 18px;font-weight:600;border-radius:12px 12px 0 0;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap;font-size:.95rem}
.tab i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;background:rgba(255,255,255,.2)}
.tab:hover{color:#fff;background:rgba(255,255,255,.1)}
.tab.on{background:var(--bg);color:var(--navy)}.tab.on i{background:var(--acc);color:#fff}
.tab .dot{width:8px;height:8px;border-radius:50%;background:#fbbf24;display:none}.tab.warn .dot{display:inline-block}
main{max-width:1380px;margin:0 auto;padding:20px 22px 60px}
.btn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--ink);display:inline-flex;gap:7px;align-items:center;transition:.15s;font-size:.92rem}
.btn:hover{border-color:var(--acc);box-shadow:0 3px 12px rgba(11,126,164,.18)}
.btn.p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0}.btn.p:hover{filter:brightness(1.07)}
.btn.g{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}.btn.g:hover{background:rgba(255,255,255,.25);box-shadow:none}
.btn.ok{background:var(--ok);color:#fff;border:0}.btn.bad{background:var(--bad);color:#fff;border:0}.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--sh);margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:1.12rem;display:flex;gap:9px;align-items:center}.card h2 em{font-style:normal;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:1rem}
.card .sub{color:var(--mut);font-size:.88rem;margin:0 0 12px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.g2,.g3,.g4{grid-template-columns:1fr}.top{padding:12px 12px 0}main{padding:14px 12px 50px}}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.fld label{font-size:.8rem;color:var(--mut);font-weight:600}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:var(--card2);outline:none;width:100%;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(11,126,164,.15);background:#fff}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fr3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hint{font-size:.8rem;color:var(--mut)}
.kpi{border-radius:16px;padding:14px 16px;background:linear-gradient(160deg,#fff,var(--card2));border:1px solid var(--line);position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--acc))}
.kpi small{display:block;color:var(--mut);font-size:.8rem;font-weight:600}.kpi b{display:block;font-size:1.9rem;line-height:1.15;font-weight:700;letter-spacing:-.5px}.kpi em{display:block;font-style:normal;color:var(--mut);font-size:.8rem}
.pill{display:inline-block;border-radius:99px;padding:2px 11px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.bad{background:var(--badb);color:var(--bad)}.pill.warn{background:var(--warnb);color:var(--warn)}.pill.info{background:var(--infob);color:var(--info)}.pill.mut{background:#e6eef3;color:#4b6578}
table{border-collapse:collapse;width:100%}th,td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--line);font-size:.9rem}
th{background:var(--card2);color:var(--mut);font-weight:700;font-size:.8rem;position:sticky;top:0}td.l,th.l{text-align:left}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}.tw table{min-width:560px}
.h0{background:rgba(5,150,105,.14)}.h1{background:rgba(250,204,21,.26)}.h2{background:rgba(245,158,11,.34)}.h3{background:rgba(225,29,72,.26);font-weight:700}.hn{background:#f1f5f9;color:#94a3b8}
/* จุดทดสอบ */
.steps{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.pt{flex:none;min-width:132px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;cursor:pointer;text-align:left;position:relative}
.pt b{display:block;font-size:1rem}.pt small{color:var(--mut);font-size:.76rem;display:block}
.pt.cur{border-color:var(--acc);box-shadow:0 0 0 4px rgba(11,126,164,.15)}.pt.done{background:#f0fdf8;border-color:#86e0c3}.pt.fail{background:#fff1f3;border-color:#f6a6b5}
.pt .st{position:absolute;right:8px;top:6px;font-size:.9rem}
.banner{border-radius:20px;color:#fff;padding:18px 22px;background:linear-gradient(135deg,#0a2a43,#0b7ea4 70%,#14b8a6);display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:center}
@media(max-width:860px){.banner{grid-template-columns:1fr}}
.banner h3{margin:0;font-size:2.2rem;line-height:1.1;letter-spacing:-.5px}.banner h3 small{font-size:1rem;font-weight:400;opacity:.85}
.banner .k{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.banner .k span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:4px 12px;font-size:.88rem}
.stage{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.stg{flex:1;min-width:104px;text-align:center;border-radius:14px;padding:10px 8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-weight:700;font-size:.9rem}
.stg.on{background:#fff;color:var(--navy);box-shadow:0 6px 18px rgba(0,0,0,.25)}.stg.ok{background:rgba(52,211,153,.28)}.stg small{display:block;font-weight:400;opacity:.85;font-size:.74rem}
.tmr{font-size:2.6rem;font-weight:700;text-align:right;letter-spacing:1px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px}
.mc{border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff;position:relative}
.mc.pass{border-color:#6ee7b7;background:linear-gradient(180deg,#f0fdf8,#fff)}.mc.fail{border-color:#fda4af;background:linear-gradient(180deg,#fff1f3,#fff)}.mc.empty{border-style:dashed;background:var(--card2)}
.mc .no{position:absolute;right:10px;top:8px;font-size:.78rem;color:var(--mut);font-weight:700}
.mc .id{font-weight:700;font-size:1.05rem}.mc .sz{color:var(--mut);font-size:.8rem}
.mc .er{font-size:2.15rem;font-weight:700;letter-spacing:-.5px;line-height:1.15}.mc .er.p{color:var(--ok)}.mc .er.f{color:var(--bad)}.mc .er.n{color:#a3b4c0}
.mc .ln{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mut);margin-top:2px}.mc .ln b{color:var(--ink)}
.fl{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.fl .pill{font-size:.7rem;padding:1px 8px}
.drop{border:2px dashed #9ec7d8;border-radius:16px;padding:14px;text-align:center;background:var(--card2);cursor:pointer}.drop.on{background:#e6f6fb;border-color:var(--acc)}
.log{max-height:150px;overflow:auto;font-size:.82rem}.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.ring{width:150px;height:150px}
.modal{position:fixed;inset:0;background:rgba(5,20,32,.6);z-index:80;display:none;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}
.modal .box{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:20px 22px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal h3{margin:0 0 10px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:var(--navy);color:#fff;padding:10px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.35)}#toast.on{opacity:1;transform:translateX(-50%)}
/* Monitor */
#mon{position:fixed;inset:0;z-index:90;background:radial-gradient(1200px 700px at 20% -10%,#12456b,#071a2a 70%);color:#eaf6fb;display:none;flex-direction:column;padding:2.2vh 2.4vw;overflow:hidden}#mon.on{display:flex}
#mon .mt{display:flex;align-items:center;gap:2vw;flex-wrap:wrap}#mon .mt h2{margin:0;font-size:2.6vh}#mon .mt .c{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:.5vh 1.3vw;font-size:2vh}
#mon .mc2{display:grid;grid-template-columns:1.25fr 1fr;gap:2vw;margin:2vh 0}
#mon .big{font-size:9.5vh;font-weight:700;line-height:1;letter-spacing:-1px}#mon .big small{font-size:3.3vh;font-weight:400;opacity:.8}
#mon .tim{font-size:11vh;font-weight:700;text-align:right;line-height:1}
#mon .mgrid{flex:1;display:grid;gap:1.2vh 1vw;align-content:start;overflow:hidden}
#mon .t{border-radius:1.6vh;padding:1.4vh 1vw;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);min-width:0}
#mon .t.pass{background:rgba(16,185,129,.22);border-color:#34d399}#mon .t.fail{background:rgba(244,63,94,.28);border-color:#fb7185}#mon .t.empty{opacity:.45;border-style:dashed}
#mon .t b{display:block;font-size:2.1vh;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#mon .t .e{font-size:6.4vh;font-weight:700;line-height:1.1}#mon .t .d{font-size:1.9vh;opacity:.8}
#mon .bar{height:2.2vh;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;display:flex}#mon .bar i{display:block;height:100%}
#mon .x{position:absolute;right:1.5vw;top:1.5vh}
#rep{display:none}
/* รายงาน */
.paper{background:#fff;color:#0d2b3e;max-width:1120px;margin:0 auto;padding:26px 30px;border:1px solid var(--line);border-radius:14px}
.paper .hd{display:flex;align-items:center;gap:16px;border-bottom:4px solid var(--acc);padding-bottom:12px;margin-bottom:12px}
.paper .hd h1{margin:0;font-size:1.5rem;color:#0a4f6e}.paper .hd small{color:var(--mut)}
.paper .kg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.paper .ig{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.paper .ig div{padding:6px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:.86rem}.paper .ig small{display:block;color:var(--mut);font-size:.72rem}.paper .ig b{font-size:.95rem}
.paper h3{margin:16px 0 6px;color:#0a4f6e;font-size:1.02rem;border-left:5px solid var(--acc);padding-left:9px}
.paper .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:34px;text-align:center}.paper .sg div{border-top:1.5px solid #6b8394;padding-top:6px;font-size:.88rem}
.paper table th{position:static}
.verdict{display:inline-block;border-radius:14px;padding:6px 22px;font-size:1.5rem;font-weight:700}
.verdict.ok{background:var(--okb);color:var(--ok)}.verdict.bad{background:var(--badb);color:var(--bad)}.verdict.mut{background:#e6eef3;color:#4b6578}
.kk{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.kk div{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--card2);text-align:center}.kk small{color:var(--mut);display:block;font-size:.72rem}.kk b{font-size:1rem}.kk em{font-style:normal;font-size:.74rem;color:var(--mut)}.kk .an{border-color:var(--acc);background:#e6f6fb}
@media(max-width:700px){.kk{grid-template-columns:repeat(3,1fr)}.paper .kg,.paper .ig{grid-template-columns:repeat(2,1fr)}}
@media print{@page{size:A4 landscape;margin:10mm}body{background:#fff}.top,main,#mon,.modal,#toast{display:none!important}#rep{display:block!important}.paper{border:0;padding:0;max-width:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.paper h3{break-after:avoid}.paper table,.paper .kk{break-inside:avoid}}

.lcd{position:relative;text-align:right;background:linear-gradient(180deg,#bcc6aa,#a9b595);border:3px solid #4b5a63;border-radius:10px;padding:5px 30px 3px 8px;font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:1.12rem;line-height:1.35;color:#0e1a12;overflow:hidden;min-height:2.1em;white-space:nowrap}
.lcd .gh{position:absolute;right:30px;top:5px;color:rgba(40,60,40,.14)}.lcd .vv{position:relative}
.lcd i{position:absolute;right:7px;top:3px;font:700 .62rem Sarabun,sans-serif;font-style:normal;color:#243024}
.work{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:18px;margin:18px 0;align-items:start}
@media(max-width:1000px){.work{grid-template-columns:1fr}}
.side{display:grid;gap:14px;position:sticky;top:10px}@media(max-width:1000px){.side{position:static}}
.bh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}.bh small{font-weight:400;color:var(--mut);font-size:.8rem}
.legend{font-size:.78rem;color:var(--mut);display:flex;align-items:center;gap:4px;flex-wrap:wrap}.lg{display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid;margin-left:6px}
.lg.need{border-color:#fbbf24;background:#fffbeb}.lg.got{border-color:#93c5fd;background:#eff6ff}.lg.pass{border-color:#6ee7b7;background:#f0fdf8}.lg.fail{border-color:#fda4af;background:#fff1f3}
.bcols{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:.78rem;color:var(--mut);font-weight:700;margin:4px 2px}
.bench{display:grid;grid-auto-flow:column;gap:12px 14px}@media(max-width:560px){.bench{grid-auto-flow:row!important;grid-template-rows:none!important;grid-template-columns:1fr!important}.bcols{display:none}}
.sl{border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:#fff;cursor:pointer}
.sl.pass{border-color:#6ee7b7;background:linear-gradient(180deg,#f0fdf8,#fff)}.sl.fail{border-color:#fda4af;background:linear-gradient(180deg,#fff1f3,#fff)}
.sl.empty{border-style:dashed;background:var(--card2)}.sl.sel{border-color:var(--acc);box-shadow:0 0 0 4px rgba(11,126,164,.18)}
.sl.need{border-color:#fbbf24;background:#fffbeb}.sl.got{border-color:#93c5fd;background:#f5f9ff}
.sl .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:6px}
.sl .no{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.sl .idr{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:.88rem}.szp2{background:var(--navy);color:#fff;border-radius:10px;padding:1px 9px;font-size:.78rem;font-weight:700}
.sl .er{font-size:1.9rem;font-weight:700;letter-spacing:-.5px;line-height:1.15}.sl .er.p{color:var(--ok)}.sl .er.f{color:var(--bad)}.sl .er.n{color:#a3b4c0}
.sl .sm{font-size:.78rem;color:var(--mut);margin-top:4px}
.pb{height:8px;border-radius:6px;background:#e3edf3;overflow:hidden;margin-top:2px}.pb i{display:block;height:100%;background:linear-gradient(90deg,#14b8a6,#34d399)}
.sl.just{animation:jp 1.4s ease-out}@keyframes jp{0%{box-shadow:0 0 0 0 rgba(20,184,166,.75)}100%{box-shadow:0 0 0 16px rgba(20,184,166,0)}}
.todo{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:10px 14px;margin-top:12px;font-size:1.02rem;line-height:1.55}.todo small{opacity:.9}
.dial{position:relative;width:min(100%,290px);aspect-ratio:1;margin:0 auto}.dial svg{position:absolute;inset:0;width:100%;height:100%}
.dial .dc{position:absolute;inset:16% 14%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}
.dial .dt{font-size:1.25rem;letter-spacing:3px;color:#0a2a43}.dial .mut{color:var(--mut);font-size:.6rem;letter-spacing:1.5px}
.dial .lcd{font-size:.95rem;width:100%;padding-right:24px}.dial .lcd .gh{right:24px}.dial .lcd i{font-size:.55rem;right:5px}
.dial .did{border:1.5px solid #b9cbd8;border-radius:12px;padding:3px 12px;background:#fff;width:100%}.dial .did small{display:block;font-size:.55rem;letter-spacing:1.5px;color:var(--mut)}.dial .did b{font-size:1.1rem;letter-spacing:1.5px}
.szp{background:#0a2a43;color:#fff;border-radius:12px;padding:2px 12px;font-size:.7rem}.szp b{font-size:.85rem}
.gd{margin:8px 0 0;padding:0;list-style:none;counter-increment:g;display:grid;gap:8px}.gd li{display:grid;grid-template-columns:34px 1fr;gap:2px 10px;align-items:start;counter-increment:g}
.gd li::before{content:counter(g);grid-row:span 2;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#0a2a43,#0b7ea4);color:#fff;display:grid;place-items:center;font-weight:700}
.gd li b{font-size:1rem}.gd li span{color:#35566b;font-size:.92rem;line-height:1.5}.card.guide{margin-bottom:16px;border-left:6px solid var(--acc2)}
.side .kpi b{font-size:1.35rem}.side .kpi{padding:8px 8px}

#mon .mmain{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);gap:2vw;margin-top:1.6vh}
#mon .mleft{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;min-height:0}
#mon .dialw{display:flex;justify-content:center}#mon .dial{width:290px;margin:0}
#mon .mst{text-align:center}#mon .ml{font-size:2.8vh}#mon .ml b{font-size:3.6vh}#mon .mbig{font-size:11vh;font-weight:700;line-height:1}#mon .mbig.ok,#mon .mv.ok{color:#6ee7b7}#mon .mbig.bad,#mon .mv.bad{color:#fb7185}#mon .mv{font-size:2.4vh;opacity:.92}
#mon .mright{display:flex;flex-direction:column;min-height:0;gap:1.2vh}
#mon .mhd{display:flex;justify-content:space-between;align-items:flex-end;gap:2vw}#mon .big{font-size:7vh}#mon .tim{font-size:7vh}

<script>
'use strict';
/* ============ SMCV4 Test Bench · core ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fx=(n,d=0)=>(n==null||!isFinite(n))?'–':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(n,d=2)=>(n==null||!isFinite(n))?'–':(n>0?'+':'')+Number(n).toFixed(d);
const p2=n=>String(n).padStart(2,'0');
const fdate=t=>{const d=new Date(t);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()};
const fdt=t=>{const d=new Date(t);return fdate(t)+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())};
const ldt=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())};
const dur=ms=>{ms=Math.max(0,Math.round(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return(h?h+':':'')+p2(m)+':'+p2(s)};
const med=a=>{a=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const mean=a=>{a=a.filter(x=>x!=null&&isFinite(x));return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const toast=(m,ms=2600)=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),ms)};

const LS='smcv4_bench_v1',TPLK='smcv4_bench_tpl_v1';
const SIZES=[15,20,25,32,40,50,65,80,100,125,150];
const Q3SER=[1000,1600,2500,4000,6300,10000,16000,25000,40000,63000,100000,160000,250000];
const Q3T={15:2500,20:4000,25:6300,32:10000,40:16000,50:25000,65:40000,80:63000,100:100000,125:160000,150:250000};   // Q3 อ้างอิง (L/h) ตามขนาด — แก้ได้ในหน้าตั้งค่า
const q3Of=(model,size)=>{const v=S.q3map&&S.q3map[model+size];return v>0?v:(Q3T[size]||null)};
const q3Std=()=>q3Of(S.batch.model,S.batch.size);
/* ชุด K1–K20 และอัตราไหลที่ใช้แต่ละดัชนี (L/h) แยกตามชนิด/ขนาด — ข้อมูลเดียวกับ Studio K ของ Web App */
const KREF={"SJ15":{"k":[6901,6714,6754,6754,6754,6754,6878,6878,6878,6878,6878,6878,6878,6878,6878,6878,6878,6878,6878,6878],"q":[15.625,23,35,50,100,120,150,250,350,450,550,800,1200,1500,1850,2400,2700,2900,3100,3400],"src":"BATCH-102851 · K1–K20 ผ่านการทดสอบจริง"},"MJ15":{"k":[7221,6882,6770,6549,6328,6221,6227,6045,5863,5802,5741,5711,5681,5664,5648,5648,5648,5648,5648,5648],"q":[30,55,80,100,120,140,160,480,800,1150,1500,1750,2000,2200,2400,2400,2400,2400,2400,2400],"src":"SMCV4 Dashboard · Multijet 15 mm K set"},"MJ20":{"k":[12266,11345,10931,10919,10493,10505,10572,10634,10697,10759,10822,10814,10807,10723,10618,10574,10574,10549,10549,10549],"q":[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,4357,5027,5764,6434,7239],"src":"ข้อมูลจริง · 8 ล็อต × 10 มาตร + RPM จากใบจด (16-10-2026)"}};
function kRef(model,size){const key=model+size,own=KREF[key],base=model==='SJ'?KREF.SJ15:KREF.MJ15,s=(q3Of(model,size)||2500)/2500;
  const est=base.q.map((x,i)=>!(own&&own.q[i]!=null)),q=base.q.map((x,i)=>est[i]?x*s:own.q[i]);
  return{key,q,est,k:own?own.k:null,src:own?own.src:'ประมาณจาก '+(model==='SJ'?'Single Jet':'Multijet')+' 15 mm ตามสัดส่วน Q3 — รอข้อมูลจริงของรุ่น/ขนาดนี้'}}
const idxByFlow=(f,R)=>{let b=0,bd=1e9;R.q.forEach((x,i)=>{if(!(x>0))return;const d=Math.abs(Math.log(f/x));if(d<bd-1e-12){bd=d;b=i}});return b};
const pad6=n=>n==null?'------':String(Math.max(0,Math.round(n))%1000000).padStart(6,'0');
let CFN=null;const askConfirm=(msg,fn)=>{CFN=fn;modal('<h3>⚠ ยืนยันการเปลี่ยนแปลง</h3><p style="line-height:1.6;white-space:pre-line">'+esc(msg)+'</p><div style="display:flex;gap:8px;margin-top:12px"><button class="btn bad" data-a="cfok">ดำเนินการต่อ</button><button class="btn" data-a="mclose">ยกเลิก</button></div>')};
const RCL=[50,63,80,100,125,160,200,250,315,400];
const RPM_MAP=[10,15,25,40,60,80,100,150,200,300,500,800,1000,1250,1500,1750,2000,2300,2500,Infinity];   // ช่วง RPM → ดัชนี K1..K20
const kIdx=rpm=>{const i=RPM_MAP.findIndex(m=>rpm<=m);return i<0?19:i};
const TPL_DEF=()=>{const o={};RCL.forEach(r=>o[r]=r<=80?'Q1,Q2,Q3':r<=100?'Q1,Q2,0.1,Q3':r<=160?'Q1,Q2,0.1,0.5,Q3':'Q1,Q2,0.1,0.5,Q3,Q4');return o};
const rs3=v=>{if(!(v>0))return v;const m=Math.pow(10,Math.floor(Math.log10(v))-2);return +(Math.round(v/m)*m).toPrecision(12)};
const qs=(q3,R)=>{const q1=q3/R;return{q1,q2:1.6*q1,q3,q4:1.25*q3}};
const defVol=f=>f<100?10:f<500?50:f<2000?100:200;
const newId=()=>'BATCH-'+String(Math.floor(Math.random()*900000)+100000);
const hash6=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return 'BATCH-'+String(Math.abs(h)%900000+100000)};

const defState=()=>({v:1,
  batch:{id:newId(),date:Date.now(),tester:'',checker:'',org:'FSL · Flo Sensor Lab',bench:'',hw:'',model:'MJ',size:25,R:160,q3:6300,q3Custom:false,limLow:5,limHigh:2,nm:10,passPct:100,
    tmpC:'',bar:'',ref:'',refDue:'',flowTol:5,carry:true,note:''},
  tpl:TPL_DEF(),q3map:{},plan:[],meters:[],rd:{},pt:{},cur:0,log:[]});
let S=defState(),TAB='setup',MON=false,IS_MON=/[?&]monitor=1/.test(location.search)||window.name==='smcv4mon';
function loadState(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j&&j.v)S=Object.assign(defState(),j,{batch:Object.assign(defState().batch,j.batch||{})})}catch(e){}
  try{const t=JSON.parse(localStorage.getItem(TPLK)||'null');if(t)S.tpl=Object.assign(TPL_DEF(),t)}catch(e){}
  while(S.meters.length<S.batch.nm)S.meters.push({id:'',size:null,k:null})}
let BC=null;try{BC=('BroadcastChannel' in window)?new BroadcastChannel('smcv4-bench'):null}catch(e){}
/* ---------- Relay: มือถือ (แอป SMCV4 Reader) → จอคอมพิวเตอร์ ผ่านบริการ ntfy (SSE) ---------- */
const RLK='smcv4_bench_relay';
const RL={code:'',role:'',beep:true,server:'https://ntfy.sh',st:'off',last:0,n:0,sent:0,err:'',es:null,seen:new Set()};
const rlBridge=()=>{try{return !!(window.NfcBridge||(window.parent&&window.parent.NfcBridge))}catch(e){return false}};
const rlGen=()=>{const c='abcdefghjkmnpqrstuvwxyz23456789';let s='';const a=new Uint8Array(8);(window.crypto||{getRandomValues:x=>x.forEach((_,i)=>x[i]=Math.random()*256)}).getRandomValues(a);a.forEach(x=>s+=c[x%c.length]);return s};
function rlSave(){try{localStorage.setItem(RLK,JSON.stringify({code:RL.code,role:RL.role,beep:RL.beep,server:RL.server}))}catch(e){}}
function rlLoad(){try{const j=JSON.parse(localStorage.getItem(RLK)||'null');if(j)Object.assign(RL,{code:j.code||'',role:j.role||'',beep:j.beep!==false,server:j.server||RL.server})}catch(e){}
  try{const q=new URLSearchParams(location.search),pc=q.get('pair');if(pc){RL.code=pc.toLowerCase().replace(/[^a-z0-9]/g,'');RL.role=q.get('role')||(rlBridge()?'send':'recv')}}catch(e){}
  if(!RL.role)RL.role=rlBridge()?'off':'recv';
  if(RL.role==='recv'&&!RL.code)RL.code=rlGen();
  rlSave()}
const rlTopic=()=>RL.server.replace(/\/+$/,'')+'/smcv4-'+RL.code;
let AC=null;
function beep(kind){if(!RL.beep)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const seq=kind==='bad'?[[330,.0,.18],[220,.2,.3]]:kind==='warn'?[[520,0,.2],[520,.25,.2]]:[[880,0,.1],[1320,.12,.14]];
  seq.forEach(([f,t,d])=>{const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+t;o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.25,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.start(t0);o.stop(t0+d+.02)})}catch(e){}}
const SENT=[];
function rlPost(m){return fetch(rlTopic(),{method:'POST',body:JSON.stringify(m)}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);RL.err='';return true})}
function rlSend(r){
  if(!r||(!r.id&&!r.mech)||r.bad||r.vol==null){toast('อ่านไม่สมบูรณ์ — แตะมิเตอร์ใหม่',3200);beep('bad');return false}
  const m={v:1,t:'read',seq:Date.now().toString(36)+Math.random().toString(36).slice(2,6),id:r.id,size:r.size,k:r.k||null,rev:r.rev,vol:r.vol,rvol:r.rvol,flow:r.flow,time:r.time,date:r.date,ev:r.ev,res:r.res,bat:r.bat,dir:r.dir,uart:r.uart,calc:r.calc,issues:r.issues||[],meta:r.meta||null,mech:r.mech?1:0,ts:Date.now()};
  const e={r,t:Date.now(),ok:null};SENT.unshift(e);SENT.length=Math.min(SENT.length,30);RL.sent++;beep('ok');
  rlPost(m).then(()=>{e.ok=true;render()},er=>{e.ok=false;RL.err=er.message||'ส่งไม่สำเร็จ';render()});
  render();return true}
function rlRecv(m){
  if(!m||m.v!==1)return;
  if(m.t==='ping'){RL.last=Date.now();toast('✔ ได้รับสัญญาณทดสอบจากมือถือ — การเชื่อมต่อใช้งานได้',3200);beep('ok');rlChip();return}
  if(m.t!=='read'||(!m.id&&!m.mech)||m.seq&&RL.seen.has(m.seq))return;if(m.seq){RL.seen.add(m.seq);if(RL.seen.size>200)RL.seen.delete(RL.seen.values().next().value)}
  RL.last=Date.now();RL.n++;
  applyRead(Object.assign({},m,{k8:m.k?m.k.map(k8):null,ts:Date.now(),issues:m.issues||[]}),'phone')}
function rlConnect(){
  try{RL.es&&RL.es.close()}catch(e){}RL.es=null;RL.st='off';
  if(IS_MON||RL.role!=='recv'||!RL.code||typeof EventSource==='undefined'){rlChip();return}
  try{const es=new EventSource(rlTopic()+'/sse');RL.es=es;RL.st='conn';
    es.onopen=()=>{RL.st='on';rlChip()};es.onerror=()=>{RL.st='retry';rlChip()};
    es.onmessage=e=>{try{const j=JSON.parse(e.data);if(j.event&&j.event!=='message')return;rlRecv(JSON.parse(j.message))}catch(x){}}}
  catch(e){RL.st='err'}
  rlChip()}
function rlText(){if(IS_MON)return '🖥 จอแสดงผลแยก'+(RL.code?' · '+RL.code.toUpperCase():'');const ago=RL.last?Math.max(0,Math.round((Date.now()-RL.last)/1000)):null;
  if(RL.role==='off'||!RL.code)return RL.role==='off'?'📡 ใช้เครื่องเดียว':'📡 ยังไม่จับคู่';
  if(RL.role==='send')return '📱 ส่งขึ้นจอ · รหัส '+RL.code.toUpperCase()+' · ส่งแล้ว '+RL.sent;
  return (RL.st==='on'?'🟢':RL.st==='conn'?'🟡':'🔴')+' รับจากมือถือ · '+RL.code.toUpperCase()+(RL.st==='on'?' · เชื่อมต่อแล้ว':RL.st==='conn'?' · กำลังเชื่อมต่อ…':' · ขาดการเชื่อมต่อ')+(ago!=null?' · ล่าสุด '+(ago<60?ago+' วิ':Math.floor(ago/60)+' นาที')+'ที่แล้ว':'')}
function rlChip(){const t=rlText();['#rlchip','#mrl'].forEach(s=>{const el=$(s);if(el)el.textContent=t})}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));localStorage.setItem(TPLK,JSON.stringify(S.tpl))}catch(e){}try{BC&&!IS_MON&&BC.postMessage({t:'state',S,LAST})}catch(e){}}

/* ---------- แผนทดสอบ ---------- */
function mkPoint(f,l,Q){f=rs3(f);return{l,f,v:defVol(f),lim:f<Q.q2*0.995?S.batch.limLow:S.batch.limHigh}}
function buildPlan(){const b=S.batch,Q=qs(b.q3,b.R),tok=String(S.tpl[b.R]||TPL_DEF()[b.R]).split(',').map(x=>x.trim()).filter(Boolean);

  A.push(['Batch Parameters','']);A.push(['Hardware Model',b.hw||(b.model==='MJ'?'Multijet ':'Single Jet ')+b.size+' mm']);A.push(['Production Batch',fdate(b.date).replace(/\//g,'-')]);
  A.push(['Leader Tester / Operator',b.tester||'-']);A.push(['Target Volume (litre)',String(p.v)]);A.push(['Target Flow Rate (L/h)',String(p.f)]);A.push(['Pass Error (±%)',String(p.lim)]);
  A.push(['Batch ID',hash6(b.id+'#'+pi)]);A.push(['Date',fdt((S.pt[pi]||{}).t0||b.date)]);
  A.push(['No.','Meter Number','Initial Reading','Final Reading','Volume (litre)','Volume Test (litre)','err (%)','Status',...[1,2].flatMap(n=>RCOLS.map(c=>'Round '+n+' '+c))]);
  let n=0;S.meters.filter(m=>m.id).forEach(m=>{const c=calc(pi,m.id),r=(S.rd[pi]||{})[m.id];if(!c||!c.valid)return;n++;
    A.push([String(n),m.id,volStr(r.s.vol),volStr(r.e.vol),+c.dVol.toFixed(2),String(c.vref),+c.err.toFixed(2),c.pass?'PASS':'FAIL',...rcells(r.s),...rcells(r.e)])});
  return A}
function importBatchAoa(a,fn){
  let hi=-1;const P={};for(let i=0;i<a.length;i++){const r=a[i];if(r[0]==='No.'){hi=i;break}if(r[0]&&r[1]!==undefined&&r[1]!=='')P[r[0]]=r[1]}
  if(hi<0)throw new Error('ไม่พบหัวตาราง "No." ในไฟล์ '+fn);const H={};a[hi].forEach((c,i)=>H[c]=i);const g=(r,k)=>r[H[k]]==null?'':r[H[k]];
  const f=+P['Target Flow Rate (L/h)'],v=+P['Target Volume (litre)']||10,lim=+P['Pass Error (±%)']||2,ms=[];
  for(let i=hi+1;i<a.length;i++){const r=a[i];if(!(+r[0]>0))continue;const ev=g(r,'err (%)');if(ev===''||!isFinite(+ev))continue;
    const rd=n=>{const q=k=>g(r,'Round '+n+' '+k),vs=String(q('Water Volume')).replace('.','');if(!vs)return null;
      const k8l=String(q('K1-K20')).split('|').map(x=>x.trim()).filter(Boolean);
      return{id:String(q('Meter ID')),size:parseInt(q('Meter Size'),16)||null,rev:q('Round (RND)')===''?null:+q('Round (RND)'),vol:parseInt(vs,10),rvol:parseInt(String(q('Reverse Volume'))||'0',10)||0,flow:parseInt(q('Flow Rate'),10)||0,
        time:String(q('Timestamp')),date:String(q('Date')),ev:String(q('Event Code')),res:String(q('Reserve')),bat:parseFloat(q('Battery'))||null,raw:String(q('Raw Blocks')),
        dir:/\(01\)/.test(q('Direction Raw'))?1:0,uart:/\(01\)/.test(q('Log UART Raw'))?1:0,calc:/\(01\)/.test(q('Calc FW/BR Raw'))?1:0,k8:k8l,k:k8l.map(x=>parseInt(x,10)),ts:Date.now()}};
    ms.push({id:String(g(r,'Meter Number')),s:rd(1),e:rd(2)})}
  if(!ms.length)throw new Error('ไม่พบข้อมูลมิเตอร์ในไฟล์ '+fn);
  return{f,v,lim,ms,tester:String(P['Leader Tester / Operator']||''),date:String(P['Date']||''),hw:String(P['Hardware Model']||''),id:String(P['Batch ID']||fn)}}
function addImported(im,reset){
  if(reset){const b=S.batch;S=defState();S.batch=Object.assign(S.batch,{tester:im.tester,hw:im.hw});S.batch.id=newId();S.plan=[];S.rd={};S.pt={};S.meters=[]}
  let pi=S.plan.findIndex(p=>Math.abs(p.f-im.f)<1e-6);
  if(pi<0){S.plan.push({l:'F'+im.f,f:im.f,v:im.v,lim:im.lim});pi=S.plan.length-1;
    // เรียงตามอัตราไหล โดยรักษาข้อมูลเดิม
    const order=S.plan.map((p,i)=>i).sort((a,b)=>S.plan[a].f-S.plan[b].f),rdN={},ptN={};order.forEach((o,n)=>{rdN[n]=S.rd[o]||{};ptN[n]=S.pt[o]});S.plan=order.map(o=>S.plan[o]);S.rd=rdN;S.pt=ptN;pi=S.plan.findIndex(p=>p.f===im.f)}
  const lbl=(()=>{const Q=qs(S.batch.q3,S.batch.R);const p=S.plan[pi];return Math.abs(p.f-rs3(Q.q1))<0.6?'Q1':Math.abs(p.f-rs3(Q.q2))<0.6?'Q2':Math.abs(p.f-Q.q3)<0.6?'Q3':Math.abs(p.f-Q.q4)<0.6?'Q4':'F'+p.f})();S.plan[pi].l=lbl;S.plan[pi].v=im.v;S.plan[pi].lim=im.lim;
  S.rd[pi]=S.rd[pi]||{};S.pt[pi]={step:'done',t0:Date.parse(im.date.replace(/(\d+)\/(\d+)\/(\d+)/,'$3-$2-$1'))||Date.now()};
  im.ms.forEach(m=>{if(!m.s||!m.e)return;const sl=slotFor(m.id);sl.id=m.id;sl.size=m.s.size||sl.size;if(m.s.k&&m.s.k.length===20)sl.k=m.s.k;S.rd[pi][m.id]={s:m.s,e:m.e}});
  const sz=(S.meters.find(m=>m.size)||{}).size;if(reset&&sz){S.batch.size=sz;S.batch.model=sz>15?'MJ':S.batch.model;S.batch.q3Custom=false;const s0=q3Of(S.batch.model,sz);if(s0)S.batch.q3=s0}
  S.batch.nm=Math.max(S.meters.length,S.batch.nm);S.cur=Math.min(S.cur,S.plan.length-1)}

<script>

/* ---------- ① ตั้งค่า ---------- */
function fld(label,path,type='text',extra=''){const v=path.split('.').reduce((o,k)=>o[k],S);return`<div class="fld"><label>${label}</label><input type="${type}" data-f="${path}" value="${esc(type==='datetime-local'?ldt(v):v)}" ${extra}></div>`}
function sel(label,path,opts,extra=''){const v=path.split('.').reduce((o,k)=>o[k],S);return`<div class="fld"><label>${label}</label><select data-f="${path}" ${extra}>${opts.map(o=>`<option value="${o[0]}" ${String(o[0])===String(v)?'selected':''}>${o[1]}</option>`).join('')}</select></div>`}
function q3Info(){const b=S.batch,s=q3Std();if(!s)return'';const same=Math.abs(b.q3-s)<1e-9;
  return same?`<p class="pill ok" style="white-space:normal;margin:4px 0">✔ Q3 ตรงมาตรฐานของ ${MODEL(b.model)} ${b.size} mm = ${fx(s)} L/h (${fx(s/1000,2)} m³/h)</p>`:`<p class="pill bad" style="white-space:normal;margin:4px 0">⚠ Q3 ที่ตั้งไว้ ${fx(b.q3)} L/h ไม่ตรงค่ามาตรฐานของ ${MODEL(b.model)} ${b.size} mm (${fx(s)} L/h) &nbsp;<button class="btn sm" data-a="q3std">ใช้ค่ามาตรฐาน + สร้างแผนใหม่</button>${b.q3Custom?'':' <button class="btn sm" data-a="q3keep">คงค่านี้</button>'}</p>`}
function q3Table(){const b=S.batch,cur=b.model+b.size;
  const rows=SIZES.map(sz=>{const sj=q3Of('SJ',sz),mj=q3Of('MJ',sz),q=qs(q3Of(b.model,sz)||0,b.R),on=sz===b.size;
    return`<tr class="${on?'cur':''}"><td><b>${sz}</b></td><td><input class="in" type="number" data-q3m="SJ${sz}" value="${sj||''}" style="width:80px"></td><td><input class="in" type="number" data-q3m="MJ${sz}" value="${mj||''}" style="width:80px"></td><td>${flowT(rs3(q.q1))}</td><td>${flowT(rs3(q.q2))}</td><td>${flowT(rs3(q.q3))}</td><td>${flowT(rs3(q.q4))}</td></tr>`}).join('');
  return`<details class="card cfgd" style="margin-top:12px"><summary>📐 ตาราง Q3 / Q1 / Q2 / Q4 ทุกขนาด (R${b.R} · ${MODEL(b.model)}) <small>(แก้ Q3 ได้ ระบบจำค่าที่แก้)</small></summary>
  <div class="tw"><table><thead><tr><th>ขนาด (mm)</th><th>Q3 Single Jet (L/h)</th><th>Q3 Multijet (L/h)</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="hint">Q1 = Q3 ÷ R · Q2 = 1.6 × Q1 · Q4 = 1.25 × Q3 (L/h) · ค่า Q3 เริ่มต้นตามอนุกรมมาตรฐาน ISO 4064 (2.5 / 4 / 6.3 / 10 / 16 / 25 / 40 / 63 / 100 / 160 / 250 m³/h) — ถ้าข้อกำหนดผลิตภัณฑ์ของคุณต่างจากนี้ ให้แก้ในตาราง</p></details>`}
function qchips(){const Q=qs(S.batch.q3,S.batch.R);return[['Q1',Q.q1,'ต่ำสุด'],['Q2',Q.q2,'ช่วงเปลี่ยนเกณฑ์'],['Q3',Q.q3,'ใช้งานต่อเนื่อง'],['Q4',Q.q4,'สูงสุด']].map(q=>`<div class="kpi" style="--c:var(--acc)"><small>${q[0]} · ${q[2]}</small><b>${flowT(rs3(q[1]))}</b><em>L/h · ${fx(q[1]/1000,3)} m³/h</em></div>`).join('')}
function vSetup(A){const b=S.batch;
  return`<div class="grid g2">
  <div class="card"><h2><em>📋</em>ข้อมูล Batch และผู้ทดสอบ</h2><p class="sub">ข้อมูลนี้จะขึ้นในรายงาน PDF / Excel และหัวไฟล์ Batch ที่ส่งเข้า Web App</p>
   <div class="fr">${fld('Batch ID','batch.id')}${fld('วันที่-เวลาเริ่มทดสอบ','batch.date','datetime-local')}</div>
   <div class="fr">${fld('ผู้ทดสอบ (Operator)','batch.tester','text','placeholder="ชื่อ-สกุล"')}${fld('ผู้ตรวจสอบ / อนุมัติ','batch.checker','text','placeholder="ชื่อ-สกุล"')}</div>
   <div class="fr">${fld('หน่วยงาน / ชื่อรายงาน','batch.org')}${fld('แท่นทดสอบ (Bench ID)','batch.bench','text','placeholder="เช่น TB-01"')}</div>
   ${fld('รุ่นฮาร์ดแวร์ / หมายเหตุรุ่น','batch.hw','text','placeholder="เช่น SMCV4 rev.C"')}
   <div class="fld"><label>หมายเหตุ</label><textarea rows="2" data-f="batch.note">${esc(b.note)}</textarea></div></div>
  <div class="card"><h2><em>🔧</em>มิเตอร์ที่ทดสอบ</h2><p class="sub">ขนาดอ่านจาก NFC (Addr 76) ได้อัตโนมัติ — เลือกเองได้ถ้ายังไม่อ่าน</p>
   <div class="fr">${sel('ประเภทมิเตอร์','batch.mtype',[['nfc','ดิจิทัล SMCV4 (อ่าน NFC)'],['mech','แมคคานิค (ถ่ายภาพ/คีย์ค่าหน้าปัด)']])}${MECH()?sel('ทศนิยมบนหน้าปัด (ตัวเลขสีแดง)','batch.mfrac',[[0,'0 หลัก · ละเอียด 1 m³'],[1,'1 หลัก · 100 L'],[2,'2 หลัก · 10 L'],[3,'3 หลัก · 1 L'],[4,'4 หลัก · 0.1 L'],[5,'5 หลัก · 0.01 L (LCD SMCV4)']]):'<div class="fld"><label>&nbsp;</label><p class="hint" style="margin:0">อ่านค่า ID · K · รอบ · แบตเตอรี่ ผ่าน NFC</p></div>'}</div>
   <div class="fr3">${sel('ชนิด','batch.model',[['MJ','Multijet'],['SJ','Single Jet']])}${sel('ขนาด (mm)','batch.size',SIZES.map(s=>[s,s+' mm']))}${sel('คลาส R','batch.R',RCL.map(r=>[r,'R'+r]))}</div>
   <div class="fr3">${fld('Q3 (L/h)','batch.q3','number','min="1" step="any"')}${fld('จำนวนช่องมิเตอร์','batch.nm','number','min="1" max="40"')}${fld('Batch ผ่านเมื่อมาตรผ่านครบ ≥ (%)','batch.passPct','number','min="1" max="100"')}</div>
   <div id="qchips" class="grid g4" style="gap:10px;margin:6px 0 12px">${qchips()}</div>
   ${q3Info()}<p class="hint">Q1 = Q3 ÷ R · Q2 = 1.6 × Q1 · Q4 = 1.25 × Q3 (Q3 เปลี่ยนตามชนิด/ขนาดอัตโนมัติ แก้ไขได้)</p>${q3Table()}
   <div class="fld"><label>ลงทะเบียนมิเตอร์ล่วงหน้า (เลข ID คั่นด้วยเว้นวรรค/บรรทัดใหม่ หรือช่วง 69100200-69100209)</label><textarea rows="2" id="regTxt" placeholder="ไม่ต้องกรอกก็ได้ — แตะ NFC แล้วระบบเติมเข้าช่องว่างให้เอง"></textarea></div>
   <button class="btn sm" data-a="reg">➕ ลงทะเบียน</button></div>
  <div class="card"><h2><em>🎯</em>เกณฑ์ผ่านและวิธีทดสอบ</h2><p class="sub">ใช้กับทุกจุดทดสอบ (แก้เป็นรายจุดได้ที่แท็บ ② แผนทดสอบ)</p>
   <div class="fr">${fld('ผิดพลาดสูงสุด ช่วง Q1 ≤ Q &lt; Q2 (± %)','batch.limLow','number','min="0.1" step="0.1"')}${fld('ผิดพลาดสูงสุด ช่วง Q2 ≤ Q ≤ Q4 (± %)','batch.limHigh','number','min="0.1" step="0.1"')}</div>
   <div class="fr">${fld('ความเบี่ยงเบนอัตราไหลที่ยอมรับ (± %)','batch.flowTol','number','min="0.5" step="0.5"')}${sel('ค่าเริ่มต้นของจุดถัดไป','batch.carry',[['true','ใช้ค่าสิ้นสุดของจุดก่อน (อ่านน้อยลงครึ่งหนึ่ง)'],['false','อ่านใหม่ทุกจุด']])}</div>
   <p class="hint">ปริมาตรจากมิเตอร์ = (ค่าสิ้นสุด − ค่าเริ่มต้น) จาก Addr 188–211 · error = (ปริมาตรมิเตอร์ − ปริมาตรอ้างอิง) ÷ ปริมาตรอ้างอิง × 100 · ความละเอียดมิเตอร์ 0.01 L</p></div>
  <div class="card"><h2><em>🧪</em>อุปกรณ์อ้างอิงและสภาพแวดล้อม</h2><p class="sub">ควรบันทึกเพื่อการสอบย้อนกลับ (Traceability)</p>
   <div class="fr">${fld('อุปกรณ์อ้างอิง (ตาชั่ง / มาตรมาตรฐาน)','batch.ref','text','placeholder="ชื่อ / รหัสเครื่อง"')}${fld('วันหมดอายุการสอบเทียบ','batch.refDue','date')}</div>
   <div class="fr">${fld('อุณหภูมิน้ำ (°C)','batch.tmpC','number','step="0.1"')}${fld('แรงดันทดสอบ (bar)','batch.bar','number','step="0.1"')}</div>
   ${refWarn()}</div></div>`}
function refWarn(){const d=S.batch.refDue;if(!d)return'';const x=Date.parse(d);return x&&x<Date.now()?'<p class="pill bad">⚠ อุปกรณ์อ้างอิงหมดอายุการสอบเทียบแล้ว — ผลทดสอบอาจใช้รับรองไม่ได้</p>':'<p class="pill ok">✔ อยู่ในอายุการสอบเทียบ</p>'}

/* ---------- ② แผนทดสอบ ---------- */
function chartSvg(o){o=o||{};const W=o.w||680,H=o.h||280,L=46,Rr=14,T=14,B=34,pl=S.plan,Q=qs(S.batch.q3,S.batch.R);
  const f0=Math.min(...pl.map(p=>p.f),Q.q1)*0.7,f1=Math.max(...pl.map(p=>p.f),Q.q4)*1.35,lg=Math.log10;
  const x=f=>L+(lg(f)-lg(f0))/(lg(f1)-lg(f0))*(W-L-Rr),Ll=S.batch.limLow,Lh=S.batch.limHigh;
  let ym=Math.max(8,Math.ceil(Ll+2));if(o.series)o.series.forEach(s=>s.pts.forEach(p=>{if(p&&isFinite(p.e))ym=Math.max(ym,Math.ceil(Math.abs(p.e)+1))}));
  const y=e=>T+(ym-e)/(2*ym)*(H-T-B),x2=x(Math.max(f0,Math.min(f1,Q.q2)));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="กราฟ % error เทียบอัตราการไหล" style="font-family:Sarabun,sans-serif">`;
  s+=`<rect x="${L}" y="${y(Ll)}" width="${x2-L}" height="${y(-Ll)-y(Ll)}" fill="#fde68a" opacity=".38"/><rect x="${x2}" y="${y(Lh)}" width="${W-Rr-x2}" height="${y(-Lh)-y(Lh)}" fill="#6ee7b7" opacity=".38"/>`;
  s+=`<path d="M${L} ${y(Ll)}H${x2}V${y(Lh)}H${W-Rr}M${L} ${y(-Ll)}H${x2}V${y(-Lh)}H${W-Rr}" fill="none" stroke="#be123c" stroke-width="1.4" stroke-dasharray="5 4"/>`;
  for(let e=-ym;e<=ym;e+=ym>8?4:2)s+=`<line x1="${L}" x2="${W-Rr}" y1="${y(e)}" y2="${y(e)}" stroke="${e===0?'#0b7ea4':'#d3e2ec'}" stroke-width="${e===0?1.6:1}"/><text x="${L-6}" y="${y(e)+4}" text-anchor="end" font-size="11" fill="#5d7586">${e>0?'+':''}${e}</text>`;
  pl.forEach((p,i)=>{s+=`<line x1="${x(p.f)}" x2="${x(p.f)}" y1="${T}" y2="${H-B}" stroke="#9ec7d8" stroke-dasharray="2 4"/><text x="${x(p.f)}" y="${H-B+15}" text-anchor="middle" font-size="11" font-weight="700" fill="#0d2b3e">${flowT(p.f)}</text><text x="${x(p.f)}" y="${H-B+28}" text-anchor="middle" font-size="10" fill="#5d7586">${esc(p.l)}</text>`});

    <div class="card" style="margin:0"><h2><em>📊</em>จุดนี้โดยรวม</h2><div class="grid g4" style="gap:10px"><div class="kpi" style="--c:var(--ok)"><small>ผ่าน</small><b>${P.pass}/${P.n}</b><em>มิเตอร์</em></div><div class="kpi" style="--c:var(--acc)"><small>เฉลี่ย</small><b>${sg(P.mean)}</b><em>%</em></div><div class="kpi" style="--c:#7c3aed"><small>ต่ำสุด</small><b>${sg(P.min)}</b><em>%</em></div><div class="kpi" style="--c:#f59e0b"><small>สูงสุด</small><b>${sg(P.max)}</b><em>%</em></div></div></div></div></div>`}

/* ---------- ④ ผลสรุป ---------- */
function matrix(A,cls=''){const hd=S.plan.map(p=>`<th>${flowT(p.f)}<br><small style="font-weight:400">${esc(p.l)} · ±${p.lim}%</small></th>`).join('');
  const body=A.mids.map(id=>{const m=A.M[id];return`<tr><td class="l mono"><b>${esc(id)}</b></td>${m.cells.map((c,i)=>`<td class="${c&&c.valid?heat(c.err,S.plan[i].lim):'hn'}">${c&&c.valid?sg(c.err):'–'}</td>`).join('')}<td>${m.tested?m.pass+'/'+S.plan.length:'–'}</td><td><span class="pill ${VD[m.verdict][0]}">${m.verdict==='pass'?'ผ่านครบ':m.verdict==='fail'?'ตก '+m.fail+' จุด':'รอ'}</span></td></tr>`}).join('');
  const foot=[['เฉลี่ย %',p=>sg(p.mean)],['ต่ำสุด … สูงสุด',p=>p.n?sg(p.min,1)+' … '+sg(p.max,1):'–'],['ผ่าน / ทดสอบ',p=>p.n?p.pass+'/'+p.n:'–']].map(f=>`<tr style="background:var(--card2);font-weight:700"><td class="l">${f[0]}</td>${A.P.map(p=>`<td>${f[1](p)}</td>`).join('')}<td colspan="2"></td></tr>`).join('');
  return`<div class="tw ${cls}"><table><thead><tr><th class="l">มิเตอร์</th>${hd}<th>ผ่าน</th><th>สรุป</th></tr></thead><tbody>${body||'<tr><td colspan="99" class="hint">ยังไม่มีผลทดสอบ</td></tr>'}${foot}</tbody></table></div>`}
function kGrid(A){const fill=fillK?kFill(A.kRec):A.kRec.map(r=>r.prop),KR=kRef(S.batch.model,S.batch.size),bands=RPM_MAP.map((m,i)=>'≈'+fx(KR.q[i],KR.q[i]<100?1:0)+' L/h'+(KR.est[i]?'*':''));
  return`<div class="kk">${A.kRec.map((r,i)=>{const k=fill[i],tested=r.prop!=null,dl=k&&r.cur?(k/r.cur-1)*100:null;return`<div class="${tested?'an':''}"><small title="ช่วง RPM ${i===0?'≤'+RPM_MAP[0]:i===19?'>'+RPM_MAP[18]:RPM_MAP[i-1]+'–'+RPM_MAP[i]}">K${i+1} · ${bands[i]}</small><b>${k?fx(k):(r.cur?fx(r.cur):'–')}</b><em>${r.cur?fx(r.cur)+' → '+(dl!=null?sg(dl,1)+'%':'คงเดิม'):'ไม่มีค่าเดิม'}${tested?' · '+r.n+' ค่า':''}</em></div>`}).join('')}</div><p class="hint" style="margin-top:8px">อัตราไหลของแต่ละดัชนี (L/h) ของ ${MODEL(S.batch.model)} ${S.batch.size} mm · ${esc(KR.src)}${KR.est.some(x=>x)?' · * = ประมาณการ':''}</p>`}
function kPtsTable(A){const rows=A.kPts.filter(r=>r.n).map(r=>`<tr><td><b>${esc(S.plan[r.i].l)}</b> · ${flowT(S.plan[r.i].f)} L/h</td><td>${fx(r.rpm,1)}</td><td>${fx(r.kObs)}</td><td><b>${fx(r.kNeed)}</b></td><td class="${heat((r.kNeed/r.kObs-1)*100,3)}">${sg((r.kNeed/r.kObs-1)*100,2)}%</td><td><b>K${Math.round(r.idx)+1}</b></td><td>${r.idxTab==null?'–':'K'+(Math.round(r.idxTab)+1)}</td></tr>`).join('');
  return rows?`<div class="tw"><table><thead><tr><th class="l">จุดทดสอบ</th><th>รอบ/นาที</th><th>K ที่มิเตอร์ใช้</th><th>K ที่ต้องใช้</th><th>ปรับ</th><th>ดัชนี K ตามอัตราไหล</th><th>ดัชนี K ที่ใกล้สุด</th></tr></thead><tbody>${rows}</tbody></table></div><p class="hint">K ที่มิเตอร์ใช้ = ปริมาตรที่มิเตอร์แสดง × 10⁶ ÷ จำนวนรอบ · K ที่ต้องใช้ = ปริมาตรอ้างอิง × 10⁶ ÷ จำนวนรอบ (ค่ากลางของทั้ง Batch) · ถ้าสองดัชนีไม่ตรงกัน ให้เทียบกับ Studio K ของ Web App</p>`:'<p class="hint">ยังไม่มีข้อมูลจำนวนรอบ (Addr 184–186)</p>'}
function vRes(A){const v=VD[A.verdict],pts=S.plan;
  const warn=planWarn();
  const ser=A.mids.map(id=>({id,pass:A.M[id].verdict!=='fail',pts:A.M[id].cells.map((c,i)=>c&&c.valid?{e:c.err,ok:c.pass,f:pts[i].f}:null)}));
  return`${warn}<div class="grid g4" style="margin-bottom:18px"><div class="kpi" style="--c:${A.verdict==='pass'?'var(--ok)':A.verdict==='fail'?'var(--bad)':'#94a3b8'}"><small>ผลสรุป Batch</small><b><span class="verdict ${v[0]}" style="font-size:1.25rem;padding:2px 14px">${v[1]}</span></b><em>เกณฑ์: มาตรผ่านครบ ≥ ${S.batch.passPct}%</em></div>
   <div class="kpi" style="--c:var(--ok)"><small>มิเตอร์ที่ผ่านครบทุกจุด</small><b>${A.full}/${A.nm}</b><em>${fx(A.pct,1)}% · ตก ${A.nfail} · รอ ${A.pend}</em></div>
   <div class="kpi" style="--c:var(--acc)"><small>จุดทดสอบที่ผ่าน (ทุกมิเตอร์)</small><b>${A.cellsPass}/${A.cellsAll}</b><em>${A.cellsAll?fx(A.cellsPass/A.cellsAll*100,1):0}% · ${A.ptsDone}/${pts.length} อัตราไหล</em></div>
   <div class="kpi" style="--c:#f59e0b"><small>error เฉลี่ย / สูงสุด</small><b>${sg(A.mean)} / ${sg(A.worst)}</b><em>% (สูงสุดคือค่าที่ห่างศูนย์มากสุด)</em></div></div>
  <div class="card"><h2><em>🧮</em>ตารางผล % error รายมิเตอร์</h2><p class="sub">สีเขียว ≤ 50% ของเกณฑ์ · เหลือง 50–80% · ส้ม 80–100% · แดง เกินเกณฑ์</p>${matrix(A)}</div>
  ${MECH()?'':batCard(A)}
  <div class="grid g2"><div class="card"><h2><em>📈</em>% error เทียบอัตราการไหล</h2><p class="sub">เส้นฟ้า = ผ่าน · เส้นแดง = มีจุดเกินเกณฑ์</p>${pts.length?chartSvg({series:ser}):''}</div>
  <div class="card kx"><h2><em>🔩</em>ค่า K รายจุดทดสอบ</h2><p class="sub">ค่า K ที่ต้องใช้ ณ อัตราไหลที่ทดสอบ — ใช้เป็นข้อมูลปรับ K1–K20</p>${kPtsTable(A)}</div></div>
  <div class="card kx"><h2><em>🔧</em>ค่าคงที่ K1–K20 ที่แนะนำ</h2><p class="sub">K = ปริมาตรต่อ 1 รอบใบพัด (µL/รอบ) · K ใหม่ = ปริมาตรอ้างอิง × 10⁶ ÷ จำนวนรอบ (ค่ากลางของมิเตอร์ทั้ง Batch) · ช่องฟ้า = ดัชนีที่ทดสอบจริง</p>
   <label class="hint"><input type="checkbox" id="fillK" ${fillK?'checked':''}> สอดแทรกดัชนีที่ไม่ได้ทดสอบ</label> &nbsp; <label class="hint"><input type="checkbox" id="kMapTab" ${kMapTab?'checked':''}> จับคู่ดัชนีจากค่า K ที่ใกล้ที่สุด (ไม่เลือก = จัดตามอัตราไหลของรุ่น/ขนาดนี้)</label>${A.kRec.some(r=>r.prop!=null)?kGrid(A):'<p class="hint">ยังไม่มีข้อมูลจำนวนรอบ (Addr 184–186) — ใช้โหมด “แท่นเทส” หรืออ่านส่วนหัว 0–211 ในแอป หรือไฟล์ .bin เต็ม</p>'}
   <div style="margin-top:10px"><button class="btn sm" data-a="kcopy">📋 คัดลอกค่า K (BCD 8 หลัก)</button></div></div>`}

/* ---------- ⑤ รายงาน ---------- */
function reportHtml(A){const b=S.batch,v=VD[A.verdict],pts=S.plan,Q=qs(b.q3,b.R);
  const ser=A.mids.map(id=>({id,pass:A.M[id].verdict!=='fail',pts:A.M[id].cells.map((c,i)=>c&&c.valid?{e:c.err,ok:c.pass,f:pts[i].f}:null)}));
  const ig=[['Batch ID',b.id],['วันที่ทดสอบ',fdt(b.date)],['ผู้ทดสอบ',b.tester||'—'],['ผู้ตรวจสอบ',b.checker||'—'],['รุ่น / ขนาด',MODEL(b.model)+' '+b.size+' mm'],['คลาส / Q3',`R${b.R} · Q3 ${fx(b.q3)} L/h`],['Q1 / Q2 / Q4',`${flowT(rs3(Q.q1))} / ${flowT(rs3(Q.q2))} / ${flowT(rs3(Q.q4))} L/h`],['เกณฑ์ผ่าน',`±${b.limLow}% (ต่ำ) · ±${b.limHigh}% (สูง)`],['แท่นทดสอบ',b.bench||'—'],['อุปกรณ์อ้างอิง',(b.ref||'—')+(b.refDue?' · หมดอายุ '+b.refDue:'')],['อุณหภูมิ / แรงดัน',(b.tmpC||'—')+' °C · '+(b.bar||'—')+' bar'],['จำนวนมิเตอร์ / จุด',`${A.nm} ตัว · ${pts.length} จุด`]];
  return`<div class="paper"><div class="hd"><svg width="54" height="54" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="none" stroke="#0b7ea4" stroke-width="3"/><path d="M32 12c8 10 13 16 13 23a13 13 0 0 1-26 0c0-7 5-13 13-23z" fill="#14b8a6"/><path d="M24 36l5 5 11-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
   <div style="flex:1"><h1>รายงานผลการทดสอบมิเตอร์น้ำ SMCV4</h1><small>${esc(b.org)} · Test Bench Report · พิมพ์เมื่อ ${fdt(Date.now())}</small></div><div style="text-align:right"><span class="verdict ${v[0]}">${v[1]}</span></div></div>
   <div class="ig">${ig.map(x=>`<div><small>${x[0]}</small><b>${esc(x[1])}</b></div>`).join('')}</div>
   <div class="kg"><div class="kpi"><small>มิเตอร์ผ่านครบ</small><b>${A.full}/${A.nm}</b><em>${fx(A.pct,1)}%</em></div><div class="kpi" style="--c:var(--ok)"><small>จุดทดสอบที่ผ่าน</small><b>${A.cellsPass}/${A.cellsAll}</b><em>${A.cellsAll?fx(A.cellsPass/A.cellsAll*100,1):0}%</em></div><div class="kpi" style="--c:#f59e0b"><small>error เฉลี่ย</small><b>${sg(A.mean)}%</b><em>ค่ากลางทั้ง Batch</em></div><div class="kpi" style="--c:var(--bad)"><small>error สูงสุด</small><b>${sg(A.worst)}%</b><em>ห่างศูนย์มากสุด</em></div></div>
   <h3>ผล % error รายมิเตอร์</h3>${matrix(A)}
   <h3>กราฟ % error เทียบอัตราการไหล</h3>${pts.length?chartSvg({series:ser,w:900,h:300}):''}
   ${MECH()?'':`<h3>ค่า K รายจุดทดสอบ</h3>${kPtsTable(A)}<h3>ค่าคงที่ K1–K20 ที่แนะนำ (µL/รอบ)</h3>${A.kRec.some(r=>r.prop!=null)?kGrid(A):'<p class="hint">ไม่มีข้อมูลจำนวนรอบ</p>'}`}
   ${MECH()?'':`<h3>แบตเตอรี่ระหว่างทดสอบ</h3>${batTable(A)}`}
   <h3>ตรวจสอบคุณภาพข้อมูล</h3>${qcList(A)}
   ${b.note?`<h3>หมายเหตุ</h3><p>${esc(b.note)}</p>`:''}
   <div class="sg"><div>ผู้ทดสอบ<br><b>${esc(b.tester||'')}</b></div><div>ผู้ตรวจสอบ<br><b>${esc(b.checker||'')}</b></div><div>ผู้อนุมัติ</div></div></div>`}
function qcList(A){const out=[];A.mids.forEach(id=>A.M[id].cells.forEach((c,i)=>{if(c&&c.flags.length)out.push(`<tr><td class="l mono">${esc(id)}</td><td>${esc(S.plan[i].l)} · ${flowT(S.plan[i].f)} L/h</td><td class="l">${c.flags.map(esc).join(' · ')}</td></tr>`)}));
  const bad=A.P.filter((p,i)=>{const fa=p.fa;return fa&&Math.abs(fa-S.plan[i].f)/S.plan[i].f*100>S.batch.flowTol}).map(p=>`<tr><td class="l">—</td><td>${esc(S.plan[p.i].l)}</td><td class="l">อัตราไหลจริง ${fx(p.fa,1)} L/h เบี่ยงจากที่ตั้ง ${flowT(S.plan[p.i].f)} เกิน ±${S.batch.flowTol}%</td></tr>`);
  const rows=[...out,...bad];return rows.length?`<div class="tw"><table><thead><tr><th class="l">มิเตอร์</th><th>จุด</th><th class="l">ข้อสังเกต</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<p class="pill ok">✔ ไม่พบข้อสังเกตด้านคุณภาพข้อมูล</p>'}
function vRep(A){return`<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"><button class="btn p" data-a="pdf">🖨 พิมพ์ / บันทึกเป็น PDF</button><button class="btn" data-a="xlsx">⬇ Excel</button><span class="hint" style="align-self:center">ตัวอย่างหน้ารายงาน (A4 แนวนอน) — กด “พิมพ์” แล้วเลือก “บันทึกเป็น PDF”</span></div>${reportHtml(A)}`}

   <div style="text-align:center;margin-top:10px">${!e?'<span class="pill mut">รอแตะมิเตอร์…</span>':e.ok===null?'<span class="pill warn">กำลังส่ง…</span>':e.ok?'<span class="pill ok">✔ ส่งขึ้นจอคอมพิวเตอร์แล้ว</span>':'<span class="pill bad">✖ ส่งไม่สำเร็จ ('+esc(RL.err)+') — ตรวจอินเทอร์เน็ตของมือถือ แล้วแตะใหม่</span>'}</div>
   <div class="log" style="margin-top:12px">${SENT.slice(0,8).map(x=>`<div class="${x.ok===false?'bd':''}"><b class="mono">${esc(x.r.id)}</b> · ${fx(x.r.vol/1e5,5)} m³ · ${x.ok===null?'กำลังส่ง':x.ok?'ส่งแล้ว':'ล้มเหลว'} <span class="hint">${fdt(x.t).slice(11)}</span></div>`).join('')||'<div class="hint">ยังไม่มีการส่ง</div>'}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn sm" data-a="relay">⚙ ตั้งค่าการเชื่อมต่อ</button><button class="btn sm" data-a="rltest">🧪 ส่งสัญญาณทดสอบ</button></div></div>`}

  <div class="fr"><div class="fld"><label>เซิร์ฟเวอร์รีเลย์ (ขั้นสูง)</label><input id="rlSrv" value="${esc(RL.server)}"></div>
  <div class="fld"><label>เสียงเตือน</label><select id="rlBeep"><option value="1" ${RL.beep?'selected':''}>เปิด (ติ๊ง เมื่ออ่านสำเร็จ / ต่ำเมื่อไม่ผ่าน)</option><option value="0" ${RL.beep?'':'selected'}>ปิด</option></select></div></div>

function demo(){
  const K=[21539,20113,19607,19119,18900,18700,18400,18200,18000,17900,17800,17700,17600,17500,17400,17300,17200,17150,17100,17057];
  S=defState();const b=S.batch;Object.assign(b,{tester:'สมชาย ใจดี',checker:'วิไล รักงาน',bench:'TB-01',hw:'SMCV4 rev.C',ref:'ตาชั่ง Mettler KCC150 #A-12',refDue:ldt(Date.now()+86400000*120).slice(0,10),tmpC:'24.6',bar:'3.0',size:25,model:'MJ',R:160,q3:6300});
  S.plan=buildPlan();S.meters=[];for(let i=0;i<10;i++)S.meters.push({id:String(69100200+i),size:25,k:K.slice()});
  const bias=[0.3,0.8,-0.2,2.6,0.5,1.1,-0.6,0.2,-2.7,0.4],curve=f=>f<60?3.4:f<100?1.3:f<1000?0.7:f<3000?0.9:1.6;let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647-.5};
  const sv=S.meters.map((m,i)=>({vol:Math.round((2+rnd()*3)*1e5),rev:Math.round(150000+Math.abs(rnd())*700000)}));let t=Date.now()-S.plan.reduce((a,p)=>a+p.v/p.f*3600e3+240e3,0);
  const mk=(m,vol,rev,tt)=>({id:m.id,size:25,k:K.slice(),k8:K.map(k8),rev,vol,rvol:0,flow:0,time:p2(new Date(tt).getHours())+'.'+p2(new Date(tt).getMinutes()),date:fdate(tt).replace(/\//g,'-'),ev:'11',res:'FF',bat:3.31,dir:1,uart:0,calc:0,raw:'',ts:tt});
  S.plan.forEach((p,pi)=>{const t0=t+120e3,t1=t0+p.v/p.f*3600e3;S.pt[pi]={step:'done',t0,t1};S.rd[pi]={};
    S.meters.forEach((m,i)=>{const e=curve(p.f)+bias[i]+rnd()*0.4,vm=Math.round(p.v*(1+e/100)*100)/100;let idx=10,dRev=0;
      for(let k=0;k<20;k++){const dr=Math.round(vm*1e6/K[k]),rpm=dr/((t1-t0)/60000);if(kIdx(rpm)===k){idx=k;dRev=dr;break}}if(!dRev)dRev=Math.round(vm*1e6/K[idx]);
      const s=Object.assign(mk(m,sv[i].vol,sv[i].rev,t0),{carried:pi>0});sv[i].vol+=Math.round(vm*100);sv[i].rev=(sv[i].rev+dRev)%1e6;const en=mk(m,sv[i].vol,sv[i].rev,t1);S.rd[pi][m.id]={s,e:en}});
    t=t1+120e3});
